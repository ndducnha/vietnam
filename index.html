g và những người đã học quân sự ở nước ngoài. Ít lâu sau ngày thành lập, đội liên tiếp thắng hai trận Phai Khắt và Nà Ngần, mở đầu truyền thống đánh thắng trận đầu của Quân đội ta.\",\n      \"source\": \"Đội Việt Nam Tuyên truyền Giải phóng quân, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/home/intro/detailnews/\"\n    },\n    {\n      \"id\": 52,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"9/3/1945\",\n      \"title\": \"Nhật đảo chính Pháp; cao trào kháng Nhật\",\n      \"description\": \"Ngày 9 tháng 3 năm 1945, Nhật đảo chính, hất cẳng Pháp, giành quyền cai trị Đông Dương. Ban Thường vụ Trung ương Đảng Cộng sản Đông Dương họp và ban hành Chỉ thị Nhật Pháp bắn nhau và hành động của chúng ta, chủ trương phát động cao trào kháng Nhật cứu nước làm tiền đề cho Tổng khởi nghĩa.\",\n      \"source\": \"Ban Thường vụ Trung ương Đảng ra Chỉ thị Nhật - Pháp bắn nhau và hành động của chúng ta, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/tu-lieu-tham-khao-cuoc-thi-trac-nghiem-tim-hieu-90-nam-lich-su-ve-vang-cua-dang-cong-san-viet-nam/tu-lieu-cuoc-thi/ban-thuong-vu-trung-uong-dang-ra-chi-thi-nhat--phap-ban-nhau-va-hanh-dong-cua-chung-ta-536064.html\"\n    },\n    {\n      \"id\": 53,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"8/1945\",\n      \"title\": \"Cách mạng Tháng Tám thành công\",\n      \"description\": \"Đỉnh cao là ngày 19 tháng 8 năm 1945, cuộc tổng khởi nghĩa ở Hà Nội nổ ra với khí thế áp đảo; các đội tự vệ chiến đấu và quần chúng cách mạng chiếm phủ Khâm sai Bắc Bộ, Sở Cảnh sát, Sở Bưu điện, Trại Bảo an binh, chính quyền Bảo Đại - Trần Trọng Kim tan rã. Ngày 23 tháng 8, hàng vạn người tiến vào thành phố Huế, chiếm các công sở trọng yếu và giành chính quyền trong hòa bình; ngày 25 tháng 8, cuộc khởi nghĩa ở Sài Gòn thành công. Nhân dân Việt Nam đã đập tan xiềng xích nô lệ của thực dân Pháp, đánh đuổi quân phát xít Nhật và lật nhào chế độ phong kiến hàng nghìn năm.\",\n      \"source\": \"Cách mạng Tháng 8 và Quốc khánh 2/9/1945 của nước Việt Nam Dân chủ Cộng hòa, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/cach-mang-thang-8-va-quoc-khanh-291945-cua-nuoc-viet-nam-dan-chu-cong-hoa-3310\"\n    },\n    {\n      \"id\": 54,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"2/9/1945\",\n      \"title\": \"Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa\",\n      \"description\": \"Ngày 2 tháng 9 năm 1945, tại Quảng trường Ba Đình, Hà Nội, Chủ tịch Hồ Chí Minh trịnh trọng đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Bản Tuyên ngôn được Người soạn thảo tại nhà số 48 Hàng Ngang, Hà Nội, trong đêm 28 tháng 8 năm 1945.\",\n      \"source\": \"Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hoà, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/hoc-tap-va-lam-theo-tam-guong-dao-duc-ho-chi-minh/van-kien-tu-lieu/chu-tich-ho-chi-minh-doc-tuyen-ngon-doc-lap-khai-sinh-nuoc-viet-nam-dan-chu-cong-hoa-535109.html\"\n    },\n    {\n      \"id\": 55,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"6/1/1946\",\n      \"title\": \"Tổng tuyển cử bầu Quốc hội khóa I\",\n      \"description\": \"Cuộc tổng tuyển cử diễn ra ngày 6 tháng 1 năm 1946 với tỷ lệ cử tri đi bầu đạt 89 phần trăm, bầu ra 333 đại biểu. Trong số đại biểu được bầu, 57 phần trăm là công nhân, nông dân và chiến sĩ cách mạng; có 10 đại biểu nữ và 34 đại biểu là người dân tộc thiểu số. Kỳ họp thứ nhất Quốc hội nước Việt Nam Dân chủ Cộng hòa khai mạc ngày 2 tháng 3 năm 1946.\",\n      \"source\": \"Những sự kiện trọng đại trong Cuộc Tổng tuyển cử đầu tiên, Quốc hội Việt Nam\",\n      \"sourceUrl\": \"https://quochoi.vn/tintuc/Pages/tin-hoat-dong-cua-quoc-hoi.aspx?ItemID=83774\"\n    },\n    {\n      \"id\": 56,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"19/12/1946\",\n      \"title\": \"Toàn quốc kháng chiến bùng nổ\",\n      \"description\": \"Ngày 18 và 19 tháng 12 năm 1946, Ban Thường vụ Trung ương Đảng họp mở rộng tại làng Vạn Phúc, Hà Đông, do Chủ tịch Hồ Chí Minh chủ trì, quyết định phát động toàn quốc kháng chiến. Lời kêu gọi thể hiện ý chí và quyết tâm của toàn Đảng, toàn quân, toàn dân: thà hy sinh tất cả chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ. 20 giờ ngày 19 tháng 12 năm 1946, quân và dân Hà Nội nổ súng mở đầu toàn quốc kháng chiến.\",\n      \"source\": \"Lời kêu gọi Toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh, ngày 19/12/1946, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/tu-lieu-tham-khao-cuoc-thi-trac-nghiem-tim-hieu-90-nam-lich-su-ve-vang-cua-dang-cong-san-viet-nam/tu-lieu-cuoc-thi/loi-keu-goi-toan-quoc-khang-chien-cua-chu-tich-ho-chi-minh-ngay-19121946-535309.html\"\n    },\n    {\n      \"id\": 57,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1950\",\n      \"title\": \"Chiến dịch Biên Giới\",\n      \"description\": \"Chiến dịch Biên giới diễn ra từ ngày 16 tháng 9 đến ngày 17 tháng 10 năm 1950. Ngày 16 tháng 9, các trung đoàn 174 và 209 đánh chiếm cứ điểm Đông Khê nhằm cô lập Cao Bằng, uy hiếp Thất Khê và phá thế trận phòng thủ của quân Pháp trên đường số 4; đến ngày 18, Đông Khê hoàn toàn thất thủ. Sáng sớm ngày 16 tháng 9, từ vị trí quan sát trên núi Báo Đông, Chủ tịch Hồ Chí Minh theo dõi chặt chẽ diễn biến trận Đông Khê mở màn chiến dịch.\",\n      \"source\": \"Chiến dịch Biên giới 1950 (16/9 - 17/10/1950), Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/chien-dich-bien-gioi-1950-169-17101950-3367\"\n    },\n    {\n      \"id\": 58,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"7/5/1954\",\n      \"title\": \"Chiến thắng Điện Biên Phủ\",\n      \"description\": \"Chiến dịch Điện Biên Phủ bắt đầu ngày 13 tháng 3 và kết thúc ngày 7 tháng 5 năm 1954, trải qua 56 ngày đêm chiến đấu gian khổ. Đại tướng Võ Nguyên Giáp được cử làm Chỉ huy trưởng kiêm Bí thư Đảng ủy mặt trận; công tác chuẩn bị tiến hành khẩn trương với khẩu hiệu tất cả cho tiền tuyến, tất cả để chiến thắng. Từ ngày 1 đến ngày 7 tháng 5 năm 1954, quân ta đánh chiếm các cứ điểm phía đông và mở đợt tổng công kích.\",\n      \"source\": \"Chiến thắng lịch sử Điện Biên Phủ (7/5/1954), Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/chien-thang-lich-su-dien-bien-phu-751954-3368\"\n    },\n    {\n      \"id\": 59,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"21/7/1954\",\n      \"title\": \"Hiệp định Genève\",\n      \"description\": \"Ngày 20 tháng 7 năm 1954, Hiệp định đình chỉ chiến sự ở Đông Dương được ký sau 8 phiên toàn thể và 23 phiên hẹp; ngày 21 tháng 7 năm 1954, các bên tham dự ra Tuyên bố cuối cùng của Hội nghị Genève. Hiệp định khẳng định độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam, quy định quân đội nước ngoài rút khỏi Đông Dương. Vĩ tuyến 17 được lấy làm giới tuyến quân sự, các bên nhấn mạnh đây không thể coi là ranh giới chính trị hay lãnh thổ.\",\n      \"source\": \"Hiệp định Giơnevơ năm 1954 về đình chỉ chiến tranh, lập lại hòa bình Đông Dương, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/hiep-dinh-gionevo-nam-1954-ve-dinh-chi-chien-tranh-lap-lai-hoa-binh-dong-duong-3369\"\n    },\n    {\n      \"id\": 60,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1959–1960\",\n      \"title\": \"Phong trào Đồng Khởi\",\n      \"description\": \"Nghị quyết số 15 của Trung ương tháng 1 năm 1959 thể hiện đường lối và phương pháp cách mạng giải phóng miền Nam do Đảng đề ra dưới sự lãnh đạo của Chủ tịch Hồ Chí Minh, mở đường cho phong trào Đồng Khởi. Ngày 1 tháng 1 năm 1960 tại Mỏ Cày, Nguyễn Thị Định, Phó Bí thư Tỉnh ủy, truyền đạt Nghị quyết 15 và chủ trương của Khu ủy khu 8 để phát động quần chúng nổi dậy. Ngày 17 tháng 1 năm 1960, tại ba xã thuộc huyện Mỏ Cày, lực lượng du kích và đấu tranh vũ trang mở đầu phong trào Đồng Khởi.\",\n      \"source\": \"Du kích và tự vệ Bến Tre trong phong trào Đồng khởi năm 1960, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-qdndvn/sa-qdndvn-lstt/sa-qdndvn-lstt-cdtd/b8e51e66-4971-4317-99a5-fa9d9bbbbfc0\"\n    },\n    {\n      \"id\": 61,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1968\",\n      \"title\": \"Tổng tiến công và nổi dậy Tết Mậu Thân\",\n      \"description\": \"Đêm giao thừa Tết Mậu Thân, rạng sáng ngày 30 tháng 1 năm 1968, các lực lượng đồng loạt tiến công và nổi dậy trên toàn miền Nam. Mục tiêu chủ yếu là các thành phố, thị xã và cơ quan đầu não, với ba trọng điểm Sài Gòn, Huế và Đà Nẵng; quân giải phóng đánh vào Tòa đại sứ Mỹ, Dinh Độc Lập, Bộ Tư lệnh Hải quân, Bộ Tổng Tham mưu và làm chủ thành phố Huế trong 25 ngày.\",\n      \"source\": \"Cuộc Tổng tiến công và nổi dậy Xuân Mậu Thân 1968 - sự thống nhất giữa ý Đảng và lòng dân, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://www.mod.gov.vn/vn/chi-tiet/sa-ttsk/sa-tt-qpan/21afb6eb-8c86-4ffa-bf1f-f2ee25df635c\"\n    },\n    {\n      \"id\": 62,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"12/1972\",\n      \"title\": \"Chiến thắng Điện Biên Phủ trên không\",\n      \"description\": \"Ngày 18 tháng 12 năm 1972, quân đội Mỹ mở cuộc tập kích đường không chiến lược vào Hà Nội và nhiều địa phương ở miền Bắc, mang tên Linebacker II. Trong 12 ngày đêm cuối tháng 12 năm 1972, quân và dân ta bắn rơi 81 máy bay, trong đó có 34 chiếc B-52. Ngày 30 tháng 12 năm 1972, Tổng thống Mỹ buộc phải tuyên bố chấm dứt cuộc tập kích đường không chiến lược vào Hà Nội, Hải Phòng và miền Bắc, chấp nhận trở lại bàn đàm phán ở Paris.\",\n      \"source\": \"Hà Nội - Điện Biên Phủ trên không: Nghệ thuật tác chiến phòng không và tầm vóc thời đại, Báo Chính phủ\",\n      \"sourceUrl\": \"https://media.chinhphu.vn/ha-noi-dien-bien-phu-tren-khong-nghe-thuat-tac-chien-phong-khong-va-tam-voc-thoi-dai-102221219140641637.htm\"\n    },\n    {\n      \"id\": 63,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"27/1/1973\",\n      \"title\": \"Hiệp định Paris\",\n      \"description\": \"Ngày 27 tháng 1 năm 1973, Hiệp định về chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam được ký kết tại phòng khánh tiết Trung tâm Hội nghị quốc tế Kléber, Paris, với bốn vị Bộ trưởng Ngoại giao của Việt Nam Dân chủ Cộng hòa, Chính phủ Cách mạng lâm thời miền Nam Việt Nam, Hoa Kỳ và Việt Nam Cộng hòa. Hiệp định buộc Mỹ phải thừa nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam, rút hết quân Mỹ và quân chư hầu ra khỏi miền Nam Việt Nam.\",\n      \"source\": \"Hiệp định Pari năm 1973 - Chấm dứt chiến tranh, lập lại hoà bình ở Việt Nam, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/hiep-dinh-pari-nam-1973-cham-dut-chien-tranh-lap-lai-hoa-binh-o-viet-nam-3379\"\n    },\n    {\n      \"id\": 64,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"30/4/1975\",\n      \"title\": \"Giải phóng miền Nam, thống nhất đất nước\",\n      \"description\": \"Từ Hiệp định Paris, quân xâm lược Mỹ phải rút khỏi Việt Nam, tạo thế xoay chuyển có lợi cho cách mạng Việt Nam. Cuộc kháng chiến tiến lên với đỉnh cao là Chiến dịch Hồ Chí Minh lịch sử, ngày toàn thắng 30 tháng 4 năm 1975 giải phóng hoàn toàn miền Nam, thống nhất đất nước, mở ra kỷ nguyên hòa bình, độc lập, thống nhất và phát triển ở Việt Nam.\",\n      \"source\": \"Hiệp định Pari năm 1973 - Chấm dứt chiến tranh, lập lại hoà bình ở Việt Nam, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/hiep-dinh-pari-nam-1973-cham-dut-chien-tranh-lap-lai-hoa-binh-o-viet-nam-3379\"\n    },\n    {\n      \"id\": 65,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Thống nhất & bảo vệ biên cương\",\n      \"spine\": true,\n      \"date\": \"2/7/1976\",\n      \"title\": \"Đổi tên nước thành Cộng hòa Xã hội chủ nghĩa Việt Nam\",\n      \"description\": \"Kỳ họp thứ nhất Quốc hội khóa VI diễn ra từ ngày 24 tháng 6 đến ngày 3 tháng 7 năm 1976 tại Hà Nội. Tại kỳ họp này, Quốc hội thông qua Nghị quyết về tên nước, quốc kỳ, quốc huy, quốc ca và tổ chức Nhà nước, quyết định đổi tên nước từ Việt Nam Dân chủ Cộng hòa thành nước Cộng hòa xã hội chủ nghĩa Việt Nam và chính thức đặt tên thành phố Sài Gòn - Gia Định là Thành phố Hồ Chí Minh.\",\n      \"source\": \"Quốc hội khoá VI (1976-1981), Quốc hội Việt Nam\",\n      \"sourceUrl\": \"https://quochoi.vn/tulieuquochoi/tulieu/quochoicackhoa/Pages/khoasau.aspx?ItemID=23993\"\n    },\n    {\n      \"id\": 66,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Thống nhất & bảo vệ biên cương\",\n      \"spine\": true,\n      \"date\": \"12/1978\",\n      \"title\": \"Chiến tranh bảo vệ biên giới Tây Nam\",\n      \"description\": \"Sau khi cuộc kháng chiến chống Mỹ kết thúc, chế độ diệt chủng do Pol Pot cầm đầu ở Campuchia kích động hằn thù dân tộc và tiến hành chiến tranh xâm lấn biên giới Tây Nam của Việt Nam. Ngày 23 tháng 12 năm 1978, Quân đội nhân dân Việt Nam mở cuộc phản công chiến lược, đập tan cuộc tiến công của quân Pol Pot.\",\n      \"source\": \"Kỷ niệm 45 năm Ngày chiến thắng chiến tranh bảo vệ biên giới Tây Nam, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/thoi-su/ky-niem-45-nam-ngay-chien-thang-chien-tranh-bao-ve-bien-gioi-tay-nam-657334.html\"\n    },\n    {\n      \"id\": 67,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Thống nhất & bảo vệ biên cương\",\n      \"spine\": true,\n      \"date\": \"2/1979\",\n      \"title\": \"Chiến tranh bảo vệ biên giới phía Bắc\",\n      \"description\": \"Đầu năm 1979, hơn 50 vạn quân cùng nhiều phương tiện chiến tranh đồng loạt tiến công trên toàn tuyến biên giới phía Bắc Việt Nam. Quân và dân sáu tỉnh biên giới phía Bắc gồm Hoàng Liên Sơn, Lai Châu, Hà Tuyên, Cao Bằng, Lạng Sơn và Quảng Ninh đã đứng lên chiến đấu chống quân xâm lược.\",\n      \"source\": \"Sự thật lịch sử, tính chính nghĩa của cuộc chiến đấu bảo vệ biên giới phía Bắc, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/tu-tuong-van-hoa/su-that-lich-su-tinh-chinh-nghia-cua-cuoc-chien-dau-bao-ve-bien-gioi-phia-bac-513471.html\"\n    },\n    {\n      \"id\": 68,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": true,\n      \"date\": \"12/1986\",\n      \"title\": \"Đại hội VI khởi xướng công cuộc Đổi mới\",\n      \"description\": \"Đại hội đại biểu toàn quốc lần thứ VI của Đảng họp tại Hà Nội từ ngày 15 đến ngày 18 tháng 12 năm 1986. Đại hội xác định thái độ nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật, nghiêm khắc chỉ ra nguyên nhân chủ quan của tình trạng khó khăn từ những sai lầm, khuyết điểm trong lãnh đạo và quản lý. Đại hội đề ra đường lối đổi mới toàn diện đất nước.\",\n      \"source\": \"Đại hội đại biểu toàn quốc lần thứ VI, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://daihoi13.dangcongsan.vn/cac-ky-dai-hoi/tu-dai-hoi-den-dai-hoi/dai-hoi-dai-bieu-toan-quoc-lan-thu-vi-250\"\n    },\n    {\n      \"id\": 69,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"14/3/1988\",\n      \"title\": \"Sự kiện Gạc Ma, bảo vệ chủ quyền biển đảo\",\n      \"description\": \"Ngày 14 tháng 3 năm 1988, 64 cán bộ, chiến sĩ Hải quân nhân dân Việt Nam đã anh dũng giữ vững vị trí, chiến đấu chống quân xâm lược và hy sinh trong trận chiến bảo vệ đảo Gạc Ma thuộc quần đảo Trường Sa của Việt Nam, tại khu vực biển Cô Lin, Len Đao, Gạc Ma.\",\n      \"source\": \"Dâng hương tưởng niệm các liệt sĩ hy sinh bảo vệ đảo Gạc Ma, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/tu-tuong-van-hoa/dang-huong-tuong-niem-cac-liet-si-hy-sinh-bao-ve-dao-gac-ma-633361.html\"\n    },\n    {\n      \"id\": 70,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"1992\",\n      \"title\": \"Ban hành Hiến pháp 1992\",\n      \"description\": \"Kể từ năm 1986, Đảng chủ trương tiến hành đổi mới kinh tế, phát triển nền kinh tế hàng hóa nhiều thành phần theo cơ chế thị trường có sự quản lý của Nhà nước. Trong điều kiện phát triển mới của đất nước, Hiến pháp năm 1992 được ban hành thay thế cho Hiến pháp năm 1980, tạo cơ sở pháp lý vững chắc để xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa và bảo vệ các quyền, lợi ích hợp pháp của công dân.\",\n      \"source\": \"Hiến pháp năm 1992, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-quy-pham-phap-luat/hien-phap-nam-1992-240\"\n    },\n    {\n      \"id\": 71,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"28/7/1995\",\n      \"title\": \"Gia nhập ASEAN (thành viên thứ 7)\",\n      \"description\": \"Ngày 28 tháng 7 năm 1995, lễ trọng thể kết nạp Việt Nam làm thành viên thứ bảy của ASEAN diễn ra tại Brunei. Cùng dịp này, Việt Nam lần đầu tham dự Hội nghị Ngoại trưởng ASEAN lần thứ 28 với tư cách thành viên đầy đủ.\",\n      \"source\": \"Thông tin cơ bản về ASEAN và quan hệ Việt Nam - ASEAN, Bộ Ngoại giao\",\n      \"sourceUrl\": \"https://mofa.gov.vn/tin-chi-tiet/chi-tiet/thong-tin-co-ban-ve-asean-va-quan-he-viet-nam-asean-589.html\"\n    },\n    {\n      \"id\": 72,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"13/7/2000\",\n      \"title\": \"Ký Hiệp định Thương mại song phương Việt Nam – Hoa Kỳ (BTA)\",\n      \"description\": \"Ngày 13 tháng 7 năm 2000 tại Washington, Hiệp định Thương mại Việt Nam - Hoa Kỳ được ký kết và có hiệu lực từ ngày 10 tháng 12 năm 2001. Hiệp định quy định chi tiết cam kết mở cửa thương mại hàng hóa, thương mại dịch vụ, thương mại liên quan đến đầu tư và quyền sở hữu trí tuệ. Sau khi hiệp định có hiệu lực, Hoa Kỳ áp dụng Quy chế quan hệ thương mại bình thường, giảm mức thuế quan trung bình đánh vào hàng nhập khẩu từ Việt Nam từ 40 phần trăm xuống 4 phần trăm.\",\n      \"source\": \"Quan hệ thương mại và đầu tư Việt - Mỹ trong 1/4 thế kỷ, Trung tâm WTO và Hội nhập, VCCI\",\n      \"sourceUrl\": \"https://trungtamwto.vn/hiep-dinh-khac/15707-quan-he-thuong-mai-va-dau-tu-viet--my-trong-14-the-ky\"\n    },\n    {\n      \"id\": 73,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": true,\n      \"date\": \"11/1/2007\",\n      \"title\": \"Gia nhập Tổ chức Thương mại Thế giới (WTO)\",\n      \"description\": \"Ngày 11 tháng 1 năm 2007, Việt Nam chính thức trở thành thành viên thứ 150 của Tổ chức Thương mại Thế giới. Việc gia nhập WTO thúc đẩy Việt Nam cải cách và hoàn thiện chính sách, pháp luật về thương mại và đầu tư cho phù hợp với cam kết quốc tế, cải thiện môi trường kinh doanh.\",\n      \"source\": \"18 năm Việt Nam gia nhập WTO: Bước ngoặt lớn thúc đẩy tăng trưởng xuất khẩu, thu hút FDI, Trung tâm WTO và Hội nhập, VCCI\",\n      \"sourceUrl\": \"https://trungtamwto.vn/tin-tuc/28020-18-nam-viet-nam-gia-nhap-wto-buoc-ngoat-lon-thuc-day-tang-truong-xuat-khau-thu-hut-fdi\"\n    },\n    {\n      \"id\": 74,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2008–2009\",\n      \"title\": \"Lần đầu là Ủy viên không thường trực HĐBA LHQ\",\n      \"description\": \"Việt Nam lần đầu được bầu làm Ủy viên không thường trực Hội đồng Bảo an Liên hợp quốc trong nhiệm kỳ 2008-2009.\",\n      \"source\": \"Việt Nam lần thứ hai trúng cử làm Ủy viên không thường trực Hội đồng Bảo an Liên hợp quốc, Bộ Ngoại giao\",\n      \"sourceUrl\": \"https://mofa.gov.vn/tin-chi-tiet/chi-tiet/-viet-nam-lan-thu-hai-trung-cu-lam-uy-vien-khong-thuong-truc-hoi-dong-bao-an-lien-hop-quoc--139.html\"\n    },\n    {\n      \"id\": 75,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2015\",\n      \"title\": \"Cộng đồng ASEAN hình thành; ký các FTA thế hệ mới\",\n      \"description\": \"Cộng đồng ASEAN chính thức hình thành ngày 31 tháng 12 năm 2015, được xây dựng trên ba trụ cột gồm Cộng đồng Chính trị - An ninh, Cộng đồng Kinh tế và Cộng đồng Văn hóa - Xã hội. Lễ ký Tuyên bố Kuala Lumpur 2015 về thành lập Cộng đồng ASEAN công bố chính thức với thế giới thành tựu của quá trình liên kết và hội nhập ASEAN.\",\n      \"source\": \"Cộng đồng ASEAN chính thức ra đời, Báo Chính phủ\",\n      \"sourceUrl\": \"https://baochinhphu.vn/cong-dong-asean-chinh-thuc-ra-doi-102196315.htm\"\n    },\n    {\n      \"id\": 76,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2019\",\n      \"title\": \"Trúng cử Ủy viên không thường trực HĐBA LHQ 2020–2021\",\n      \"description\": \"Ngày 7 tháng 6 năm 2019, Việt Nam trúng cử Ủy viên không thường trực Hội đồng Bảo an Liên hợp quốc nhiệm kỳ 2020-2021 với số phiếu 192 trên 193, ngay sau vòng bỏ phiếu đầu tiên. Tiếp theo nhiệm kỳ đầu tiên 2008-2009, đây là lần thứ hai Việt Nam được bầu làm thành viên cơ quan này; Việt Nam chính thức đảm nhiệm vai trò từ ngày 1 tháng 1 năm 2020.\",\n      \"source\": \"Việt Nam trúng cử Ủy viên không thường trực HĐBA với số phiếu 192/193, Báo Chính phủ\",\n      \"sourceUrl\": \"https://baochinhphu.vn/viet-nam-trung-cu-uy-vien-khong-thuong-truc-hdba-voi-so-phieu-192-193-102257048.htm\"\n    },\n    {\n      \"id\": 77,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2020\",\n      \"title\": \"Chủ tịch ASEAN; ký EVFTA, RCEP\",\n      \"description\": \"Việt Nam đảm nhiệm vai trò Chủ tịch ASEAN năm 2020. Trong năm này, Hiệp định Thương mại tự do Việt Nam - Liên minh châu Âu chính thức có hiệu lực từ ngày 1 tháng 8 năm 2020, sau khi được Nghị viện châu Âu phê chuẩn ngày 12 tháng 2 và Quốc hội Việt Nam phê chuẩn ngày 8 tháng 6 năm 2020. Hiệp định Đối tác Kinh tế Toàn diện Khu vực giữa 10 nước ASEAN và 5 đối tác được ký ngày 15 tháng 11 năm 2020.\",\n      \"source\": \"Hiệp định Thương mại tự do Việt Nam - EU (EVFTA) chính thức có hiệu lực và tiến trình thực thi trong thời gian tới, Bộ Công Thương\",\n      \"sourceUrl\": \"https://moit.gov.vn/tin-tuc/thi-truong-nuoc-ngoai/hiep-dinh-thuong-mai-tu-do-viet-nam-eu-evfta-chinh-thuc-co-h.html\"\n    },\n    {\n      \"id\": 78,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"9/2023\",\n      \"title\": \"Nâng cấp Đối tác chiến lược toàn diện với Hoa Kỳ\",\n      \"description\": \"Ngày 10 tháng 9 năm 2023, Tổng Bí thư Nguyễn Phú Trọng và Tổng thống Hoa Kỳ Joseph R. Biden Jr. hội đàm tại Hà Nội, nâng quan hệ hai nước lên Đối tác Chiến lược Toàn diện vì hòa bình, hợp tác và phát triển bền vững. Hai nước quyết định đẩy mạnh hợp tác về khoa học, công nghệ và đổi mới sáng tạo trong lĩnh vực số, đồng thời công bố khởi động các sáng kiến phát triển nguồn nhân lực trong lĩnh vực bán dẫn.\",\n      \"source\": \"Toàn văn Tuyên bố chung về nâng cấp quan hệ Việt Nam - Hoa Kỳ lên Đối tác Chiến lược Toàn diện, Báo Chính phủ\",\n      \"sourceUrl\": \"https://baochinhphu.vn/toan-van-tuyen-bo-chung-ve-nang-cap-quan-he-viet-nam-hoa-ky-len-doi-tac-chien-luoc-toan-dien-102230911170243626.htm\"\n    },\n    {\n      \"id\": 79,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Kỷ nguyên vươn mình\",\n      \"spine\": false,\n      \"date\": \"30/4/2025\",\n      \"title\": \"Kỷ niệm 50 năm thống nhất đất nước\",\n      \"description\": \"Sáng 30 tháng 4 năm 2025, Ban Chấp hành Trung ương Đảng, Quốc hội, Chủ tịch nước, Chính phủ, Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam và Thành phố Hồ Chí Minh tổ chức trọng thể Lễ kỷ niệm 50 năm Ngày Giải phóng miền Nam, thống nhất đất nước (30/4/1975 - 30/4/2025). Lễ kỷ niệm mở đầu bằng nghi thức chào cờ cùng 21 loạt đại bác tại bến Bạch Đằng, Quận 1; Tổng Bí thư Tô Lâm đọc diễn văn kỷ niệm. Chương trình diễu binh, diễu hành bắt đầu lúc 6 giờ 30 phút với 4 khối nghi trượng, 36 khối diễu binh và 12 khối diễu hành, cùng các khối quân đội Trung Quốc, Lào và Campuchia.\",\n      \"source\": \"Kỷ niệm trọng thể 50 năm Giải phóng miền Nam, thống nhất đất nước, Báo Điện tử Chính phủ\",\n      \"sourceUrl\": \"https://baochinhphu.vn/truc-tiep-ky-niem-trong-the-50-nam-giai-phong-mien-nam-thong-nhat-dat-nuoc-102250429120220339.htm\"\n    },\n    {\n      \"id\": 80,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Kỷ nguyên vươn mình\",\n      \"spine\": false,\n      \"date\": \"1/7/2025\",\n      \"title\": \"Sắp xếp lại đơn vị hành chính cấp tỉnh\",\n      \"description\": \"Sáng ngày 12 tháng 6 năm 2025, tại kỳ họp thứ chín, Quốc hội khóa XV thông qua Nghị quyết số 202/2025/QH15 về việc sắp xếp đơn vị hành chính cấp tỉnh, với 461 trên 465 đại biểu có mặt tán thành. Cả nước có 34 đơn vị hành chính cấp tỉnh, gồm 28 tỉnh và 6 thành phố, trong đó 19 tỉnh và 4 thành phố hình thành sau sắp xếp. Chính quyền địa phương ở các tỉnh, thành phố hình thành sau sắp xếp chính thức hoạt động từ ngày 1 tháng 7 năm 2025.\",\n      \"source\": \"Nghị quyết số 202/2025/QH15 về việc sắp xếp đơn vị hành chính cấp tỉnh, Quốc hội khóa XV\",\n      \"sourceUrl\": \"https://vanban.chinhphu.vn/?pageid=27160&docid=213930\"\n    },\n    {\n      \"id\": 81,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Kỷ nguyên vươn mình\",\n      \"spine\": true,\n      \"date\": \"2/9/2026\",\n      \"title\": \"Kỷ niệm 81 năm Quốc khánh\",\n      \"description\": \"Tối 28 tháng 8 năm 2026, tại Nhà hát Hồ Gươm, Hà Nội, Tổng Bí thư, Chủ tịch nước Tô Lâm chủ trì Lễ kỷ niệm 81 năm Quốc khánh nước Cộng hòa xã hội chủ nghĩa Việt Nam (2/9/1945 - 2/9/2026). Trong diễn văn, Tổng Bí thư, Chủ tịch nước nhắc lại thời khắc 81 năm trước Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập tại Quảng trường Ba Đình, khai sinh nước Việt Nam Dân chủ Cộng hòa, nay là nước Cộng hòa xã hội chủ nghĩa Việt Nam.\",\n      \"source\": \"Tổng Bí thư, Chủ tịch nước Tô Lâm chủ trì Lễ kỷ niệm 81 năm Quốc khánh 2/9, Báo Điện tử Chính phủ\",\n      \"sourceUrl\": \"https://baochinhphu.vn/tong-bi-thu-chu-tich-nuoc-to-lam-chu-tri-le-ky-niem-81-nam-quoc-khanh-2-9-102260828214543734.htm\"\n    }\n  ]\n};\n\n  // ---- historical palette (single source of truth) ----\n  HISTORICAL_COLORS = {\n    bronze:           [139,  98,  62],  // #8B623E  Đồng Đông Sơn\n    jade:             [113, 138, 118],  // #718A76  Xanh ngọc cổ\n    indigo:           [ 41,  75,  99],  // #294B63  Lam chàm\n    vermilionDark:    [120,  53, ];\n        return [0, 1, 2].map(j => Math.round(a[j] + (b[j] - a[j]) * t));\n      }\n    }\n    return C.flagRed.slice();\n  }\n\n  hex(c) { return '#' + c.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join(''); }\n  rgb(c) { return c.join(','); }\n\n  relLum(c) {\n    const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };\n    return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);\n  }\n\n  contrast(a, b) {\n    const l1 = this.relLum(a), l2 = this.relLum(b);\n    const hi = Math.max(l1, l2), lo = Math.min(l1, l2);\n    return (hi + 0.05) / (lo + 0.05);\n  }\n\n  // Era colours are chosen for the rail and borders; as TEXT they must still\n  // clear 4.5:1 on the cream surface, so darken until they do.\n  ink(c) {\n    let x = c.slice();\n    for (let i = 0; i < 30 && this.contrast(x, this.SURFACE) < 4.8; i++) {\n      x = x.map(v => Math.round(v * 0.88));\n    }\n    return this.hex(x);\n  }\n\n  code(d) {\n    const bc = /TCN/.test(d);\n    const nums = d.match(/\\d+/g) || [];\n    let y = null;\n    for (const n of nums) if (!y || n.length > y.length) y = n;\n    const core = y ? y.padStart(4, '0') : 'TKVII';\n    return 'VN-' + core + (bc ? '·TCN' : '');\n  }\n\n  chapter(phase) {\n    const always = this.props.showMeaningAlways === true;\n    const all = this.DATA.events.filter(e => e.phase === phase.id);\n    const names = [...new Set(all.map(e => e.era))].reverse();\n    const eras = names.map(name => {\n      const rows = all.filter(e => e.era === name).reverse();\n      return {\n        name: name.toUpperCase(),\n        rows: rows.map(e => {\n          const core = this.CORE[e.id];\n          const isClimax = Object.prototype.hasOwnProperty.call(this.CLIMAX, e.id);\n          const ribbon = (core && core.pin) || this.CLIMAX[e.id] || '';\n          const isPin = !!(core && core.pin) || isClimax;\n          const media = this.MEDIA[e.id];\n          const year = this.yearOf(e.date);\n          const tone = this.toneAt(year);\n          // §5 — 1945 is where antique gold becomes flag gold.\n          const halo = year >= 1945 ? this.HISTORICAL_COLORS.flagGold : this.HISTORICAL_COLORS.antiqueGold;\n          const isOpen = always || this.state.openId === e.id;\n          const card = !!core || isClimax;\n          return {\n            id: e.id, date: e.date, title: e.title,\n            description: e.description, source: e.source,\n            sourceUrl: e.sourceUrl || '', hasUrl: !!e.sourceUrl,\n            sourceHost: e.sourceUrl ? e.sourceUrl.split('/')[2] : '',\n            code: this.code(e.date),\n            img: this.IMAGES[e.id] || '', hasImg: !!this.IMAGES[e.id], noImg: !this.IMAGES[e.id],\n            caption: this.CAPTIONS[e.id] || '', hasCaption: !!(this.CAPTIONS[e.id] && this.IMAGES[e.id]),\n            hasMedia: !!media,\n            hasDoc: !!(media && media.doc), docHref: (media && media.doc) || '',\n            docLabel: (media && media.docLabel) || 'Đọc toàn văn',\n            hasVideo: !!(media && media.video),\n            showVid: !!(media && media.video) && !!this.state.vid[e.id],\n            embedSrc: media ? 'https://www.youtube-nocookie.com/embed/' + media.video : '',\n            vidOpen: !!this.state.vid[e.id],\n            vidCls: this.state.vid[e.id] ? 'is-open' : '',\n            vidSign: this.state.vid[e.id] ? '−' : '+',\n            toggleVid: () => this.setState(s => ({ vid: { ...s.vid, [e.id]: !s.vid[e.id] } })),\n            slot: 'ck-' + e.id,\n            photo: 'Ảnh tư liệu: ' + e.title,\n            glyph: phase.id === 'dung_nuoc' ? '❋' : (phase.id === 'giu_nuoc' ? '★' : '❯'),\n            tone: this.hex(tone), toneRgb: this.rgb(tone), toneInk: this.ink(tone),\n            toneNext: this.hex(tone),\n            halo: this.hex(halo), haloRgb: this.rgb(halo), haloInk: this.ink(halo),\n            card, brief: !card,\n            isCore: !!core, isPin,\n            sheenCls: isClimax ? 'ribbon--sheen' : '',\n            cardCls: isPin ? 'card--pin' : (core ? 'card--core' : ''),\n            nodeCls: isPin ? 'rail-node--pin' : (core ? 'rail-node--core' : ''),\n            isOpen,\n            openCls: isOpen ? 'is-open' : '',\n            toggle: () => this.setState(s => ({ openId: s.openId === e.id ? null : e.id }))\n          };\n        })\n      };\n    }).filter(x => x.rows.length > 0);\n    return { eras };\n  }\n\n  renderVals() {\n    const chapters = this.PHASES.map(p => ({\n      ...p,\n      eras: this.chapter(p).eras,\n      isOrigin: p.id === 'dung_nuoc',\n      quote: (this.QUOTES[p.id] || {}).quote || '',\n      source: (this.QUOTES[p.id] || {}).source || '',\n      hasQuote: !!((this.QUOTES[p.id] || {}).quote),\n      bareCls: ((this.QUOTES[p.id] || {}).quote) ? '' : 'chap-hd--bare',\n      originImg: this.ORIGIN_IMG, hasOriginImg: !!this.ORIGIN_IMG, noOriginImg: !this.ORIGIN_IMG,\n      isFuture: p.id === 'phat_trien'\n    }));\n\n    // Second pass: each connector fades into the NEXT milestone shown below it,\n    // so era and chapter boundaries never produce a visible colour seam.\n    const flat = [];\n    chapters.forEach(ch => ch.eras.forEach(er => er.rows.forEach(r => flat.push(r))));\n    flat.forEach((r, i) => { r.toneNext = (flat[i + 1] || r).tone; });\n\n    // Chapter rule takes the colour of its own first milestone.\n    chapters.forEach(ch => {\n      const first = ch.eras.find(e => e.rows.length);\n      ch.tone = first ? first.rows[0].tone : this.hex(this.HISTORICAL_COLORS.bronze);\n      ch.toneInk = first ? first.rows[0].toneInk : this.ink(this.HISTORICAL_COLORS.bronze);\n      ch.toneRgb = first ? first.rows[0].toneRgb : this.rgb(this.HISTORICAL_COLORS.bronze);\n    });\n\n    // Danh mục nguồn ảnh cuối trang; [n] dưới mỗi ảnh trỏ về đúng dòng thứ n.\n    const byId = {};\n    this.DATA.events.forEach(e => { byId[e.id] = e.title; });\n    const imgRefs = Object.keys(this.IMGSRC)\n      .map(Number).sort((a, b) => a - b)\n      .map(n => {\n        // Giá trị là chuỗi (URL, hoặc tên tài liệu giấy), hoặc {note, url} khi\n        // ảnh gốc nằm trong sách nhưng được lấy lại từ một trang trên mạng.\n        const v = this.IMGSRC[n];\n        const obj = typeof v === 'object' && v !== null;\n        const raw = obj ? (v.url || '') : v;\n        const isUrl = /^https?:\\/\\//.test(raw);\n        const note = obj ? (v.note || '') : (isUrl ? '' : v);\n        return {\n          n, title: byId[n] || '',\n          url: isUrl ? raw : '', hasUrl: isUrl,\n          note, hasNote: !!note,\n          label: isUrl ? raw.split('/')[2].replace(/^www\\./, '') : ''\n        };\n      });\n\n    return {\n      chapters,\n      imgRefs,\n      originImg: this.ORIGIN_IMG,\n      hasOriginImg: !!this.ORIGIN_IMG,\n      noOriginImg: !this.ORIGIN_IMG,\n      ctaHref: this.props.ctaHref || '#'\n    };\n  }\n}\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>\n"
  </script>
