document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ealIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}\n\n.page{min-height:100dvh;background:var(--c-page)}\n.doc{max-width:560px;margin:0 auto;background:var(--c-surface);box-shadow:0 24px 70px rgba(28,26,22,.16)}\n\n/* ---------- crest ---------- */\n.crest{background:var(--c-red);color:#FFF6E3;padding:var(--s5) var(--s5) var(--s4);text-align:center;\n  border-bottom:3px double var(--c-gold-soft);box-shadow:inset 0 0 0 1px rgba(255,223,0,.22)}\n.flag{width:56px;height:37px;background:#DA251D;border:1px solid rgba(255,223,0,.55);\n  box-shadow:0 4px 12px rgba(22,21,15,.28);display:flex;align-items:center;justify-content:center;\n  color:#FFDF00;font-size:24px;line-height:1;margin:0 auto}\n.crest-state{margin-top:var(--s3);font-family:var(--f-display);font-weight:700;\n  font-size:clamp(15px,3.9vw,19px);letter-spacing:.05em;line-height:1.3}\n.crest-motto{margin-top:var(--s2);display:flex;align-items:center;justify-content:center;gap:var(--s3)}\n.crest-motto span{width:clamp(18px,6vw,44px);height:1px;background:rgba(255,223,0,.55)}\n.crest-motto b{font-family:var(--f-display);font-weight:500;font-size:clamp(14px,3.6vw,17px);white-space:nowrap}\n\n/* ---------- hero ---------- */\n.hero{padding:var(--s6) var(--s5);text-align:center}\n\n.hero-frame{border:1px solid var(--c-line2);padding:7px;background:var(--c-surface2)}\n.hero-frame>div{border:1px solid #EFE8D8}\n.rule{margin-top:var(--s5);display:flex;align-items:center;justify-content:center;gap:var(--s3)}\n.rule span{width:clamp(24px,12vw,84px);height:1px;background:var(--c-line2)}\n.rule b{color:#8A6A1E;font-size:var(--fs-2xs);line-height:1}\n.hero-verse{margin-top:0;display:flex;flex-direction:column;gap:var(--s1);\n  font-family:var(--f-display);font-weight:700;font-size:var(--fs-hero);\n  line-height:1.2;letter-spacing:-.005em;color:var(--c-ink);text-wrap:balance}\n.hero-cite{margin-top:var(--s4);font-size:var(--fs-xs);line-height:1.55;color:var(--c-ink2)}\n\n/* ---------- future card (2045 — metallic, forward-looking) ---------- */\n.future{padding:0 0 var(--s2)}\n.future-grid{display:grid;grid-template-columns:34px minmax(0,1fr)}\n.future-rail{display:flex;flex-direction:column;align-items:center}\n.future-rail u{width:2px;flex:1;min-height:44px;display:block;\n  background-image:linear-gradient(#C79A3B 55%,transparent 0);background-size:2px 14px;\n  animation:crawl 1.4s linear infinite}\n.future-body{padding:0 0 var(--s4) var(--s4)}\n.future-card{background:var(--c-surface2);padding:var(--s4);\n  border:1px solid var(--c-gold-soft);\n  box-shadow:0 0 0 4px rgba(199,154,59,.10),0 14px 34px rgba(28,26,22,.12)}\n.future-live{display:flex;align-items:center;gap:var(--s2);font-family:var(--f-mono);\n  font-size:var(--fs-2xs);letter-spacing:.16em;color:#8A6A1E}\n.future-live span{width:7px;height:7px;border-radius:50%;background:#C79A3B;\n  animation:pulse 1.9s ease-in-out infinite}\n.future-slots{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}\n.future-slot{flex:1 1 100%;padding:var(--s3);border:1px dashed var(--c-line2);background:#FDFAF2}\n.future-slot b{display:block;font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.1em;\n  font-weight:500;color:#8A6A1E}\n.future-slot i{display:block;margin-top:var(--s1);font-size:var(--fs-sm);line-height:1.5;\n  color:var(--c-ink2);font-style:normal}\n.future-slot em{display:block;margin-top:var(--s2);padding-left:var(--s3);\n  border-left:2px solid var(--c-gold-soft);font-family:var(--f-display);font-weight:500;\n  font-size:var(--fs-md);line-height:1.5;color:var(--c-ink);font-style:normal}\n\n/* ---------- chapter ---------- */\n.chap{position:relative;padding:0 var(--s5)}\n.chap-hd{margin:var(--s8) 0 var(--s5);padding:var(--s7) var(--s5);text-align:center;\n  background:rgba(var(--tone-rgb),.10);border-top:3px solid var(--tone);\n  border-bottom:1px solid rgba(var(--tone-rgb),.35)}\n.chap-hd--bare{padding:0;margin:var(--s8) 0 var(--s5);height:3px;background:var(--tone);\n  border:0}\n.chap-quote{margin:0;font-family:var(--f-display);font-weight:500;\n  font-size:clamp(19px,4.9vw,25px);line-height:1.42;color:var(--c-ink);text-wrap:balance}\n.chap-quote::after{content:'';display:block;width:40px;height:1px;margin:var(--s4) auto 0;\n  background:var(--tone)}\n.chap-cite{display:block;margin-top:var(--s3);font-family:var(--f-mono);font-size:var(--fs-2xs);\n  letter-spacing:.14em;color:var(--tone-ink)}\n\n.era-hd{display:grid;grid-template-columns:34px minmax(0,1fr);padding:var(--s5) 0 var(--s2)}\n.era-row{display:flex;align-items:center;gap:var(--s3);padding-left:var(--s4)}\n.era-name{font-family:var(--f-mono);font-size:var(--fs-2xs);letter-spacing:.12em;\n  color:var(--c-ink2);font-weight:500}\n.era-fill{flex:1;height:1px;background:var(--c-line2)}\n\n/* ---------- timeline row: colour interpolated from the milestone's year ---------- */\n.row{display:grid;grid-template-columns:34px minmax(0,1fr);\n  background:radial-gradient(130% 74% at 0% 46%, rgba(var(--tone-rgb),.11), transparent 66%)}\n.rail{display:flex;flex-direction:column;align-items:center;padding-top:var(--s5)}\n.rail-node{width:9px;height:9px;border-radius:50%;background:var(--tone);flex:none;\n  box-shadow:0 0 0 3px rgba(var(--tone-rgb),.16)}\n/* the connector fades into the NEXT milestone's colour — no hard era seams */\n.rail-line{width:2px;flex:1;margin-top:var(--s1);\n  background:linear-gradient(var(--tone),var(--tone-next))}\n.row-body{padding:0 0 var(--s5) var(--s4)}\n\n/* ---------- full card: the 9 sovereignty milestones (+ the 2026 climax) ---------- */\n.card{background:var(--c-surface2);border:1px solid rgba(var(--tone-rgb),.55);\n  border-left:3px solid var(--tone);\n  box-shadow:0 10px 28px rgba(28,26,22,.10);animation:rise .55s ease both}\n.card-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);\n  padding:var(--s3) var(--s3) var(--s2);font-family:var(--f-mono);font-size:var(--fs-2xs);\n  color:var(--c-ink3);background:rgba(var(--tone-rgb),.07)}\n.card-code{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--tone-ink)}\n.card-body{padding:var(--cardpad)}\n\n/* sovereignty halo — antique gold before 1945, flag gold from 1945 (§4, §5).\n   The card keeps its era colour; only the ring is gold. */\n.card--core{border-color:var(--halo);border-left-color:var(--tone);\n  box-shadow:0 0 0 4px rgba(var(--halo-rgb),.13),0 10px 28px rgba(28,26,22,.10)}\n.card--pin{border:2px solid var(--halo);border-left:4px solid var(--tone);\n  box-shadow:0 0 0 5px rgba(var(--halo-rgb),.18),0 14px 36px rgba(28,26,22,.14);\n  animation:sealIn .6s ease both}\n\n.media{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s3) var(--s3) 0;\n  background:rgba(var(--halo-rgb),.12)}\n.media-video{padding:var(--s3);background:rgba(var(--halo-rgb),.12);\n  border-bottom:1px solid rgba(var(--halo-rgb),.4)}\n.media-video iframe{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--halo);background:#000}\n@supports not (aspect-ratio:16/9){.media-video iframe{height:200px}}\n.media-btn{flex:1 1 150px;min-height:56px;display:flex;align-items:center;gap:var(--s3);\n  padding:var(--s3);background:var(--c-surface2);border:1px solid var(--halo);\n  color:var(--c-ink);text-decoration:none;text-align:left;cursor:pointer;\n  font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;\n  transition:background .18s ease,transform .18s ease}\n.media-btn:hover{background:#FFF8E6;transform:translateY(-1px)}\n.media-btn svg{flex:none;width:26px;height:26px;fill:none;stroke:var(--halo-ink);\n  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n.media-btn b{flex:1;font-size:var(--fs-md);font-weight:600;line-height:1.3}\n.media-btn i{flex:none;font-style:normal;font-size:var(--fs-xl);line-height:1;color:var(--halo-ink)}\n.media-btn.is-open{background:#FFF8E6}\n.img-cap{display:block;padding:var(--s2) var(--s3);background:rgba(var(--tone-rgb),.09);\n  border-bottom:1px solid rgba(var(--tone-rgb),.28);font-size:var(--fs-xs);line-height:1.5;\n  color:var(--c-ink2);text-align:left}\n.brief .img-cap{border:0;margin-top:var(--s1);padding:var(--s2) 0;background:none}\n.ev-title{font-family:var(--f-display);font-weight:700;font-size:var(--fs-xl);\n  line-height:1.22;color:var(--c-ink)}\n.ev-time{margin-top:var(--s2);font-family:var(--f-mono);font-size:var(--fs-2xs);\n  letter-spacing:.08em;color:var(--c-ink2)}\n.ev-time b{font-weight:500;color:var(--c-ink3);margin-right:var(--s2)}\n.ev-field{display:block;margin-top:var(--s4)}\n.ev-field b{display:block;font-family:var(--f-mono);font-size:var(--fs-2xs);letter-spacing:.1em;\n  font-weight:500;color:var(--c-ink3);margin-bottom:var(--s1)}\n.ev-field>span{display:block;font-size:var(--fs-md);line-height:1.65;color:var(--c-ink2)}\n.ev-source{padding:var(--s3);background:var(--c-surface3);border-left:3px solid var(--c-line2)}\n.ev-source>span{font-size:var(--fs-sm);color:var(--c-ink3)}\n\n.rail-node--core{width:15px;height:15px;background:var(--tone);border:2px solid var(--halo);\n  box-shadow:0 0 0 4px rgba(var(--halo-rgb),.18)}\n.rail-node--pin{width:19px;height:19px;background:var(--tone);border:3px solid var(--halo);\n  box-shadow:0 0 0 5px rgba(var(--halo-rgb),.24),0 0 14px rgba(var(--halo-rgb),.35)}\n\n/* ---------- brief: everything else — title + 2 lines, tap for the rest ---------- */\n.brief{display:block;width:100%;min-height:var(--tap);text-align:left;padding:var(--s3);\n  background:var(--c-surface);border:1px solid var(--c-line);cursor:pointer;\n  -webkit-tap-highlight-color:transparent;touch-action:manipulation;\n  transition:background .18s ease,border-color .18s ease}\n.brief:hover{background:var(--c-surface2);border-color:rgba(var(--tone-rgb),.5)}\n.brief.is-open{background:var(--c-surface2);border-color:rgba(var(--tone-rgb),.65);\n  box-shadow:inset 3px 0 0 var(--tone)}\n.brief-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);\n  font-family:var(--f-mono);font-size:var(--fs-2xs);color:var(--c-ink3)}\n.brief-title{display:block;margin-top:var(--s1);font-size:var(--fs-md);font-weight:500;\n  line-height:1.4;color:var(--c-ink)}\n.brief-mean{display:block;margin-top:var(--s2);font-size:var(--fs-sm);line-height:1.55;color:var(--c-ink2)}\n.brief-note{display:block;margin-top:var(--s2);font-size:var(--fs-xs);line-height:1.55;color:var(--c-ink3)}\n\n/* ---------- provenance ---------- */\n\n.origin-banner{margin:0;--tone:#8B623E;border-top:1px solid var(--c-line2);\n  background:var(--c-surface2)}\n.origin-banner figcaption{padding:var(--s5) var(--s5) var(--s6);\n  border-left:3px solid var(--tone)}\n\n.origin-banner b{display:block;font-family:var(--f-mono);font-size:var(--fs-2xs);letter-spacing:.08em;\n  font-weight:500;color:var(--c-ink);margin-bottom:var(--s2)}\n.origin-banner span{display:block;font-size:var(--fs-sm);line-height:1.65;color:var(--c-ink2)}\n.sources{padding:var(--s6) var(--s5) calc(var(--s8) + var(--tap));border-top:1px solid var(--c-line2);\n  background:var(--c-surface3)}\n.sources h3{font-family:var(--f-mono);font-size:var(--fs-2xs);letter-spacing:.14em;\n  color:var(--c-ink2);font-weight:500}\n.reflist{list-style:none;margin:var(--s4) 0 0;padding:0;border-top:1px solid var(--c-line2)}\n.reflist li{display:flex;flex-direction:column;gap:2px;padding:var(--s3) 0;\n  border-bottom:1px solid var(--c-line2)}\n.reflist b{font-size:var(--fs-sm);font-weight:600;color:var(--c-ink);line-height:1.4}\n.reflist span{font-size:var(--fs-xs);line-height:1.5;color:var(--c-ink2)}\n.refnote{margin-top:var(--s4);font-size:var(--fs-sm);line-height:1.7;color:var(--c-ink2)}\n.sources b{color:var(--c-ink);font-weight:500}\n\n/* ---------- back to top ---------- */\n.totop{position:fixed;z-index:60;right:max(var(--s4),env(safe-area-inset-right));\n  bottom:max(var(--s4),env(safe-area-inset-bottom));\n  width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;\n  background:var(--c-red);color:#FFF6E3;border:1px solid rgba(255,223,0,.45);\n  box-shadow:0 6px 20px rgba(28,26,22,.32);font-size:20px;line-height:1;\n  -webkit-tap-highlight-color:transparent;touch-action:manipulation;\n  transition:background .18s ease,transform .18s ease}\n.totop:hover{background:#8E1811;transform:translateY(-2px)}\n@keyframes totopIn{0%{opacity:0;visibility:hidden}100%{opacity:1;visibility:visible}}\n@supports (animation-timeline: scroll()){\n  .totop{animation:totopIn linear both;animation-timeline:scroll();animation-range:120px 420px}\n}\n\n/* ---------- thu hẹp dần theo bề ngang máy ----------\n   Mục tiêu: giữ 35 ký tự trở lên mỗi dòng ngay cả trên máy 320px,\n   bằng cách nhả bớt lề và cột rail chứ không thu nhỏ cỡ chữ. */\n@media (max-width:600px){\n  .doc{box-shadow:none}\n  .crest,.hero,.chap,.sources{padding-left:var(--s4);padding-right:var(--s4)}\n  .era-hd,.row,.future-grid{grid-template-columns:26px minmax(0,1fr)}\n  .era-row,.row-body,.future-body{padding-left:var(--s3)}\n}\n@media (max-width:400px){\n  :root{--fs-xl:20px;--s5:16px;--s6:20px}\n  /* khối chữ dài phá lề thẻ để lấy thêm bề ngang, đổi lấy dòng dài hơn */\n  .card-body .ev-source{margin-left:calc(var(--cardpad) * -1);margin-right:calc(var(--cardpad) * -1);\n    padding-left:var(--cardpad);padding-right:var(--cardpad)}\n  .crest,.hero,.chap,.sources{padding-left:var(--s3);padding-right:var(--s3)}\n  .era-hd,.row,.future-grid{grid-template-columns:20px minmax(0,1fr)}\n  .era-row,.row-body,.future-body{padding-left:var(--s2)}\n  .future-slot{flex:1 1 100%}\n}\n@media (max-width:340px){\n  :root{--fs-xl:19px;--cardpad:8px}\n  .crest,.hero,.chap,.sources{padding-left:var(--s2);padding-right:var(--s2)}\n  .era-hd,.row,.future-grid{grid-template-columns:16px minmax(0,1fr)}\n  .brief{padding:var(--s2)}\n}\n@supports (padding:max(0px)){\n  .page{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}\n}\n@supports (animation-timeline: view()){\n  .card{animation-timeline:view();animation-range:entry 0% cover 24%}\n}\n@media (prefers-reduced-motion: reduce){\n  *{animation:none !important;transition:none !important}\n  html{scroll-behavior:auto}\n}\n<\u002Fstyle>\n<script src=\"ef1a166a-5f1d-44b3-a590-5e120ffe2f77\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div class=\"page\">\n<div class=\"doc\" id=\"top\">\n\n  <div class=\"crest\">\n    <div class=\"flag\" aria-label=\"Quốc kỳ Việt Nam\">★<\u002Fdiv>\n    <div class=\"crest-state\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<\u002Fdiv>\n    <div class=\"crest-motto\"><span><\u002Fspan><b>Độc lập – Tự do – Hạnh phúc<\u002Fb><span><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hero\">\n    <h1 class=\"hero-verse\"><span>Dân ta phải biết sử ta<\u002Fspan><span>Cho tường gốc tích nước nhà Việt Nam<\u002Fspan><\u002Fh1>\n    <p class=\"hero-cite\">Trích bài thơ “Lịch sử nước ta”, Chủ tịch Hồ Chí Minh<\u002Fp>\n    <div class=\"rule\"><span><\u002Fspan><b>◆<\u002Fb><span><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ chapters }}\" as=\"ch\" hint-placeholder-count=\"3\">\n  <section class=\"chap\" style=\"--tone:{{ ch.tone }};--tone-ink:{{ ch.toneInk }};--tone-rgb:{{ ch.toneRgb }}\">\n    <header class=\"chap-hd {{ ch.bareCls }}\" aria-label=\"{{ ch.label }}\">\n      <sc-if value=\"{{ ch.hasQuote }}\" hint-placeholder-val=\"{{ true }}\">\n        <blockquote class=\"chap-quote\">{{ ch.quote }}<\u002Fblockquote>\n        <span class=\"chap-cite\">{{ ch.source }}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ ch.isFuture }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"future\">\n        <div class=\"future-grid\">\n          <div class=\"future-rail\"><u><\u002Fu><\u002Fdiv>\n          <div class=\"future-body\">\n            <div class=\"future-card\">\n              <div class=\"future-live\"><span><\u002Fspan>HƯỚNG TỚI<\u002Fdiv>\n              <div class=\"future-slots\">\n                <div class=\"future-slot\"><b>VN-2030<\u002Fb><i>Kỷ niệm 100 năm thành lập Đảng<\u002Fi><em>“Là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao.”<\u002Fem><\u002Fdiv>\n                <div class=\"future-slot\"><b>VN-2045<\u002Fb><i>Kỷ niệm 100 năm thành lập nước<\u002Fi><em>“Trở thành nước phát triển, thu nhập cao.”<\u002Fem><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ ch.eras }}\" as=\"era\" hint-placeholder-count=\"3\">\n      <div class=\"era-hd\">\n        <div><\u002Fdiv>\n        <div class=\"era-row\">\n          <span class=\"era-name\">{{ era.name }}<\u002Fspan>\n          <span class=\"era-fill\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ era.rows }}\" as=\"ev\" hint-placeholder-count=\"3\">\n        <div class=\"row\" style=\"--tone:{{ ev.tone }};--tone-rgb:{{ ev.toneRgb }};--tone-next:{{ ev.toneNext }};--tone-ink:{{ ev.toneInk }};--halo:{{ ev.halo }};--halo-rgb:{{ ev.haloRgb }};--halo-ink:{{ ev.haloInk }}\">\n          <div class=\"rail\">\n            <div class=\"rail-node {{ ev.nodeCls }}\"><\u002Fdiv>\n            <div class=\"rail-line\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"row-body\">\n\n            <sc-if value=\"{{ ev.card }}\" hint-placeholder-val=\"{{ true }}\">\n              <article class=\"card {{ ev.cardCls }}\">\n                <div class=\"card-top\"><span class=\"card-code\"><span>{{ ev.glyph }}<\u002Fspan>{{ ev.code }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ ev.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n                  <image-slot id=\"{{ ev.slot }}\" shape=\"rect\" fit=\"cover\" src=\"{{ ev.img }}\" style=\"display:block;width:100%;aspect-ratio:3/2\" placeholder=\"{{ ev.photo }}\"><\u002Fimage-slot>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ ev.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <image-slot id=\"{{ ev.slot
