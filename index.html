  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t-tap-highlight-color:transparent;touch-action:manipulation;\n  transition:background .18s ease,transform .18s ease}\n.totop:hover{background:#8E1811;transform:translateY(-2px)}\n@keyframes totopIn{0%{opacity:0;visibility:hidden}100%{opacity:1;visibility:visible}}\n@supports (animation-timeline: scroll()){\n  .totop{animation:totopIn linear both;animation-timeline:scroll();animation-range:120px 420px}\n}\n\n/* ---------- thu hẹp dần theo bề ngang máy ----------\n   Mục tiêu: giữ 35 ký tự trở lên mỗi dòng ngay cả trên máy 320px,\n   bằng cách nhả bớt lề và cột rail chứ không thu nhỏ cỡ chữ. */\n@media (max-width:600px){\n  .doc{box-shadow:none}\n  .crest,.hero,.chap,.sources{padding-left:var(--s4);padding-right:var(--s4)}\n  .era-hd,.row,.future-grid{grid-template-columns:26px minmax(0,1fr)}\n  .era-row,.row-body,.future-body{padding-left:var(--s3)}\n}\n@media (max-width:400px){\n  :root{--fs-xl:20px;--s5:16px;--s6:20px}\n  /* khối chữ dài phá lề thẻ để lấy thêm bề ngang, đổi lấy dòng dài hơn */\n  .card-body .ev-source{margin-left:calc(var(--cardpad) * -1);margin-right:calc(var(--cardpad) * -1);\n    padding-left:var(--cardpad);padding-right:var(--cardpad)}\n  .crest,.hero,.chap,.sources{padding-left:var(--s3);padding-right:var(--s3)}\n  .era-hd,.row,.future-grid{grid-template-columns:20px minmax(0,1fr)}\n  .era-row,.row-body,.future-body{padding-left:var(--s2)}\n  .future-slot{flex:1 1 100%}\n}\n@media (max-width:340px){\n  :root{--fs-xl:19px;--cardpad:8px}\n  .crest,.hero,.chap,.sources{padding-left:var(--s2);padding-right:var(--s2)}\n  .era-hd,.row,.future-grid{grid-template-columns:16px minmax(0,1fr)}\n  .brief{padding:var(--s2)}\n}\n@supports (padding:max(0px)){\n  .page{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}\n}\n@supports (animation-timeline: view()){\n  .card{animation-timeline:view();animation-range:entry 0% cover 24%}\n}\n@media (prefers-reduced-motion: reduce){\n  *{animation:none !important;transition:none !important}\n  html{scroll-behavior:auto}\n}\n<\u002Fstyle>\n<script src=\"ef1a166a-5f1d-44b3-a590-5e120ffe2f77\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div class=\"page\">\n<div class=\"doc\" id=\"top\">\n\n  <div class=\"crest\">\n    <div class=\"flag\" aria-label=\"Quốc kỳ Việt Nam\">★<\u002Fdiv>\n    <div class=\"crest-state\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<\u002Fdiv>\n    <div class=\"crest-motto\"><span><\u002Fspan><b>Độc lập – Tự do – Hạnh phúc<\u002Fb><span><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hero\">\n    <h1 class=\"hero-verse\"><span>Dân ta phải biết sử ta<\u002Fspan><span>Cho tường gốc tích nước nhà Việt Nam<\u002Fspan><\u002Fh1>\n    <p class=\"hero-cite\">Trích bài thơ “Lịch sử nước ta”, Chủ tịch Hồ Chí Minh<\u002Fp>\n    <div class=\"rule\"><span><\u002Fspan><b>◆<\u002Fb><span><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ chapters }}\" as=\"ch\" hint-placeholder-count=\"3\">\n  <section class=\"chap\" style=\"--tone:{{ ch.tone }};--tone-ink:{{ ch.toneInk }};--tone-rgb:{{ ch.toneRgb }}\">\n    <header class=\"chap-hd {{ ch.bareCls }}\" aria-label=\"{{ ch.label }}\">\n      <sc-if value=\"{{ ch.hasQuote }}\" hint-placeholder-val=\"{{ true }}\">\n        <blockquote class=\"chap-quote\">{{ ch.quote }}<\u002Fblockquote>\n        <span class=\"chap-cite\">{{ ch.source }}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ ch.isFuture }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"future\">\n        <div class=\"future-grid\">\n          <div class=\"future-rail\"><u><\u002Fu><\u002Fdiv>\n          <div class=\"future-body\">\n            <div class=\"future-card\">\n              <div class=\"future-live\"><span><\u002Fspan>HƯỚNG TỚI<\u002Fdiv>\n              <div class=\"future-slots\">\n                <div class=\"future-slot\"><b>VN-2045<\u002Fb><i>Kỷ niệm 100 năm thành lập nước Việt Nam Dân chủ Cộng hoà, nay là nước Cộng hoà xã hội chủ nghĩa Việt Nam<\u002Fi><em>“Trở thành nước phát triển, thu nhập cao.”<\u002Fem><\u002Fdiv>\n                <div class=\"future-slot\"><b>VN-2030<\u002Fb><i>Kỷ niệm 100 năm thành lập Đảng Cộng sản Việt Nam<\u002Fi><em>“Là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao.”<\u002Fem><\u002Fdiv>\n              <\u002Fdiv>\n              <p class=\"future-src\">Nguồn: mục tiêu cụ thể trong\n              <a href=\"https://baochinhphu.vn/toan-van-nghi-quyet-dai-hoi-dai-bieu-toan-quoc-lan-thu-xiii-cua-dang-102288263.htm\" target=\"_blank\" rel=\"noopener\">Nghị quyết Đại hội XIII của Đảng Cộng sản Việt Nam<\u002Fa>,\n              câu trích giữ nguyên văn; khẳng định lại tại\n              <a href=\"https://baochinhphu.vn/toan-van-nghi-quyet-dai-hoi-dai-bieu-toan-quoc-lan-thu-xiv-cua-dang-102260206211344712.htm\" target=\"_blank\" rel=\"noopener\">Nghị quyết Đại hội XIV<\u002Fa>,\n              ngày 23/1/2026.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ ch.eras }}\" as=\"era\" hint-placeholder-count=\"3\">\n      <div class=\"era-hd\">\n        <div><\u002Fdiv>\n        <div class=\"era-row\">\n          <span class=\"era-name\">{{ era.name }}<\u002Fspan>\n          <span class=\"era-fill\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ era.rows }}\" as=\"ev\" hint-placeholder-count=\"3\">\n        <div class=\"row\" style=\"--tone:{{ ev.tone }};--tone-rgb:{{ ev.toneRgb }};--tone-next:{{ ev.toneNext }};--tone-ink:{{ ev.toneInk }};--halo:{{ ev.halo }};--halo-rgb:{{ ev.haloRgb }};--halo-ink:{{ ev.haloInk }}\">\n          <div class=\"rail\">\n            <div class=\"rail-node {{ ev.nodeCls }}\"><\u002Fdiv>\n            <div class=\"rail-line\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"row-body\">\n\n            <sc-if value=\"{{ ev.card }}\" hint-placeholder-val=\"{{ true }}\">\n              <article class=\"card {{ ev.cardCls }}\">\n }<\u002Fi>\n                      <\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ ev.showVid }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"media-video\">\n                      <iframe src=\"{{ ev.embedSrc }}\" title=\"{{ ev.title }}\"\n                        allow=\"accelerometer; encrypted-media; picture-in-picture; web-share; fullscreen\"\n                        referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen><\u002Fiframe>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n                <div class=\"card-body\">\n                  <h3 class=\"ev-title\">{{ ev.title }}<\u002Fh3>\n                  <div class=\"ev-time\"><b>THỜI GIAN<\u002Fb>{{ ev.date }}<\u002Fdiv>\n                  <div class=\"ev-field\"><b>MÔ TẢ<\u002Fb><span>{{ ev.description }}<\u002Fspan><\u002Fdiv>\n                  <div class=\"ev-field ev-source\"><b>NGUỒN<\u002Fb><span>{{ ev.source }}<\u002Fspan>\n                    <sc-if value=\"{{ ev.hasUrl }}\" hint-placeholder-val=\"{{ false }}\">\n                      <a class=\"src-link\" href=\"{{ ev.sourceUrl }}\" target=\"_blank\" rel=\"noopener\">{{ ev.sourceHost }}<\u002Fa>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ ev.brief }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" class=\"brief {{ ev.openCls }}\" sc-camel-on-click=\"{{ ev.toggle }}\" aria-expanded=\"{{ ev.isOpen }}\">\n                <span class=\"brief-top\"><span>{{ ev.code }}<\u002Fspan><span>{{ ev.date }}<\u002Fspan><\u002Fspan>\n                <span class=\"brief-title\">{{ ev.title }}<\u002Fspan>\n                <sc-if value=\"{{ ev.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-if value=\"{{ ev.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n                    <img class=\"ev-img ev-img--brief\" src=\"{{ ev.img }}\" alt=\"{{ ev.photo }}\" loading=\"lazy\" decoding=\"async\">\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ev.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                    <image-slot id=\"{{ ev.slot }}\" shape=\"rect\" fit=\"cover\" style=\"display:block;width:100%;aspect-ratio:3/2;margin-top:12px\" placeholder=\"{{ ev.photo }}\"><\u002Fimage-slot>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ev.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span class=\"img-cap\"><span>{{ ev.caption }}<\u002Fspan><i class=\"img-ref\">[{{ ev.id }}]<\u002Fi><\u002Fspan>\n                  <\u002Fsc-if>\n                  <span class=\"ev-field\"><b>MÔ TẢ<\u002Fb><span>{{ ev.description }}<\u002Fspan><\u002Fspan>\n                  <span class=\"ev-field ev-source\"><b>NGUỒN<\u002Fb><span>{{ ev.source }}<\u002Fspan><\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <sc-if value=\"{{ ev.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-if value=\"{{ ev.hasMedia }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"media\">\n                  <sc-if value=\"{{ ev.hasDoc }}\" hint-placeholder-val=\"{{ true }}\">\n                    <a class=\"media-btn\" href=\"{{ ev.docHref }}\" target=\"_blank\" rel=\"noopener\">\n                      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 2h8l4 4v16H6z\"/><path d=\"M14 2v5h5\"/><path d=\"M9 13h6M9 17h6\"/><\u002Fsvg>\n                      <b>{{ ev.docLabel }}<\u002Fb>\n                    <\u002Fa>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ev.hasVideo }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" class=\"media-btn {{ ev.vidCls }}\" sc-camel-on-click=\"{{ ev.toggleVid }}\" aria-expanded=\"{{ ev.vidOpen }}\">\n                      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M10 8.5l6 3.5-6 3.5z\"/><\u002Fsvg>\n                      <b>Nghe đọc<\u002Fb><i>{{ ev.vidSign }}<\u002Fi>\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ ev.showVid }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"media-video\">\n                    <iframe src=\"{{ ev.embedSrc }}\" title=\"{{ ev.title }}\"\n                      allow=\"accelerometer; encrypted-media; picture-in-picture; web-share; fullscreen\"\n                      referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen><\u002Fiframe>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n            <\u002Fsc-if>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-for>\n\n  <\u002Fsection>\n  <\u002Fsc-for>\n\n  <figure class=\"origin-banner\">\n        <figure class=\"origin-banner-inner\">\n          <sc-if value=\"{{ hasOriginImg }}\" hint-placeholder-val=\"{{ true }}\">\n            <img class=\"ev-img ev-img--plate\" src=\"{{ originImg }}\" alt=\"Ảnh minh hoạ: Lạc Long Quân – Âu Cơ\" loading=\"lazy\" decoding=\"async\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noOriginImg }}\" hint-placeholder-val=\"{{ false }}\">\n            <image-slot id=\"ck-origin\" shape=\"rect\" fit=\"cover\" style=\"display:block;width:100%;aspect-ratio:4/3\" placeholder=\"Ảnh minh hoạ: Lạc Long Quân – Âu Cơ\"><\u002Fimage-slot>\n          <\u002Fsc-if>\n            <figcaption>\n              <b>Hình minh hoạ: Lạc Long Quân – Âu Cơ <i class=\"img-ref\">[*]<\u002Fi><\u002Fb>\n              <span>Theo truyền thuyết, Lạc Long Quân thuộc giống Rồng kết duyên cùng Âu Cơ dòng Tiên, sinh ra bọc trăm trứng nở thành trăm người con. Năm mươi người theo cha xuống biển, năm mươi người theo mẹ lên non; người con trưởng được tôn làm Hùng Vương, lập nên nước Văn Lang. Đây là truyền thuyết về cội nguồn “con Rồng cháu Tiên”, không phải ghi chép sử liệu.<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n  <\u002Ffigure>\n\n  <div class=\"sources\">\n    <h3>NGUỒN &amp; ĐIỀU KHOẢN<\u002Fh3>\n\n    <details class=\"fold\">\n      <summary><b>Tài liệu tham khảo<\u002Fb><\u002Fsummary>\n      <div class=\"fold-body\">\n        <p class=\"refintro\">Toàn bộ 81 mốc đều dẫn nguồn từ chính sử, văn kiện Đảng và tài liệu của\n        các cơ quan Nhà nước. Số trong ngoặc là số mốc lấy thông tin từ nguồn đó.<\u002Fp>\n        <ul class=\"reflist\">\n          <li><b>Bảo tàng Lịch sử quốc gia<\u002Fb><span>baotanglichsu.vn — chuyên khảo và bài nghiên cứu lịch sử (34 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Tư liệu – Văn kiện Đảng<\u002Fb><span>tulieuvankien.dangcongsan.vn — văn kiện, biên niên sự kiện, văn kiện Đại hội Đảng (11 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Báo điện tử Đảng Cộng sản Việt Nam<\u002Fb><span>dangcongsan.vn — chuyên đề lịch sử Đảng và dân tộc (10 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Bộ Quốc phòng<\u002Fb><span>mod.gov.vn — lịch sử quân sự và nghệ thuật quân sự Việt Nam (10 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Báo Điện tử Chính phủ<\u002Fb><span>baochinhphu.vn — sự kiện và văn kiện Chính phủ (7 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Quốc hội Việt Nam<\u002Fb><span>quochoi.vn — Tổng tuyển cử 1946, Quốc hội khóa VI (2 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Bộ Ngoại giao<\u002Fb><span>mofa.gov.vn — hội nhập quốc tế, ASEAN, Hội đồng Bảo an (2 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Trung tâm WTO và Hội nhập, VCCI<\u002Fb><span>trungtamwto.vn — BTA, WTO (2 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Ban Quản lý Lăng Chủ tịch Hồ Chí Minh<\u002Fb><span>bqllang.gov.vn — Mặt trận Việt Minh (1 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Bộ Công Thương<\u002Fb><span>moit.gov.vn — Hiệp định EVFTA (1 mốc)<\u002Fspan><\u002Fli>\n          <li><b>Cơ sở dữ liệu quốc gia về văn bản pháp luật<\u002Fb><span>vanban.chinhphu.vn — Nghị quyết 202/2025/QH15 (1 mốc)<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdetails>\n\n    <details class=\"fold\">\n      <summary><b>Nguồn ảnh minh hoạ<\u002Fb><\u002Fsummary>\n      <div class=\"fold-body\">\n        <p class=\"refintro\">Số <i>[n]<\u002Fi> dưới mỗi ảnh trong trang ứng với một dòng dưới đây.\n        Ảnh được dùng cho mục đích giáo dục, phi thương mại; bản quyền thuộc về nguồn đã dẫn.<\u002Fp>\n        <div class=\"imglist\">\n          <sc-for list=\"{{ imgRefs }}\" as=\"im\" hint-placeholder-count=\"3\">\n            <div class=\"imgrow\">\n              <b>[{{ im.n }}]<\u002Fb>\n              <div>\n                <span>{{ im.title }}<\u002Fspan>\n                <sc-if value=\"{{ im.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <i>{{ im.note }}<\u002Fi>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ im.hasUrl }}\" hint-placeholder-val=\"{{ true }}\">\n                  <a href=\"{{ im.url }}\" target=\"_blank\" rel=\"noopener\">{{ im.label }}<\u002Fa>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div class=\"imgrow\">\n            <b>[*]<\u002Fb>\n            <div>\n              <span>Hình minh hoạ Lạc Long Quân – Âu Cơ<\u002Fspan>\n              <i>Tranh minh hoạ cho truyền thuyết, không phải ảnh tư liệu lịch sử.<\u002Fi>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdetails>\n\n    <details class=\"fold\">\n      <summary><b>Miễn trừ trách nhiệm<\u002Fb><\u002Fsummary>\n      <div class=\"fold-body disclaimer\">\n        <p>Trang thông tin này là <strong>sản phẩm nghiên cứu và tổng hợp cá nhân, được thực hiện\n        với mục đích phi thương mại, ngoài phạm vi nhiệm vụ công vụ<\u002Fstrong> và không phải là ấn\n        phẩm, cơ sở dữ liệu hay kênh thông tin chính thức của bất kỳ cơ quan, tổ chức nào.<\u002Fp>\n\n        <p>Tác giả hiện công tác tại <strong>Trường Đại học VinUni<\u002Fstrong> và <strong>Trung tâm Mã\n        số, Mã vạch Quốc gia, Ủy ban Tiêu chuẩn Đo lường Chất lượng Quốc gia, Bộ Khoa học và Công\n        nghệ<\u002Fstrong>. Việc đề cập các cơ quan, tổ chức này chỉ nhằm cung cấp thông tin về tác giả\n        và <strong>không hàm ý sự bảo trợ, xác nhận, phê duyệt hoặc chịu trách nhiệm của các cơ\n        quan, tổ chức đó đối với nội dung của trang<\u002Fstrong>. Mọi nhận định, cách thức lựa chọn,\n        sắp xếp và trình bày thông tin trên trang thuộc trách nhiệm cá nhân của tác giả và không\n        đại diện cho quan điểm chính thức của bất kỳ cơ quan, tổ chức nào nêu trên.<\u002Fp>\n\n        <p>Ý tưởng xây dựng trang được gợi mở từ <strong>nguyên lý truy xuất nguồn gốc<\u002Fstrong>\n        trong lĩnh vực mã số, mã vạch và được vận dụng vào việc <strong>truy nguyên nguồn thông\n        tin lịch sử<\u002Fstrong>. Theo đó, các mốc sự kiện, tư liệu và hình ảnh được trình bày theo\n        hướng gắn với nguồn công bố tương ứng, nhằm tạo điều kiện để người đọc có thể kiểm tra,\n        đối chiếu và tiếp cận nguồn tư liệu ban đầu.<\u002Fp>\n\n        <p>Nội dung về các sự kiện và mốc lịch sử được tác giả tổng hợp, biên soạn và trình bày\n        trên cơ sở <strong>chính sử, văn kiện của Đảng, văn bản và tài liệu do các cơ quan Nhà\n        nước, cơ quan lưu trữ, cơ quan nghiên cứu và các nguồn có thẩm quyền công bố<\u002Fstrong>,\n        được dẫn hoặc liệt kê tại mục <strong>Tài liệu tham khảo<\u002Fstrong>. Việc lựa chọn, rút gọn\n        và sắp xếp nội dung nhằm phục vụ việc tra cứu và tiếp cận thông tin, <strong>không nhằm\n        diễn giải lại, sửa đổi hoặc thay thế nội dung của tài liệu gốc<\u002Fstrong>.<\u002Fp>\n\n        <p>Trang này <strong>không phải là nguồn sử liệu gốc, tài liệu lưu trữ, văn bản chính thức\n        hoặc tài liệu có giá trị thay thế cho nguồn được dẫn<\u002Fstrong>. Đối với các mục đích nghiên\n        cứu, học thuật, hành chính, pháp lý hoặc trích dẫn chính thức, người đọc nên kiểm tra và\n        sử dụng trực tiếp tài liệu gốc hoặc nguồn công bố chính thức tương ứng.<\u002Fp>\n\n        <p>Mặc dù tác giả đã cố gắng kiểm tra, đối chiếu và ghi nhận nguồn của thông tin, do giới\n        hạn của quá trình tổng hợp và khả năng thay đổi, bổ sung của các nguồn tư liệu, tác giả\n        <strong>không bảo đảm rằng toàn bộ nội dung trên trang luôn đầy đủ, không có sai sót hoặc\n        được cập nhật tại mọi thời điểm<\u002Fstrong>. Người sử dụng có trách nhiệm tự kiểm chứng thông\n        tin trước khi sử dụng cho những mục đích có tính quyết định. Trong phạm vi pháp luật cho\n        phép, tác giả không chịu trách nhiệm đối với các thiệt hại hoặc hệ quả phát sinh từ việc\n        sử dụng thông tin trên trang mà không có sự kiểm tra, đối chiếu với nguồn gốc được dẫn.<\u002Fp>\n\n        <p>Các hình ảnh, bản đồ, tư liệu trực quan và tài liệu minh họa trên trang được sử dụng\n        nhằm mục đích <strong>minh họa, giáo dục và cung cấp thông tin phi thương mại<\u002Fstrong>.\n        Nguồn của từng tư liệu được ghi nhận tại vị trí tương ứng hoặc tại mục <strong>Nguồn ảnh\n        minh họa<\u002Fstrong>. Việc dẫn nguồn không đồng nghĩa với việc tác giả tuyên bố quyền sở hữu\n        đối với các tư liệu đó; <strong>quyền tác giả và các quyền liên quan, nếu có, thuộc về chủ\n        thể quyền tương ứng theo quy định của pháp luật<\u002Fstrong>.<\u002Fp>\n\n        <p>Nếu cơ quan, tổ chức, tác giả, chủ thể quyền hoặc người đọc phát hiện thông tin chưa\n        chính xác, nguồn dẫn chưa đầy đủ hoặc có vấn đề liên quan đến quyền tác giả và quyền liên\n        quan, vui lòng liên hệ với tác giả qua\n        <a href=\"https://ducnha.work\" target=\"_blank\" rel=\"noopener\">ducnha.work<\u002Fa>. Trên cơ sở\n        thông tin và tài liệu xác đáng được cung cấp, tác giả sẽ xem xét <strong>đính chính, bổ\n        sung nguồn, điều chỉnh hoặc gỡ bỏ nội dung phù hợp trong thời gian hợp lý<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdetails>\n  <\u002Fdiv>\n\n  <div class=\"finale\">\n    <svg class=\"finale-flag\" viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Quốc kỳ nước Cộng hoà xã hội chủ nghĩa Việt Nam\">\n      <rect width=\"30\" height=\"20\" fill=\"#DA251D\"/>\n      <polygon fill=\"#FFFF00\" points=\"15.00,4.00 16.35,8.15 20.71,8.15 17.18,10.71 18.53,14.85 15.00,12.29 11.47,14.85 12.82,10.71 9.29,8.15 13.65,8.15\"/>\n    <\u002Fsvg>\n    <p class=\"finale-cry\">Việt Nam độc lập và thống nhất muôn năm!<br>Kháng chiến thắng lợi muôn năm!<\u002Fp>\n    <p class=\"finale-src\">Hai câu kết trong\n    <a href=\"https://nhandan.vn/loi-keu-goi-toan-quoc-khang-chien-post280911.html\" target=\"_blank\" rel=\"noopener\">Lời kêu gọi Toàn quốc kháng chiến<\u002Fa>\n    của Chủ tịch Hồ Chí Minh, Hà Nội, ngày 19 tháng 12 năm 1946.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<a class=\"totop\" href=\"#top\" aria-label=\"Về đầu trang\"><span>↑<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 560, &quot;height&quot;: 900 },\n  &quot;showMeaningAlways&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Chuỗi&quot; },\n  &quot;ctaHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Bán hàng&quot; }\n}\">\nclass Component extends DCLogic {\n  DATA = {\n  \"events\": [\n    {\n      \"id\": 1,\n      \"phase\": \"dung_nuoc\",\n      \"era\": \"Buổi đầu dựng nước\",\n      \"spine\": true,\n      \"date\": \"TK VII TCN\",\n      \"title\": \"Hùng Vương lập nước Văn Lang\",\n      \"description\": \"Vào khoảng thế kỷ thứ 7 trước Công nguyên, trên cơ sở phát triển rực rỡ của văn hóa Đông Sơn, nhà nước đầu tiên đã ra đời, đó là nhà nước Văn Lang. Kinh đô đặt tại Phong Châu, nay thuộc Việt Trì, Phú Thọ.\",\n      \"source\": \"Nhà nước Văn Lang - Âu Lạc, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/4043/nha-nuoc-van-lang-au-lac\"\n    },\n    {\n      \"id\": 2,\n      \"phase\": \"dung_nuoc\",\n      \"era\": \"Buổi đầu dựng nước\",\n      \"spine\": false,\n      \"date\": \"257 TCN\",\n      \"title\": \"An Dương Vương lập nước Âu Lạc, xây thành Cổ Loa\",\n      \"description\": \"Khoảng thế kỷ thứ 3 trước Công nguyên, nhà nước Văn Lang suy yếu. Thục Phán An Dương Vương hợp nhất hai khối cư dân Âu Việt và Lạc Việt, lập nên nhà nước Âu Lạc, đóng đô ở Cổ Loa, nay thuộc Hà Nội.\",\n      \"source\": \"Nhà nước Văn Lang - Âu Lạc, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/4043/nha-nuoc-van-lang-au-lac\"\n    },\n    {\n      \"id\": 3,\n      \"phase\": \"dung_nuoc\",\n      \"era\": \"Buổi đầu dựng nước\",\n      \"spine\": false,\n      \"date\": \"179 TCN\",\n      \"title\": \"Triệu Đà thôn tính Âu Lạc\",\n      \"description\": \"Triệu Đà nhiều lần đem quân đánh Âu Lạc nhưng đều thất bại vì Âu Lạc có lực lượng quân sự mạnh, thành lũy kiên cố và vũ khí lợi hại, nhất là nỏ Liên Châu. Không thắng được bằng vũ lực, Triệu Đà đổi kế, xin giảng hòa và cầu hôn cho con là Trọng Thủy lấy Mỵ Châu, con gái An Dương Vương, đưa con ở rể tại Cổ Loa để dò xét tình hình, chia rẽ nội bộ và làm suy yếu triều đình Âu Lạc. Sau khi nắm được bí mật quân sự và phòng thủ của Âu Lạc, Triệu Đà bất ngờ tiến đánh và chiếm được Cổ Loa.\",\n      \"source\": \"Nỏ thần Liên Châu - Nỗi khiếp đảm của giặc ngoại xâm phương Bắc, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3096/15792/no-than-lien-chau-noi-khiep-djam-cua-giac-ngoai-xam-phuong-bac.html\"\n    },\n    {\n      \"id\": 4,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": true,\n      \"date\": \"40–43\",\n      \"title\": \"Khởi nghĩa Hai Bà Trưng\",\n      \"description\": \"Năm 40, trên mảnh đất Mê Linh, Hai Bà Trưng giương cao ngọn cờ tụ nghĩa, kêu gọi hào kiệt bốn phương cùng nhân dân cả nước đứng lên đánh đuổi quân Đông Hán. Được sự hưởng ứng của Lạc Hầu, Lạc Tướng và nhân dân khắp 65 huyện thành, chỉ trong thời gian ngắn Hai Bà đã đánh đuổi quân Tô Định ra khỏi bờ cõi. Trưng Trắc được suy tôn lên ngôi vua, lấy hiệu là Trưng Nữ Vương, định đô ở Mê Linh.\",\n      \"source\": \"Cuộc khởi nghĩa Hai Bà Trưng (năm 40 - 43 sau Công nguyên), Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/13485/cuoc-khoi-nghia-hai-ba-trung-nam-40-43-sau-cong-nguyen.html\"\n    },\n    {\n      \"id\": 5,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"248\",\n      \"title\": \"Khởi nghĩa Bà Triệu\",\n      \"description\": \"Triệu Thị Trinh quê miền núi Quân Yên, nay thuộc Yên Định, Thanh Hóa, cùng anh là Triệu Quốc Đạt dấy binh ở núi Nưa năm 248 chống quân Ngô. Khởi nghĩa lan từ Cửu Chân sang Giao Chỉ, nghĩa quân đánh chiếm thành Tư Phố và xây dựng căn cứ Bồ Điền, khiến toàn thể Châu Giao đều chấn động. Nhà Ngô sai Lục Dận đem tám nghìn quân sang đàn áp, Triệu Thị Trinh tự vẫn ngày 22 tháng 2 năm 248.\",\n      \"source\": \"Cuộc khởi nghĩa của Triệu Thị Trinh, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/14281/cuoc-khoi-nghia-cua-trieu-thi-trinh.html\"\n    },\n    {\n      \"id\": 6,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"542–544\",\n      \"title\": \"Lý Bí lập nước Vạn Xuân, xưng Lý Nam Đế\",\n      \"description\": \"Cuộc khởi nghĩa do Lý Bí lãnh đạo bùng nổ tháng Giêng năm 542, đánh đuổi quân Lương và đẩy lui cuộc xâm lấn của Lâm Ấp ở phía nam. Tháng 2 năm 544, Lý Bí tuyên bố dựng nước độc lập, đặt quốc hiệu Vạn Xuân, lên ngôi xưng Nam Đế, đặt niên hiệu Thiên Đức, dựng kinh đô ở vùng sông Tô Lịch và cho xây chùa Khai Quốc, nay là chùa Trấn Quốc.\",\n      \"source\": \"Tháng 2/544 - Lý Nam Đế tuyên bố dựng nước độc lập, Quốc hiệu Vạn Xuân, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/2001/68142/thang-2-544-ly-nam-dje-tuyen-bo-dung-nuoc-djoc-lap-quoc-hieu-van-xuan.html\"\n    },\n    {\n      \"id\": 7,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"550–571\",\n      \"title\": \"Triệu Quang Phục đánh bại quân Lương\",\n      \"description\": \"Trước thế mạnh của quân Lương, Lý Nam Đế lui về động Khuất Lão ở Phú Thọ và trao quyền chỉ huy quân sự cho Triệu Quang Phục. Triệu Quang Phục lập căn cứ ở đầm Dạ Trạch, thực hiện lối đánh lâu dài, lấy tiêu hao, mai phục và tập kích bất ngờ làm cách đánh chủ yếu.\",\n      \"source\": \"Tháng 2/544 - Lý Nam Đế tuyên bố dựng nước độc lập, Quốc hiệu Vạn Xuân, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/2001/68142/thang-2-544-ly-nam-dje-tuyen-bo-dung-nuoc-djoc-lap-quoc-hieu-van-xuan.html\"\n    },\n    {\n      \"id\": 8,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"713–722\",\n      \"title\": \"Khởi nghĩa Mai Thúc Loan (Mai Hắc Đế)\",\n      \"description\": \"Năm Quý Sửu 713, Mai Thúc Loan phát động khởi nghĩa ở Hoan Châu, tức vùng Nghệ - Tĩnh ngày nay, chống ách đô hộ nhà Đường. Ông tự xưng là Hắc Đế và cho xây kinh đô Vạn An ở vùng Sa Nam, nay thuộc Nam Đàn, Nghệ An. Vương triều tồn tại gần mười năm, truyền qua ba đời vua, đến năm Quý Hợi 723 thì kinh đô Vạn An thất thủ trước quân Đường do Dương Tư Húc và Quang Sở Khách chỉ huy.\",\n      \"source\": \"Những điều ít biết về vương triều của Mai Hắc Đế, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3096/6906/nhung-djieu-it-biet-ve-vuong-trieu-cua-mai-hac-dje.html\"\n    },\n    {\n      \"id\": 9,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"~766–791\",\n      \"title\": \"Khởi nghĩa Phùng Hưng (Bố Cái Đại Vương)\",\n      \"description\": \"Phùng Hưng quê ở đất Đường Lâm, nay thuộc Sơn Tây, Hà Nội, phát động khởi nghĩa chống ách đô hộ nhà Đường vào khoảng niên hiệu Đại Lịch 766-779. Tháng 4 năm Tân Mùi 791, nghĩa quân chia làm năm đạo vây đánh thành Tống Bình, nhưng Phùng Hưng qua đời ngay trong năm 791; con là Phùng An nối nghiệp được hai năm. Nhân dân suy tôn ông là Bố Cái Đại Vương.\",\n      \"source\": \"Chuyện về Phùng Hưng của đất Đường Lâm hai vua, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/12335/chuyen-ve-phung-hung-cua-djat-djuong-lam-hai-vua.html\"\n    },\n    {\n      \"id\": 10,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"905\",\n      \"title\": \"Khúc Thừa Dụ giành quyền tự chủ\",\n      \"description\": \"Đầu thế kỷ X, Khúc Thừa Dụ, một hào trưởng ở Hồng Châu, nay thuộc Ninh Giang, Hải Dương, nổi dậy năm 905 chiếm phủ Tống Bình và tự xưng Tiết độ sứ; triều Đường phải công nhận và phong ông làm Tiết độ sứ Tĩnh Hải quân. Tuy vẫn mang danh hiệu quan lại nhà Đường, trên thực tế Khúc Thừa Dụ đã dựng nên một chính quyền tự chủ, chấm dứt hơn một nghìn năm Bắc thuộc. Sau khi ông mất năm 907, Khúc Hạo (907-917) và Khúc Thừa Mỹ (917-930) tiếp nối sự nghiệp với những cải cách nhằm củng cố nền tự chủ.\",\n      \"source\": \"Võ tướng Dương Đình Nghệ - người khởi binh đánh đuổi quân Nam Hán, giải phóng thành Đại La, giành quyền tự chủ cho nước Việt, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"http://baotanglichsu.vn/vi/Articles/3098/15781/vo-tuong-duong-djinh-nghe-nguoi-khoi-binh-djanh-djuoi-quan-nam-han-giai-phong-thanh-djai-la-gianh-quyen-tu-chu-cho-nuoc-viet.html\"\n    },\n    {\n      \"id\": 11,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"931\",\n      \"title\": \"Dương Đình Nghệ đánh đuổi quân Nam Hán\",\n      \"description\": \"Năm 931, Dương Đình Nghệ khởi binh từ quê nhà, nay là đất các xã Thiệu Dương, Thiệu Khánh, huyện Thiệu Hóa, đánh quân Nam Hán qua ba trận với các tướng Lý Khắc Chính, Lý Tiến và Trần Bảo. Ông giải phóng thành Đại La và tự xưng là Tiết độ sứ để quản lý công việc nước nhà.\",\n      \"source\": \"Võ tướng Dương Đình Nghệ, người khởi binh đánh đuổi quân Nam Hán giải phóng thành Đại La, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"http://baotanglichsu.vn/vi/Articles/3098/15781/vo-tuong-duong-djinh-nghe-nguoi-khoi-binh-djanh-djuoi-quan-nam-han-giai-phong-thanh-djai-la-gianh-quyen-tu-chu-cho-nuoc-viet.html\"\n    },\n    {\n      \"id\": 12,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": true,\n      \"date\": \"938\",\n      \"title\": \"Ngô Quyền đại thắng Bạch Đằng\",\n      \"description\": \"Sau khi nhà Đường sụp đổ, vua Nam Hán mở cuộc chiến tranh xâm lược nước ta. Ngô Quyền huy động nhân dân đẵn gỗ, vót nhọn, bịt sắt, đóng thành một bãi cọc ở cửa sông Bạch Đằng, bố trí quân thuỷ bộ mai phục bên trong. Khi thuỷ triều xuống, thuyền địch va vào cọc nhọn bịt sắt bị đâm thủng, chìm đắm gần hết; Lưu Hoằng Tháo tử trận.\",\n      \"source\": \"Ngô Quyền và Chiến thắng Bạch Đằng năm 938, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/13934/ngo-quyen-va-chien-thang-bach-djang-nam-938.html\"\n    },\n    {\n      \"id\": 13,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"939\",\n      \"title\": \"Ngô Quyền xưng vương, lập nhà Ngô\",\n      \"description\": \"Mùa xuân năm 939, sau chiến thắng oanh liệt đánh tan quân Nam Hán trên sông Bạch Đằng, Ngô Quyền xưng Vương, lập nên nhà Ngô và chọn Cổ Loa làm kinh đô. Sự kiện này tạo bước ngoặt lớn của lịch sử, chấm dứt hơn một nghìn năm Bắc thuộc, mở ra kỷ nguyên độc lập, tự chủ của dân tộc. Ngô Quyền trị vì nước nhà độc lập từ năm 939 đến năm 944.\",\n      \"source\": \"Kỷ niệm 1085 năm đức vua Ngô Quyền xưng vương, định đô ở Cổ Loa, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/tu-tuong-van-hoa/ky-niem-1085-nam-duc-vua-ngo-quyen-xung-vuong-dinh-do-o-co-loa-663526.html\"\n    },\n    {\n      \"id\": 14,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"968\",\n      \"title\": \"Đinh Bộ Lĩnh lập nước Đại Cồ Việt, đô Hoa Lư\",\n      \"description\": \"Năm 968, Đinh Bộ Lĩnh dẹp yên loạn 12 sứ quân, chấm dứt nạn cát cứ và thống nhất đất nước. Ông lên ngôi, xưng Đại Thắng Minh Hoàng Đế, đặt quốc hiệu Đại Cồ Việt, định đô ở Hoa Lư nay thuộc Ninh Bình, năm 970 đặt niên hiệu Thái Bình. Triều Đinh lập chế độ thập đạo quân, tổ chức quân sự thống nhất đầu tiên thời độc lập.\",\n      \"source\": \"Nhà Đinh với sự nghiệp thống nhất đất nước, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3096/10060/nha-djinh-voi-su-nghiep-thong-nhat-djat-nuoc.html\"\n    },\n    {\n      \"id\": 15,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"981\",\n      \"title\": \"Lê Đại Hành đánh bại quân Tống lần thứ nhất\",\n      \"description\": \"Năm 981, Lê Hoàn cùng tướng lĩnh và quân đội tổ chức thế trận phòng ngự vững chắc, với các điểm then chốt ở ải Bình Lỗ và cửa sông Bạch Đằng. Ông dự đoán chính xác hướng tiến công của các tướng Tống là Hầu Nhân Bảo, Tôn Toàn Hưng và Lưu Trừng nên chủ động bố trí lực lượng chặn đánh. Trong cuộc kháng chiến chống Tống lần thứ nhất, Lê Hoàn với năm vạn quân đã đánh bại mười vạn quân xâm lược, chia cắt thủy binh và bộ binh địch, đánh tan chúng ở Bạch Đằng và Chi Lăng, giết tướng Hầu Nhân Bảo năm 981.\",\n      \"source\": \"Nghệ thuật quân sự trong hai lần kháng chiến chống quân Tống, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-ttk/sa-ttdv-kienthucqp/sa-ttk-ktqp-ntqs/sa-ttk-ktqp-ntqs-vn/635c41dc-c8fb-4d79-8f20-0071a2ae4c1c\"\n    },\n    {\n      \"id\": 16,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": true,\n      \"date\": \"1010\",\n      \"title\": \"Lý Công Uẩn dời đô về Thăng Long (Chiếu dời đô)\",\n      \"description\": \"Năm 1010, Lý Công Uẩn ban Thiên đô chiếu, dời đô từ Hoa Lư về thành Đại La và đổi tên là Thăng Long, với mong muốn đất nước bền lâu, phồn thịnh, nhân dân được hưởng thái bình. Hoàng thành Thăng Long được khởi dựng trong dịp này và hoàn thành năm 1011.\",\n      \"source\": \"1010 năm Thăng Long - Hà Nội: Tỏa rạng hào khí rồng bay, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/xay-dung-dang/1010-nam-thang-long-ha-noi-toa-rang-hao-khi-rong-bay-565323.html\"\n    },\n    {\n      \"id\": 17,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1054\",\n      \"title\": \"Lý Thánh Tông đổi quốc hiệu Đại Việt\",\n      \"description\": \"Năm Giáp Ngọ 1054, vua Lý Thánh Tông cho đổi tên nước là Đại Việt, thay cho quốc hiệu Đại Cồ Việt trước đó. Cũng dưới triều Lý, tháng 8 năm Canh Tuất 1070 vua cho lập Văn Miếu, và năm 1076 mở Quốc Tử Giám, trường đại học đầu tiên của nước ta, làm nơi đào tạo nhân tài cho đất nước.\",\n      \"source\": \"Những năm Ngọ vẻ vang trong lịch sử dân tộc, Báo Điện tử Chính phủ; và Vương triều Lý: Mở đầu thời kỳ hưng thịnh của nước Đại Việt, Báo Điện tử Chính phủ\",\n      \"sourceUrl\": \"https://baochinhphu.vn/nhung-nam-ngo-ve-vang-trong-lich-su-dan-toc-102158235.htm\"\n    },\n    {\n      \"id\": 18,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": true,\n      \"date\": \"1077\",\n      \"title\": \"Chiến thắng Như Nguyệt và bài thơ Nam quốc sơn hà\",\n      \"description\": \"Phòng tuyến Như Nguyệt bên bờ nam sông Cầu được xây dựng thành hệ thống liên hoàn từ Tam Đảo đến Yên Tử, gắn với các công trình phòng thủ ven biển đông bắc, dưới sự chỉ huy trực tiếp của Lý Thường Kiệt. Bài thơ Nam quốc sơn hà vang lên tại phòng tuyến này năm 1077, được đời sau coi là bản tuyên ngôn độc lập đầu tiên của dân tộc. Lý Thường Kiệt chủ động đề nghị giảng hòa, tướng Tống là Quách Quỳ chấp thuận và rút quân vào tháng ba năm Đinh Tỵ.\",\n      \"source\": \"Kỷ niệm 937 năm cuộc kháng chiến chống quân Tống lần thứ hai thắng lợi (1077-2014), Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3097/16199/ky-niem-937-nam-cuoc-khang-chien-chong-quan-tong-lan-thu-hai-thang-loi-1077-2014.html\"\n    },\n    {\n      \"id\": 19,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1226\",\n      \"title\": \"Nhà Trần thành lập\",\n      \"description\": \"Ngày 10 tháng 1 năm 1226, Lý Chiêu Hoàng nhường ngôi cho chồng là Trần Cảnh; Trần Cảnh lên ngôi, tức Trần Thái Tông, lập nên nhà Trần. Khi đó Trần Cảnh mới tám tuổi. Nhà Trần trị vì từ năm 1226 đến năm 1400.\",\n      \"source\": \"Ngày này năm xưa 10/01, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/ngay-nay-nam-xua/ngay-nay-nam-xua-10-01-657761.html\"\n    },\n    {\n      \"id\": 20,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1258\",\n      \"title\": \"Kháng chiến chống Mông Cổ lần I (Đông Bộ Đầu)\",\n      \"description\": \"Trong cuộc kháng chiến lần thứ nhất năm 1258, sau các trận chặn đánh kỵ binh Mông Cổ ở biên giới tây bắc và nhất là trận Bình Lệ Nguyên, vua Trần và Lê Tần quyết định lui quân để bảo toàn lực lượng. Nhà Trần chủ trương không đánh trực diện mà bao vây, mai phục, huy động nhân dân thực hiện kế vườn không nhà trống, cô lập địch và cắt đường tiếp tế. Trận quyết chiến chiến lược Đông Bộ Đầu kết thúc thắng lợi cuộc kháng chiến.\",\n      \"source\": \"Nghệ thuật quân sự trong ba lần chống xâm lược Nguyên - Mông, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-ttk/sa-ttdv-kienthucqp/sa-ttk-ktqp-ntqs/sa-ttk-ktqp-ntqs-vn/03fb764f-4c1a-41d1-b0c5-37e88c332490\"\n    },\n    {\n      \"id\": 21,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1284\",\n      \"title\": \"Hội nghị Diên Hồng\",\n      \"description\": \"Hội nghị Diên Hồng diễn ra mùa đông năm Giáp Thân 1284, các bô lão đồng thanh hô quyết đánh trước nguy cơ quân Nguyên Mông xâm lược lần thứ hai.\",\n      \"source\": \"Nghệ thuật quân sự trong ba lần chống xâm lược Nguyên - Mông, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-ttk/sa-ttdv-kienthucqp/sa-ttk-ktqp-ntqs/sa-ttk-ktqp-ntqs-vn/03fb764f-4c1a-41d1-b0c5-37e88c332490\"\n    },\n    {\n      \"id\": 22,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1285\",\n      \"title\": \"Kháng chiến chống Nguyên Mông lần II\",\n      \"description\": \"Cuộc kháng chiến lần thứ hai kéo dài từ cuối tháng Chạp năm Giáp Thân 1284 đến cuối tháng Tư năm Ất Dậu 1285. Dưới sự lãnh đạo của vua Trần và Quốc công tiết chế Trần Quốc Tuấn cùng các tướng Trần Quang Khải, Trần Bình Trọng, Phạm Ngũ Lão, quân dân ta đã đánh bại quân Nguyên Mông trong mùa xuân năm 1285.\",\n      \"source\": \"Nghệ thuật quân sự trong ba lần chống xâm lược Nguyên - Mông, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-ttk/sa-ttdv-kienthucqp/sa-ttk-ktqp-ntqs/sa-ttk-ktqp-ntqs-vn/03fb764f-4c1a-41d1-b0c5-37e88c332490\"\n    },\n    {\n      \"id\": 23,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": true,\n      \"date\": \"1288\",\n      \"title\": \"Đại thắng Nguyên Mông trên sông Bạch Đằng\",\n      \"description\": \"Trần Khánh Dư bố trí trận địa mai phục ở Vân Đồn, tiêu diệt toàn bộ đoàn thuyền tải lương của Trương Văn Hổ. Trên sông Bạch Đằng, Trần Quốc Tuấn cho bố trí những trận địa cọc ngầm quy mô lớn, khi thủy triều xuống trở thành bãi cản mà thuyền lớn, thuyền nhỏ không thể vượt qua. Ngày 9 tháng 4 năm 1288, quân ta thu hơn 400 chiến thuyền của giặc, các tướng Ô Mã Nhi và Phàn Tiếp bị bắt, Thoát Hoan phải mở đường máu chạy thoát.\",\n      \"source\": \"Kỷ niệm 726 năm (1288-2014) - Chiến thắng quân Nguyên Mông lần thứ 3, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3097/15641/ky-niem-726-nam-1288-2014-chien-thang-quan-nguyen-mong-lan-thu-3.html\"\n    },\n    {\n      \"id\": 24,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1400\",\n      \"title\": \"Hồ Quý Ly lập nhà Hồ, cải cách\",\n      \"description\": \"Năm 1400, Hồ Quý Ly lên ngôi, lập nên nhà Hồ, đặt niên hiệu Thánh Nguyên, quốc hiệu Đại Ngu, kinh đô đóng ở thành Tây Đô, Thanh Hóa. Ông tiến hành cải cách toàn diện và táo bạo trên các lĩnh vực chính trị, hành chính, quốc phòng, kinh tế, tài chính, văn hóa, giáo dục và xã hội, với những chính sách như phát hành tiền giấy Thông bảo hội sao, hạn điền, hạn nô, đề cao chữ Nôm và chấn chỉnh khoa cử.\",\n      \"source\": \"Cải cách Hồ Quý Ly, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3129/19687/cai-cach-ho-quy-ly.html\"\n    },\n    {\n      \"id\": 25,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1407\",\n      \"title\": \"Nhà Minh xâm lược\",\n      \"description\": \"Tháng 9 năm Bính Tuất 1406, nhà Minh đưa 80 vạn quân, chưa kể một số đông dân cư và thổ binh tải lương, chia làm hai đạo tiến vào nước ta. Đến tháng 5 năm Đinh Hợi 1407, cuộc kháng chiến của nhà Hồ thất bại, Hồ Quý Ly bị bắt khi rút về vùng Nghệ An - Hà Tĩnh. Sau đó nhân dân ta ở nhiều nơi vẫn tiếp tục nổi dậy chống ách đô hộ của quân Minh.\",\n      \"source\": \"Thất bại của nhà Hồ trong cuộc kháng chiến chống quân Minh, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3096/11772/that-bai-cua-nha-ho-trong-cuoc-khang-chien-chong-quan-minh.html\"\n    },\n    {\n      \"id\": 26,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": false,\n      \"date\": \"1418\",\n      \"title\": \"Lê Lợi phát động khởi nghĩa Lam Sơn\",\n      \"description\": \"Ngày 7 tháng 2 năm 1418, Lê Lợi phát động khởi nghĩa Lam Sơn, chính thức mở đầu cuộc đấu tranh vũ trang chống quân Minh xâm lược. Cuộc khởi nghĩa do Lê Lợi lãnh đạo từ vùng núi phía tây Thanh Hóa, được nhân dân từ người Kinh đến các dân tộc thiểu số ủng hộ mạnh mẽ ngay từ đầu.\",\n      \"source\": \"Khởi nghĩa Lam Sơn (1418 - 1427) - Giá trị lịch sử và hiện thực, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://www.mod.gov.vn/vn/chi-tiet/sa-ttsk/sa-tt-qpan/71b0803a-ffd4-4b8b-80a3-12973eb01ead\"\n    },\n    {\n      \"id\": 27,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": false,\n      \"date\": \"1427\",\n      \"title\": \"Chiến thắng Chi Lăng – Xương Giang\",\n      \"description\": \"Nhà Minh cử hai đạo viện binh: Liễu Thăng chỉ huy mười vạn quân và hai vạn ngựa qua Quảng Tây vào Lạng Sơn, Mộc Thạnh chỉ huy năm vạn quân qua Vân Nam vào Lào Cai. Liễu Thăng bị phóng lao đâm chết ở sườn núi Mã Yên; Mộc Thạnh rút chạy khi biết tin thất bại. Trong 27 ngày từ 8 tháng 10 đến 3 tháng 11 năm 1427, quân Lam Sơn tiêu diệt mười vạn quân Liễu Thăng và đánh tan năm vạn quân Mộc Thạnh, buộc Vương Thông bị vây ở thành Đông Quan phải đầu hàng.\",\n      \"source\": \"Chiến thắng Chi Lăng - Xương Giang (8-10 đến 3-11-1427), Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3097/15231/chien-thang-chi-lang-xuong-giang-8-10-djen-3-11-1427.html\"\n    },\n    {\n      \"id\": 28,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": true,\n      \"date\": \"1428\",\n      \"title\": \"Bình Ngô đại cáo\",\n      \"description\": \"Ngày 10 tháng 12 năm 1427, Hội thề Đông Quan diễn ra giữa Lê Lợi và tướng Minh Vương Thông. Vương Thông cam kết rút hết quân về nước, không cướp bóc nhân dân trên đường rút và không bao giờ xâm phạm Đại Việt nữa; Lê Lợi bảo đảm tha cho quân địch được toàn tính mạng về nước. Quân Minh bắt đầu rút ngày 29 tháng 12 năm 1427 và ngày 3 tháng 1 năm 1428 đội binh cuối cùng lên đường; Nguyễn Trãi thảo Bình Ngô đại cáo, áng thiên cổ hùng văn tuyên cáo nền độc lập.\",\n      \"source\": \"Ngày 10-12-1427: Hội thề Đông Quan - Kết thúc thắng lợi cuộc kháng chiến chống quân Minh, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/2002/68094/ngay-10-12-1427-hoi-the-djong-quan-ket-thuc-thang-loi-cuoc-khang-chien-chong-quan-minh.html\"\n    },\n    {\n      \"id\": 29,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": false,\n      \"date\": \"1460–1497\",\n      \"title\": \"Lê Thánh Tông thịnh trị và Bộ luật Hồng Đức\",\n      \"description\": \"Lê Thánh Tông trị vì từ năm 1460 đến năm 1497. Ông cải tổ hành chính, chia cả nước từ 5 đạo thành 13 đạo thừa tuyên, đặt quan văn quan võ trông coi riêng từng lĩnh vực; cho biên soạn Bộ luật Hồng Đức, một trong những thành tựu đáng tự hào nhất của thời đại; hoàn thành tấm bản đồ đầy đủ đầu tiên của Đại Việt và mở mang bờ cõi về phương Nam năm 1471. Ông lập Hội Tao đàn gồm 28 hội viên; trong 38 năm trị vì có hơn 501 tiến sĩ đỗ đạt và ông đặt lệ dựng bia tiến sĩ ở Văn Miếu.\",\n      \"source\": \"Vua Lê Thánh Tông - đấng minh quân văn trị, vũ công toàn năng của Đại Việt (1442-1497), Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/16818/vua-le-thanh-tong-djang-minh-quan-van-tri-vu-cong-toan-nang-cua-djai-viet-1442-1497.html\"\n    },\n    {\n      \"id\": 30,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1527\",\n      \"title\": \"Mạc Đăng Dung lập nhà Mạc, thời Nam Bắc triều\",\n      \"description\": \"Đầu thế kỷ XVI, nhà Lê suy yếu; Mạc Đăng Dung cướp ngôi và lập nên nhà Mạc năm 1527. Nguyễn Kim, một bề tôi trung thành của nhà Lê, tập hợp lực lượng chống nhà Mạc và dựng nên thời Lê Trung hưng (1533-1788), mở đầu cục diện Nam - Bắc triều.\",\n      \"source\": \"Xứ Quảng Nam xưa: Dưới thời chúa Nguyễn, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3101/73276/xu-quang-nam-xua-duoi-thoi-chua-nguyen.html\"\n    },\n    {\n      \"id\": 31,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1600–1672\",\n      \"title\": \"Phân tranh Trịnh – Nguyễn\",\n      \"description\": \"Năm 1579, Nguyễn Hoàng, con của Nguyễn Kim, được giao trấn thủ cả hai xứ Thuận Hóa và Quảng Nam; năm 1602 ông sắp đặt lại đơn vị hành chính hai xứ, đổi trấn Quảng Nam thành dinh Quảng Nam. Từ đó hình thành Đàng Trong dưới quyền các chúa Nguyễn, tách khỏi Đàng Ngoài của vua Lê - chúa Trịnh, dẫn tới cuộc phân tranh Trịnh - Nguyễn kéo dài, lấy sông Gianh làm giới tuyến giữa hai bên.\",\n      \"source\": \"Xứ Quảng Nam xưa: Dưới thời chúa Nguyễn, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3101/73276/xu-quang-nam-xua-duoi-thoi-chua-nguyen.html\"\n    },\n    {\n      \"id\": 32,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1771\",\n      \"title\": \"Khởi nghĩa Tây Sơn\",\n      \"description\": \"Cuộc khởi nghĩa nông dân Tây Sơn bùng nổ mùa xuân năm 1771 và nhanh chóng phát triển mạnh mẽ, tiến tới đánh tan các thế lực phong kiến cát cứ, đưa đất nước vào ổn định.\",\n      \"source\": \"Mùa Xuân năm 1771 - Khởi nghĩa nông dân Tây Sơn bùng nổ, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/2001/68148/mua-xuan-nam-1771-khoi-nghia-nong-dan-tay-son-bung-no.html\"\n    },\n    {\n      \"id\": 33,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1785\",\n      \"title\": \"Đại thắng quân Xiêm ở Rạch Gầm – Xoài Mút\",\n      \"description\": \"Đầu năm 1785, quân Tây Sơn do Nguyễn Huệ chỉ huy đánh trận Rạch Gầm - Xoài Mút, tiêu diệt gần bốn vạn quân xâm lược Xiêm. Khi địch tấn công, một số thuyền quân Tây Sơn ra đánh chặn rồi giả thua, rút dần về phía Rạch Gầm - Xoài Mút nhằm dụ địch vào trận địa mai phục; quân Xiêm tưởng ta yếu, thúc quân đuổi theo và trúng kế.\",\n      \"source\": \"Nghệ thuật quân sự trong chiến tranh giữ nước cuối thế kỷ XVIII, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-ttk/sa-ttdv-kienthucqp/sa-ttk-ktqp-ntqs/sa-ttk-ktqp-ntqs-vn/5c3ff67f-c230-46ea-8f88-52e547cd2780\"\n    },\n    {\n      \"id\": 34,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": true,\n      \"date\": \"1789\",\n      \"title\": \"Quang Trung đại phá 29 vạn quân Thanh ở Ngọc Hồi, Đống Đa\",\n      \"description\": \"Nghệ thuật quân sự của Nguyễn Huệ và quân Tây Sơn được biểu hiện tập trung nhất trong việc tổ chức và thực hành trận quyết chiến chiến lược Ngọc Hồi - Đống Đa. Thắng lợi của cuộc kháng chiến chống quân Thanh xâm lược đầu xuân năm Kỷ Dậu 1789 là một trong những chiến công vĩ đại và hiển hách trong lịch sử chống ngoại xâm của dân tộc Việt Nam.\",\n      \"source\": \"Nghệ thuật quân sự trong chiến tranh giữ nước cuối thế kỷ XVIII, Bộ Quốc phòng\",\n      \"sourceUrl\": \"https://mod.gov.vn/vn/noi-dung/sa-ttk/sa-ttdv-kienthucqp/sa-ttk-ktqp-ntqs/sa-ttk-ktqp-ntqs-vn/5c3ff67f-c230-46ea-8f88-52e547cd2780\"\n    },\n    {\n      \"id\": 35,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1802\",\n      \"title\": \"Nguyễn Ánh lập nhà Nguyễn; quốc hiệu Việt Nam (1804)\",\n      \"description\": \"Năm 1802, Nguyễn Phúc Ánh lên ngôi, lấy niên hiệu Gia Long, định đô ở Phú Xuân, sáng lập vương triều Nguyễn, triều đại phong kiến cuối cùng trong lịch sử Việt Nam. Năm 1804, quốc hiệu Việt Nam được đặt; theo Mộc bản triều Nguyễn, chiếu của vua Gia Long nêu mục đích dựng nền lớn truyền lâu dài về sau và quy định các văn thư bang giao đều dùng quốc hiệu Việt Nam thay cho An Nam. Năm 1815, ông ban hành Hoàng Việt luật lệ, tức Bộ luật Gia Long, gồm 398 điều.\",\n      \"source\": \"Gia Long - vị Hoàng đế đầu tiên sáng lập vương triều Nguyễn, và Quốc hiệu Việt Nam qua góc độ từ Mộc bản triều Nguyễn, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/15241/gia-long-vi-hoang-dje-djau-tien-sang-lap-vuong-trieu-nguyen-trieu-djai-phong-kien-cuoi-cung-trong-lich-su-viet-nam.html\"\n    },\n    {\n      \"id\": 36,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1/9/1858\",\n      \"title\": \"Pháp nổ súng tấn công Đà Nẵng\",\n      \"description\": \"Ngày 1 tháng 9 năm 1858, liên quân Pháp và Tây Ban Nha nổ súng đánh thành Đà Nẵng, chiếm bán đảo Sơn Trà, mở đầu cuộc chiến tranh xâm lược Việt Nam. Trong gần ba mươi năm sau đó, quân Pháp lần lượt đánh chiếm Nam Kỳ, Bắc Kỳ rồi tiến đánh kinh đô Huế.\",\n      \"source\": \"Liên quân Pháp - Tây Ban Nha nổ súng đánh thành Đà Nẵng mở đầu cuộc xâm lược Việt Nam lần thứ nhất 9/1858, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3097/15072/lien-quan-phap-tay-ban-nha-no-sung-djanh-thanh-dja-nang-mo-djau-cuoc-xam-luoc-viet-nam-lan-thu-nhat-9-1858.html\"\n    },\n    {\n      \"id\": 37,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1859–1867\",\n      \"title\": \"Kháng chiến chống Pháp ở Nam Kỳ\",\n      \"description\": \"Khi Pháp đánh Gia Định năm 1859, Trương Định chiêu mộ nghĩa binh; đầu năm 1861 ông lập căn cứ Gò Công với khoảng một nghìn nghĩa quân. Tháng 6 năm 1862, triều đình Huế ký hòa ước với Pháp và ra lệnh bãi binh, Trương Định không tuân lệnh; nhân dân tôn ông là Bình Tây Đại nguyên soái. Từ năm 1861 đến năm 1864, nghĩa quân gây cho quân Pháp nhiều tổn thất; tháng 8 năm 1864, ông tuẫn tiết ở tuổi 44 chứ không chịu đầu hàng.\",\n      \"source\": \"Tháng 9/1861, Trương Định (Trương Công Định) khởi nghĩa chống Pháp ở Gia Định, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"http://baotanglichsu.vn/vi/Articles/3097/15047/thang-9-1861-truong-djinh-truong-cong-djinh-khoi-nghia-chong-phap-o-gia-djinh.html\"\n    },\n    {\n      \"id\": 38,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"6/6/1884\",\n      \"title\": \"Hòa ước Patenôtre (Giáp Thân)\",\n      \"description\": \"Ngày 6 tháng 6 năm 1884, triều đình Nguyễn ký Hòa ước Giáp Thân, còn có tên khác là Hòa ước Patenôtre, với thực dân Pháp. Đây là bản hòa ước cuối cùng triều Nguyễn ký với thực dân Pháp, đánh dấu thời kỳ Việt Nam mất độc lập, tự do và trở thành một nước phụ thuộc vào Pháp.\",\n      \"source\": \"Cách đây 129 năm (6/6/1884-6/6/2013) - Triều đình Nguyễn ký Hòa ước Giáp Thân 1884, còn có tên khác là Hòa ước Patenôtre, với thực dân Pháp, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3097/14428/cach-djay-129-nam-6-6-1884-6-6-2013-trieu-djinh-nguyen-ky-hoa-uoc-giap-than-1884-con-co-ten-khac-la-hoa-uoc-patenotre-voi-thuc-dan-phap.html\"\n    },\n    {\n      \"id\": 39,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"13/7/1885\",\n      \"title\": \"Vua Hàm Nghi ban Chiếu Cần Vương\",\n      \"description\": \"Tháng 7 năm 1885, sau khi cuộc tấn công quân Pháp ở kinh thành Huế thất bại, Tôn Thất Thuyết cùng phái chủ chiến trong triều đình Nguyễn đưa vua Hàm Nghi ra vùng Tân Sở, Quảng Trị và Ấu Sơn, Hương Khê, Hà Tĩnh. Ngày 13 tháng 7 năm 1885, vua Hàm Nghi ban Chiếu Cần Vương tại Tân Sở, kêu gọi nhân dân tiếp tục chiến đấu, tạo nên phong trào chống Pháp rộng khắp cả nước.\",\n      \"source\": \"Tôn Thất Thuyết và phong trào Cần vương, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/12112/ton-that-thuyet-va-phong-trao-can-vuong.html\"\n    },\n    {\n      \"id\": 40,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1885–1896\",\n      \"title\": \"Các cuộc khởi nghĩa Cần Vương\",\n      \"description\": \"Hưởng ứng lời kêu gọi của vua Hàm Nghi, các cuộc khởi nghĩa nổ ra khắp nơi trên lãnh thổ Việt Nam từ Bắc chí Nam chống thực dân Pháp. Khởi nghĩa Hương Khê do Phan Đình Phùng lãnh đạo là cuộc khởi nghĩa tiêu biểu nhất, quy mô trải trên bốn tỉnh Bắc Trung Bộ và kéo dài lâu nhất trong phong trào Cần Vương, từ năm 1885 đến năm 1896.\",\n      \"source\": \"Khởi nghĩa Hương Khê - đỉnh cao của phong trào Cần vương, Báo điện tử Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://dangcongsan.vn/ngay-nay-nam-xua/theo-dong-su-kien/khoi-nghia-huong-khe-dinh-cao-cua-phong-trao-can-vuong-678418.html\"\n    },\n    {\n      \"id\": 41,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1884–1913\",\n      \"title\": \"Khởi nghĩa Yên Thế (Hoàng Hoa Thám)\",\n      \"description\": \"Khởi nghĩa Yên Thế là phong trào nông dân kéo dài gần ba mươi năm từ năm 1884 đến năm 1913. Cuộc khởi nghĩa bắt đầu tháng 3 năm 1884 do Đề Nắm lãnh đạo và nhanh chóng lan rộng khắp tỉnh Bắc Giang; từ năm 1892, Hoàng Hoa Thám, tức Đề Thám, trở thành người lãnh đạo, quy tụ các phong trào chống Pháp trong vùng. Ngày 10 tháng 2 năm 1913, Hoàng Hoa Thám bị sát hại tại rừng Tổ Cú thuộc căn cứ Phồn Xương, Yên Thế, Bắc Giang.\",\n      \"source\": \"Tướng quân Hoàng Hoa Thám, linh hồn của cuộc khởi nghĩa Yên Thế, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3098/15307/tuong-quan-hoang-hoa-tham-linh-hon-cua-cuoc-khoi-nghia-yen-the.html\"\n    },\n    {\n      \"id\": 42,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1904–1908\",\n      \"title\": \"Phan Bội Châu lập Duy Tân hội và phong trào Đông Du\",\n      \"description\": \"Năm 1904, Phan Bội Châu sáng lập Duy Tân hội. Phong trào Đông Du đưa thanh niên sang Nhật Bản du học được xem là thành tựu lớn trong sự nghiệp cách mạng của Phan Bội Châu và Duy Tân hội; đến năm 1907 có khoảng 200 du học sinh ở Nhật Bản, trong đó một nửa đến từ Nam Kỳ.\",\n      \"source\": \"Phong trào Đông Du (1905 - 1908), một hình thức xây dựng lực lượng cách mạng những năm đầu thế kỷ XX, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3097/14624/phong-trao-djong-du-1905-1908-mot-hinh-thuc-xay-dung-luc-luong-cach-mang-nhung-nam-djau-the-ky-xx.html\"\n    },\n    {\n      \"id\": 43,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1906–1908\",\n      \"title\": \"Phan Châu Trinh với phong trào Duy Tân và Đông Kinh Nghĩa Thục\",\n      \"description\": \"Năm 1907, Đông Kinh Nghĩa Thục được thành lập, nằm trong phong trào Duy Tân cải cách giáo dục đầu thế kỷ XX; trường hoạt động từ tháng 3 năm 1907 đến tháng 12 năm 1907 thì bị buộc đóng cửa. Phan Châu Trinh cùng Trần Quý Cáp, Huỳnh Thúc Kháng và Lương Văn Can tiến hành sự nghiệp duy tân, canh tân đất nước. Pháp đàn áp phong trào Duy Tân và Đông Du, đóng cửa Đông Kinh Nghĩa Thục cùng các trường tư ở Quảng Nam, Quảng Ngãi và đày Phan Châu Trinh.\",\n      \"source\": \"Đông Kinh Nghĩa Thục và tư tưởng cải cách giáo dục, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3096/12524/djong-kinh-nghia-thuc-va-tu-tuong-cai-cach-giao-duc.html\"\n    },\n    {\n      \"id\": 44,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": true,\n      \"date\": \"5/6/1911\",\n      \"title\": \"Bác Hồ ra đi tìm đường cứu nước\",\n      \"description\": \"Chiều ngày 5 tháng 6 năm 1911, từ bến cảng Nhà Rồng ở Sài Gòn, người thanh niên yêu nước Nguyễn Tất Thành lấy tên là Văn Ba, làm phụ bếp trên tàu Amiral Latouche Tréville, chính thức lên đường sang Pháp để tìm đường cứu nước. Hành trình đưa Người qua Singapore, Colombo, Djibouti, Port Said và Marseille, mở đầu chặng đường tìm đường cứu nước kéo dài hơn ba mươi năm.\",\n      \"source\": \"Người thanh niên yêu nước Nguyễn Tất Thành rời Việt Nam tìm đường cứu nước, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/c-mac-angghen-lenin-ho-chi-minh/ho-chi-minh/tieu-su-cuoc-doi-va-su-nghiep/nguoi-thanh-nien-yeu-nuoc-nguyen-tat-thanh-roi-viet-nam-tim-duong-cuu-nuoc-3490\"\n    },\n    {\n      \"id\": 45,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"2/1930\",\n      \"title\": \"Khởi nghĩa Yên Bái (Nguyễn Thái Học)\",\n      \"description\": \"Cuộc tổng khởi nghĩa do Việt Nam Quốc dân Đảng phát động dự kiến diễn ra đêm 9 rạng sáng 10 tháng 2 năm 1930, nổ ra ở Yên Bái, Hưng Hóa, Lâm Thao, Sơn Tây và Hà Nội, nhưng đều bị quân Pháp dập tắt nhanh chóng; 603 đảng viên bị đưa ra xét xử, 37 người lĩnh án tử hình. Sáng 17 tháng 6 năm 1930, tại Yên Bái, Nguyễn Thái Học cùng 12 đồng chí bị hành quyết với tinh thần \\\"Không thành công cũng thành nhân\\\". Khởi nghĩa thất bại đã chấm dứt vai trò lãnh đạo cách mạng của giai cấp tư sản dân tộc.\",\n      \"source\": \"17/6/1930 - kết cục bi tráng của các lãnh tụ Việt Nam Quốc dân đảng và giá trị lịch sử cuộc khởi nghĩa Yên Bái, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/2001/68170/17-6-1930-ket-cuc-bi-trang-cua-cac-lanh-tu-viet-nam-quoc-dan-djang-va-gia-tri-lich-su-cuoc-khoi-nghia-yen-bai.html\"\n    },\n    {\n      \"id\": 46,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"3/2/1930\",\n      \"title\": \"Đảng Cộng sản Việt Nam ra đời\",\n      \"description\": \"Từ ngày 3 đến ngày 7 tháng 2 năm 1930, hội nghị hợp nhất ba tổ chức cộng sản họp tại Cửu Long, Hương Cảng, dưới sự chủ trì của đồng chí Nguyễn Ái Quốc. Hội nghị nhất trí thành lập một đảng thống nhất lấy tên là Đảng Cộng sản Việt Nam, thông qua Chánh cương vắn tắt, Sách lược vắn tắt, Chương trình tóm tắt và Điều lệ vắn tắt của Đảng.\",\n      \"source\": \"Ngày thành lập Đảng Cộng sản Việt Nam 3-2-1930, Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/ngay-thanh-lap-dang-cong-san-viet-nam-3-2-1930-3342\"\n    },\n    {\n      \"id\": 47,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1930–1931\",\n      \"title\": \"Cao trào Xô Viết Nghệ Tĩnh\",\n      \"description\": \"Tháng 9 năm 1930 diễn ra phong trào Xô viết Nghệ Tĩnh, đỉnh cao của phong trào cách mạng 1930-1931 do Đảng Cộng sản Việt Nam lãnh đạo. Cuộc đấu tranh của nông dân hai tỉnh Nghệ An và Hà Tĩnh cùng phong trào công nhân trong cả nước mở ra thời kỳ mới của cách mạng Việt Nam dưới sự lãnh đạo của giai cấp công nhân.\",\n      \"source\": \"9/1930 - Diễn ra phong trào Xô viết Nghệ Tĩnh, đỉnh cao của phong trào cách mạng 1930-1931 do Đảng Cộng sản Việt Nam lãnh đạo, Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/3099/15056/9-1930-dien-ra-phong-trao-xo-viet-nghe-tinh-djinh-cao-cua-phong-trao-cach-mang-1930-1931-do-djang-cong-san-viet-nam-lanh-djao.html\"\n    },\n    {\n      \"id\": 48,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1936–1939\",\n      \"title\": \"Phong trào dân chủ\",\n      \"description\": \"Sau thời kỳ khôi phục tổ chức và đấu tranh 1932-1935, phong trào dân chủ diễn ra trong những năm 1936-1939. Đây là phong trào dân chủ trên phạm vi cả nước, huy động rộng rãi các tầng lớp nhân dân, từ công nhân, nông dân đến trí thức, công chức và các nhân sĩ dân chủ.\",\n      \"source\": \"Phong trào giải phóng dân tộc ở các nước thuộc địa và nửa thuộc địa (1918 - 1945), Tư liệu văn kiện, Đảng Cộng sản Việt Nam\",\n      \"sourceUrl\": \"https://tulieuvankien.dangcongsan.vn/ho-so-su-kien-nhan-chung/su-kien-va-nhan-chung/phong-trao-giai-phong-dan-toc-o-cac-nuoc-thuoc-dia-va-nua-thuoc-dia-1918-1945-3363\"\n    },\n    {\n      \"id\": 49,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"11/1940\",\n      \"title\": \"Khởi nghĩa Nam Kỳ\",\n      \"description\": \"Đêm 22 rạng sáng ngày 23 tháng 11 năm 1940, cuộc khởi nghĩa Nam Kỳ bùng nổ đồng loạt ở nhiều địa phương, mạnh mẽ nhất ở Gia Định, Chợ Lớn, Mỹ Tho, Vĩnh Long. Tháng 9 năm 1940, Xứ ủy Nam Kỳ họp mở rộng, bàn kế hoạch khởi nghĩa và thực hiện di huấn của đồng chí Trần Phú là lấy cờ đỏ sao vàng làm lá cờ khởi nghĩa; lá cờ lần đầu tiên tung bay trong các cuộc biểu tình và ở những nơi đã thành lập được chính quyền cách mạng.\",\n      \"source\": \"Kỷ niệm 73 năm khởi nghĩa Nam Kỳ (23/11/1940 - 23/11/2013), Bảo tàng Lịch sử quốc gia\",\n      \"sourceUrl\": \"https://baotanglichsu.vn/vi/Articles/2002/68093/ky-niem-73-nam-khoi-nghia-nam-ky-23-11-1940-23-11-2013.html\"\n    },\n    {\n      \"id\": 50,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"5/1941\",\n      \"title\": \"Bác Hồ về nước; thành lập Mặt trận Việt Minh\",\n      \"description\": \"Ngày 28 tháng 1 năm 1941, Nguyễn Ái Quốc về nước qua cột mốc 108 ở Cao Bằng để trực tiếp lãnh đạo cách mạng giải phóng dân tộc, sau đó chuyển đến ở và làm việc tại hang Cốc Bó. Hội nghị Trung ương lần thứ tám do Người chủ trì họp từ ngày 10 đến ngày 19 tháng 5 năm 1941 tại Pác Bó, Hà Quảng, Cao Bằng, đặt vấn đề giải phóng dân tộc lên hàng đầu và quyết định thành lập Mặt trận Việt Nam Độc lập Đồng minh, gọi tắt là Việt Minh, ngày 19 tháng 5 năm 1941.\",\n      \"source\": \"Hồ Chí Minh với sự ra đời Mặt trận Việt Minh và những chính sách vì dân tộc và nhân dân, Ban Quản lý Lăng Chủ tịch Hồ Chí Minh\",\n      \"sourceUrl\": \"https://bqllang.gov.vn/tin-tuc/tin-tong-hop/5742-ho-chi-minh-voi-su-ra-doi-mat-tran-viet-minh-va-nhung-chinh-sach-vi-dan-toc-va-nhan-dan.html\"\n    },\n    {\n      \"id\": 51,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"22/12/1944\",\n      \"title\": \"Thành lập Đội Việt Nam Tuyên truyền Giải phóng quân\",\n      \"description\": \"Ngày 22 tháng 12 năm 1944, Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập, gồm 34 người với 31 nam và 3 nữ, tổ chức thành 3 tiểu đội, do Hoàng Sâm làm đội trưởng và Xích Thắng làm chính trị viên. Đội viên là những chiến sĩ được lựa chọn từ các đội du kích Cao Bắc Lạn
