me>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n                <div class=\"card-body\">\n                  <h3 class=\"ev-title\">{{ ev.title }}<\u002Fh3>\n                  <div class=\"ev-time\"><b>THỜI GIAN<\u002Fb>{{ ev.date }}<\u002Fdiv>\n                  <div class=\"ev-field\"><b>MÔ TẢ<\u002Fb><span>{{ ev.description }}<\u002Fspan><\u002Fdiv>\n                  <div class=\"ev-field ev-source\"><b>NGUỒN<\u002Fb><span>{{ ev.source }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ ev.brief }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" class=\"brief {{ ev.openCls }}\" sc-camel-on-click=\"{{ ev.toggle }}\" aria-expanded=\"{{ ev.isOpen }}\">\n                <span class=\"brief-top\"><span>{{ ev.code }}<\u002Fspan><span>{{ ev.date }}<\u002Fspan><\u002Fspan>\n                <span class=\"brief-title\">{{ ev.title }}<\u002Fspan>\n                <sc-if value=\"{{ ev.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-if value=\"{{ ev.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n                    <image-slot id=\"{{ ev.slot }}\" shape=\"rect\" fit=\"cover\" src=\"{{ ev.img }}\" style=\"display:block;width:100%;aspect-ratio:3/2;margin-top:12px\" placeholder=\"{{ ev.photo }}\"><\u002Fimage-slot>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ev.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                    <image-slot id=\"{{ ev.slot }}\" shape=\"rect\" fit=\"cover\" style=\"display:block;width:100%;aspect-ratio:3/2;margin-top:12px\" placeholder=\"{{ ev.photo }}\"><\u002Fimage-slot>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ev.hasCaption }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span class=\"img-cap\">{{ ev.caption }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <span class=\"ev-field\"><b>MÔ TẢ<\u002Fb><span>{{ ev.description }}<\u002Fspan><\u002Fspan>\n                  <span class=\"ev-field ev-source\"><b>NGUỒN<\u002Fb><span>{{ ev.source }}<\u002Fspan><\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <sc-if value=\"{{ ev.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-if value=\"{{ ev.hasMedia }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"media\">\n                  <sc-if value=\"{{ ev.hasDoc }}\" hint-placeholder-val=\"{{ true }}\">\n                    <a class=\"media-btn\" href=\"{{ ev.docHref }}\" target=\"_blank\" rel=\"noopener\">\n                      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 2h8l4 4v16H6z\"/><path d=\"M14 2v5h5\"/><path d=\"M9 13h6M9 17h6\"/><\u002Fsvg>\n                      <b>{{ ev.docLabel }}<\u002Fb>\n                    <\u002Fa>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ev.hasVideo }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" class=\"media-btn {{ ev.vidCls }}\" sc-camel-on-click=\"{{ ev.toggleVid }}\" aria-expanded=\"{{ ev.vidOpen }}\">\n                      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M10 8.5l6 3.5-6 3.5z\"/><\u002Fsvg>\n                      <b>Nghe đọc<\u002Fb><i>{{ ev.vidSign }}<\u002Fi>\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ ev.showVid }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"media-video\">\n                    <iframe src=\"{{ ev.embedSrc }}\" title=\"{{ ev.title }}\"\n                      allow=\"accelerometer; encrypted-media; picture-in-picture; web-share; fullscreen\"\n                      referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen><\u002Fiframe>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n            <\u002Fsc-if>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-for>\n\n  <\u002Fsection>\n  <\u002Fsc-for>\n\n  <figure class=\"origin-banner\">\n        <figure class=\"origin-banner-inner\">\n          <sc-if value=\"{{ hasOriginImg }}\" hint-placeholder-val=\"{{ true }}\">\n            <image-slot id=\"ck-origin\" shape=\"rect\" fit=\"cover\" src=\"{{ originImg }}\" style=\"display:block;width:100%;aspect-ratio:4/3\" placeholder=\"Ảnh minh hoạ: Lạc Long Quân – Âu Cơ\"><\u002Fimage-slot>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noOriginImg }}\" hint-placeholder-val=\"{{ false }}\">\n            <image-slot id=\"ck-origin\" shape=\"rect\" fit=\"cover\" style=\"display:block;width:100%;aspect-ratio:4/3\" placeholder=\"Ảnh minh hoạ: Lạc Long Quân – Âu Cơ\"><\u002Fimage-slot>\n          <\u002Fsc-if>\n            <figcaption>\n              <b>Hình minh hoạ: Lạc Long Quân – Âu Cơ<\u002Fb>\n              <span>Theo truyền thuyết, Lạc Long Quân thuộc giống Rồng kết duyên cùng Âu Cơ dòng Tiên, sinh ra bọc trăm trứng nở thành trăm người con. Năm mươi người theo cha xuống biển, năm mươi người theo mẹ lên non; người con trưởng được tôn làm Hùng Vương, lập nên nước Văn Lang. Đây là truyền thuyết về cội nguồn “con Rồng cháu Tiên”, không phải ghi chép sử liệu.<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n  <\u002Ffigure>\n\n  <div class=\"sources\">\n    <h3>TÀI LIỆU THAM KHẢO<\u002Fh3>\n    <ul class=\"reflist\">\n      <li><b>Đại Việt sử ký toàn thư<\u002Fb><span>Bộ chính sử biên niên, bản khắc in Nội các quan bản<\u002Fspan><\u002Fli>\n      <li><b>Khâm định Việt sử thông giám cương mục<\u002Fb><span>Quốc sử quán triều Nguyễn<\u002Fspan><\u002Fli>\n      <li><b>Đại Nam thực lục<\u002Fb><span>Quốc sử quán triều Nguyễn<\u002Fspan><\u002Fli>\n      <li><b>Văn kiện Đại hội đại biểu toàn quốc<\u002Fb><span>Đảng Cộng sản Việt Nam, các khóa I–XIV<\u002Fspan><\u002Fli>\n      <li><b>Cổng Thông tin điện tử Chính phủ<\u002Fb><span>chinhphu.vn<\u002Fspan><\u002Fli>\n      <li><b>Bảo tàng Lịch sử Quốc gia<\u002Fb><span>baotanglichsu.vn<\u002Fspan><\u002Fli>\n      <li><b>Thư viện số Quốc hội<\u002Fb><span>Nghị quyết Quốc hội khóa VI, kỳ họp thứ nhất (02/7/1976)<\u002Fspan><\u002Fli>\n      <li><b>Bộ Ngoại giao Việt Nam<\u002Fb><span>mofa.gov.vn, quan hệ đối ngoại và các mốc hội nhập<\u002Fspan><\u002Fli>\n      <li><b>Ban Thư ký ASEAN<\u002Fb><span>asean.org, Cộng đồng ASEAN và RCEP<\u002Fspan><\u002Fli>\n      <li><b>European Commission<\u002Fb><span>Hiệp định EVFTA<\u002Fspan><\u002Fli>\n      <li><b>Sách giáo khoa Lịch sử<\u002Fb><span>Bộ Giáo dục và Đào tạo<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <p class=\"refnote\">Tác giả cố gắng sử dụng thông tin trong chính sử và các tài liệu tham khảo nêu trên.\n    Nếu phát hiện sai sót, xin liên hệ để được cập nhật.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<a class=\"totop\" href=\"#top\" aria-label=\"Về đầu trang\"><span>↑<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 560, &quot;height&quot;: 900 },\n  &quot;showMeaningAlways&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Chuỗi&quot; },\n  &quot;ctaHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Bán hàng&quot; }\n}\">\nclass Component extends DCLogic {\n  DATA = {\n  \"events\": [\n    {\n      \"id\": 1,\n      \"phase\": \"dung_nuoc\",\n      \"era\": \"Buổi đầu dựng nước\",\n      \"spine\": true,\n      \"date\": \"TK VII TCN\",\n      \"title\": \"Hùng Vương lập nước Văn Lang\",\n      \"description\": \"Theo thư tịch cổ và truyền thuyết, các Vua Hùng lập nước Văn Lang, đóng đô ở Phong Châu, chia nước làm mười lăm bộ. Cư dân Lạc Việt định cư trên châu thổ sông Hồng, lấy nghề trồng lúa nước làm nền tảng, đạt trình độ đúc đồng cao với trống đồng Đông Sơn. Khảo cổ học xác nhận văn hoá Đông Sơn tồn tại trên địa bàn này từ khoảng thế kỷ VII trước Công nguyên.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 2,\n      \"phase\": \"dung_nuoc\",\n      \"era\": \"Buổi đầu dựng nước\",\n      \"spine\": false,\n      \"date\": \"257 TCN\",\n      \"title\": \"An Dương Vương lập nước Âu Lạc, xây thành Cổ Loa\",\n      \"description\": \"Thục Phán hợp nhất hai khối cư dân Âu Việt và Lạc Việt, lập nước Âu Lạc, xưng An Dương Vương và dời trung tâm về vùng Cổ Loa. Thành Cổ Loa được đắp nhiều vòng khép kín, kết hợp hào nước với sông tự nhiên, là công trình quân sự quy mô lớn nhất thời dựng nước.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 3,\n      \"phase\": \"dung_nuoc\",\n      \"era\": \"Buổi đầu dựng nước\",\n      \"spine\": false,\n      \"date\": \"179 TCN\",\n      \"title\": \"Triệu Đà thôn tính Âu Lạc\",\n      \"description\": \"Triệu Đà, người cát cứ vùng Nam Việt, nhiều lần đem quân đánh Âu Lạc nhưng không thắng. Sau đó ông dùng kế giảng hoà và cho con là Trọng Thuỷ sang ở rể để dò xét nội tình. Khi thời cơ đến, quân Nam Việt tiến đánh, Âu Lạc thất thủ, An Dương Vương thua chạy về phương Nam.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 4,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": true,\n      \"date\": \"40–43\",\n      \"title\": \"Khởi nghĩa Hai Bà Trưng\",\n      \"description\": \"Trưng Trắc cùng em là Trưng Nhị phát động khởi nghĩa ở Mê Linh, chống ách cai trị hà khắc của Thái thú Tô Định. Nghĩa quân nhanh chóng làm chủ sáu mươi lăm thành trì, Tô Định phải bỏ chạy về nước. Trưng Trắc lên ngôi vương, đóng đô ở Mê Linh, xá thuế cho dân hai năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 5,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"248\",\n      \"title\": \"Khởi nghĩa Bà Triệu\",\n      \"description\": \"Triệu Thị Trinh cùng anh là Triệu Quốc Đạt dấy binh ở vùng núi Nưa, Cửu Chân, chống ách đô hộ của nhà Ngô. Nghĩa quân đánh phá nhiều thành ấp, khiến chính quyền đô hộ một thời gian không giữ được trật tự trong quận.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 6,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"542–544\",\n      \"title\": \"Lý Bí lập nước Vạn Xuân, xưng Lý Nam Đế\",\n      \"description\": \"Lý Bí, một hào trưởng từng làm quan cho nhà Lương, tập hợp lực lượng nổi dậy và đánh đuổi Thứ sử Tiêu Tư. Sau khi làm chủ đất nước, ông lên ngôi, xưng Lý Nam Đế, đặt quốc hiệu Vạn Xuân với mong muốn nền độc lập bền vững muôn đời. Nhà nước mới dựng kinh đô ở vùng cửa sông Tô Lịch, đặt niên hiệu Thiên Đức và tổ chức bộ máy quan chế riêng.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 7,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"550–571\",\n      \"title\": \"Triệu Quang Phục đánh bại quân Lương\",\n      \"description\": \"Sau khi Lý Nam Đế mất, Triệu Quang Phục rút quân về đầm Dạ Trạch, dựa vào địa hình lầy lội để kháng chiến lâu dài, được dân gian gọi là Dạ Trạch Vương. Nghĩa quân ban ngày ẩn náu, ban đêm dùng thuyền nhỏ đánh úp doanh trại địch. Khi nhà Lương suy yếu vì nội loạn, ông phản công giành lại thành Long Biên và xưng Triệu Việt Vương.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 8,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"713–722\",\n      \"title\": \"Khởi nghĩa Mai Thúc Loan (Mai Hắc Đế)\",\n      \"description\": \"Mai Thúc Loan quê Hoan Châu, xuất thân từ tầng lớp dân phu bị bắt gánh vải nộp cống cho nhà Đường. Ông tập hợp dân các châu vùng Nghệ An, Hà Tĩnh nổi dậy, xưng đế và được gọi là Mai Hắc Đế. Nghĩa quân liên kết được lực lượng nhiều châu, tiến ra chiếm phủ thành Tống Bình và giữ trong một thời gian trước khi nhà Đường đưa đại quân sang đàn áp.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 9,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"~766–791\",\n      \"title\": \"Khởi nghĩa Phùng Hưng (Bố Cái Đại Vương)\",\n      \"description\": \"Phùng Hưng là hào trưởng đất Đường Lâm, nổi tiếng sức khoẻ và uy tín trong vùng. Ông cùng em là Phùng Hải khởi binh, dần làm chủ nhiều châu rồi vây và chiếm phủ thành Tống Bình, tức vùng Hà Nội ngày nay. Sau khi làm chủ, ông cai quản đất nước một thời gian.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 10,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"905\",\n      \"title\": \"Khúc Thừa Dụ giành quyền tự chủ\",\n      \"description\": \"Nhân lúc nhà Đường suy yếu, Khúc Thừa Dụ, một hào trưởng đất Hồng Châu, chiếm giữ phủ thành Tống Bình và tự xưng Tiết độ sứ, buộc nhà Đường phải công nhận. Con ông là Khúc Hạo tiếp nối sự nghiệp, tiến hành cải cách hành chính, định lại hộ khẩu, quân bình thuế ruộng và giảm sưu dịch cho dân. Chính quyền họ Khúc đặt cơ sở cho một bộ máy cai trị do người Việt điều hành.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 11,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": false,\n      \"date\": \"931\",\n      \"title\": \"Dương Đình Nghệ đánh đuổi quân Nam Hán\",\n      \"description\": \"Sau khi nhà Nam Hán bắt Khúc Thừa Mỹ, tướng cũ của họ Khúc là Dương Đình Nghệ từ Ái Châu đem quân ra bắc. Ông đánh tan quân Nam Hán, giết viên tướng giữ thành và làm chủ phủ thành Đại La, rồi tự xưng Tiết độ sứ. Trong thời gian cầm quyền, ông nuôi dưỡng và đào tạo lớp tướng lĩnh người Việt, trong đó có Ngô Quyền, người về sau làm nên chiến thắng Bạch Đằng.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 12,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Bắc thuộc & khởi nghĩa\",\n      \"spine\": true,\n      \"date\": \"938\",\n      \"title\": \"Ngô Quyền đại thắng Bạch Đằng\",\n      \"description\": \"Nghe tin quân Nam Hán do Lưu Hoằng Tháo chỉ huy kéo sang, Ngô Quyền cho đóng cọc gỗ đầu bịt sắt xuống lòng sông Bạch Đằng, lợi dụng thuỷ triều để giấu bãi cọc. Khi triều lên, ông cho thuyền nhỏ ra khiêu chiến nhử địch vượt qua bãi cọc. Triều rút, cọc nhô lên đâm thủng thuyền lớn, quân ta phản công tiêu diệt đạo binh xâm lược, chủ tướng Lưu Hoằng Tháo tử trận.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 13,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"939\",\n      \"title\": \"Ngô Quyền xưng vương, lập nhà Ngô\",\n      \"description\": \"Một năm sau chiến thắng Bạch Đằng, Ngô Quyền bỏ chức Tiết độ sứ vốn là danh hiệu do phương Bắc phong, tự xưng vương và đóng đô ở Cổ Loa, kinh đô cũ của An Dương Vương. Ông đặt lại triều nghi, quan chế, quy định phẩm phục, xây dựng bộ máy cai trị của một quốc gia độc lập.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 14,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"968\",\n      \"title\": \"Đinh Bộ Lĩnh lập nước Đại Cồ Việt, đô Hoa Lư\",\n      \"description\": \"Sau khi nhà Ngô suy yếu, đất nước rơi vào cảnh mười hai sứ quân cát cứ. Đinh Bộ Lĩnh, người động Hoa Lư, lần lượt thu phục các thế lực, thống nhất giang sơn. Ông lên ngôi Hoàng đế, đặt quốc hiệu Đại Cồ Việt, đóng đô ở Hoa Lư, định niên hiệu Thái Bình, cho đúc tiền Thái Bình hưng bảo và tổ chức quân đội theo quy chế thống nhất.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 15,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"981\",\n      \"title\": \"Lê Đại Hành đánh bại quân Tống lần thứ nhất\",\n      \"description\": \"Nhà Đinh gặp biến, Đinh Tiên Hoàng bị sát hại, vua nối ngôi còn nhỏ, nhà Tống nhân cơ hội đem quân sang xâm lược. Trước tình thế cấp bách, Thái hậu Dương Vân Nga trao áo long bào cho Thập đạo tướng quân Lê Hoàn; ông lên ngôi, lập nhà Tiền Lê. Lê Đại Hành trực tiếp chỉ huy chặn đánh trên cả đường thuỷ và đường bộ, phá tan quân Tống ở vùng Chi Lăng và Bạch Đằng.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 16,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": true,\n      \"date\": \"1010\",\n      \"title\": \"Lý Công Uẩn dời đô về Thăng Long (Chiếu dời đô)\",\n      \"description\": \"Cho rằng Hoa Lư đất hẹp, chỉ hợp phòng thủ, Lý Công Uẩn ban Chiếu dời đô, chọn thành Đại La nằm giữa đồng bằng, tiện đường thuỷ bộ và có thể tính kế lâu dài cho con cháu. Chiếu viết rằng trên vâng mệnh trời, dưới theo lòng dân, nếu thấy thuận tiện thì thay đổi.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 17,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1054\",\n      \"title\": \"Lý Thánh Tông đổi quốc hiệu Đại Việt\",\n      \"description\": \"Lý Thánh Tông đổi quốc hiệu từ Đại Cồ Việt thành Đại Việt, tên nước được dùng gần như liên tục trong hơn tám thế kỷ sau đó. Cùng thời gian này, triều Lý đẩy mạnh xây dựng thiết chế nhà nước, dựng Văn Miếu thờ Khổng Tử và mở Quốc Tử Giám, đặt nền cho chế độ khoa cử. Bộ máy hành chính, luật pháp và quân đội dần được kiện toàn theo quy chế thống nhất.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 18,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": true,\n      \"date\": \"1077\",\n      \"title\": \"Chiến thắng Như Nguyệt và bài thơ Nam quốc sơn hà\",\n      \"description\": \"Nắm được ý đồ xâm lược của nhà Tống, Lý Thường Kiệt chủ trương ngồi yên đợi giặc không bằng đem quân đánh trước, đem quân sang phá các căn cứ hậu cần ở Ung Châu, Khâm Châu, Liêm Châu rồi rút về. Ông cho lập phòng tuyến vững chắc trên sông Như Nguyệt, tức sông Cầu ngày nay. Quân Tống bị chặn đứng nhiều tháng, tổn thất nặng, cuối cùng phải chấp nhận giảng hoà và rút quân.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 19,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1226\",\n      \"title\": \"Nhà Trần thành lập\",\n      \"description\": \"Nhà Lý suy yếu, quyền hành dần rơi vào tay họ Trần. Qua cuộc hôn nhân giữa Lý Chiêu Hoàng và Trần Cảnh, ngôi vua chuyển sang họ Trần mà không xảy ra nội chiến lớn. Nhà Trần chấn chỉnh quân đội, khuyến khích khẩn hoang, đắp đê Đỉnh Nhĩ trị thuỷ sông Hồng và đặt chức Hà đê sứ.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 20,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1258\",\n      \"title\": \"Kháng chiến chống Mông Cổ lần I (Đông Bộ Đầu)\",\n      \"description\": \"Sau khi chiếm Đại Lý, quân Mông Cổ theo đường Vân Nam tiến xuống Đại Việt. Trước thế giặc mạnh, nhà Trần chủ trương rút khỏi Thăng Long, thực hiện kế thanh dã, tức vườn không nhà trống, khiến địch không có lương thực. Khi quân Mông Cổ mỏi mệt và thiếu tiếp tế, quân Trần phản công ở Đông Bộ Đầu, bến sông phía đông kinh thành, buộc chúng rút chạy sau khoảng nửa tháng chiếm đóng.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 21,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1284\",\n      \"title\": \"Hội nghị Diên Hồng\",\n      \"description\": \"Trước nguy cơ quân Nguyên xâm lược lần thứ hai, Thượng hoàng Trần Thánh Tông mời các bậc phụ lão trong cả nước về điện Diên Hồng ở kinh thành Thăng Long để hỏi kế đánh hay hoà. Các bô lão đồng thanh xin đánh. Trước đó, Hội nghị Bình Than đã bàn kế sách quân sự với vương hầu, tướng lĩnh.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 22,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1285\",\n      \"title\": \"Kháng chiến chống Nguyên Mông lần II\",\n      \"description\": \"Quân Nguyên chia nhiều đường tiến đánh, Thoát Hoan từ phía bắc, Toa Đô từ Chăm Pa đánh ngược lên, hòng kẹp Đại Việt vào giữa. Nhà Trần lại rút lui bảo toàn lực lượng, chờ thời cơ. Đến mùa hè, quân Trần phản công, lần lượt thắng lớn ở Hàm Tử, Chương Dương, Tây Kết và giải phóng Thăng Long.\",\n      \"source\": \"SGK Lịch sử lớp 7, Bộ Giáo dục và Đào tạo [năm không nêu trong tài liệu gốc].\"\n    },\n    {\n      \"id\": 23,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": true,\n      \"date\": \"1288\",\n      \"title\": \"Đại thắng Nguyên Mông trên sông Bạch Đằng\",\n      \"description\": \"Biết quân Nguyên lệ thuộc vào đường tiếp tế đường biển, Trần Khánh Dư tiêu diệt đoàn thuyền lương của Trương Văn Hổ ở Vân Đồn, đẩy địch vào thế thiếu đói. Trần Hưng Đạo cho tái dựng trận địa cọc trên sông Bạch Đằng theo cách Ngô Quyền từng làm. Toàn bộ thuỷ quân Nguyên bị tiêu diệt, tướng Ô Mã Nhi bị bắt sống, đạo quân bộ của Thoát Hoan phải tháo chạy qua đường Lạng Sơn.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 24,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1400\",\n      \"title\": \"Hồ Quý Ly lập nhà Hồ, cải cách\",\n      \"description\": \"Hồ Quý Ly, một đại thần ngoại thích nắm thực quyền cuối thời Trần, phế vua lập nhà Hồ, đổi quốc hiệu thành Đại Ngu với nghĩa là sự yên vui, dời đô về Tây Đô ở Thanh Hoá. Ông tiến hành nhiều cải cách táo bạo: phát hành tiền giấy Thông bảo hội sao, đặt phép hạn điền và hạn nô, mở rộng khoa cử, đề cao chữ Nôm và chấn chỉnh quân đội.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 25,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Độc lập tự chủ (Ngô–Đinh–Lý–Trần–Hồ)\",\n      \"spine\": false,\n      \"date\": \"1407\",\n      \"title\": \"Nhà Minh xâm lược\",\n      \"description\": \"Lấy cớ phù Trần diệt Hồ, nhà Minh đưa đại quân sang xâm lược. Nhà Hồ tuy có thành Tây Đô kiên cố và súng thần cơ do Hồ Nguyên Trừng chế tạo nhưng không tập hợp được sức dân nên nhanh chóng thất bại. Đại Việt bị sáp nhập thành quận Giao Chỉ.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 26,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": false,\n      \"date\": \"1418\",\n      \"title\": \"Lê Lợi phát động khởi nghĩa Lam Sơn\",\n      \"description\": \"Lê Lợi, một hào trưởng đất Lam Sơn, dựng cờ khởi nghĩa và tự xưng Bình Định Vương. Những năm đầu lực lượng còn mỏng, nghĩa quân nhiều phen phải rút lên núi Chí Linh chịu đói khát; có lần Lê Lai phải đổi áo bào liều mình cứu chúa. Nguyễn Trãi dâng Bình Ngô sách, đề ra đường lối đánh vào lòng người, lấy đại nghĩa thắng hung tàn, lấy chí nhân thay cường bạo.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 27,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": false,\n      \"date\": \"1427\",\n      \"title\": \"Chiến thắng Chi Lăng – Xương Giang\",\n      \"description\": \"Nhà Minh cử hai đạo viện binh lớn sang cứu Vương Thông đang bị vây ở thành Đông Quan. Nghĩa quân Lam Sơn chủ trương diệt viện trước, bố trí phục binh ở ải Chi Lăng và chém chết chủ tướng Liễu Thăng, sau đó truy kích tiêu diệt tiếp ở Xương Giang. Đạo quân của Mộc Thạnh nghe tin hoảng sợ tự tan rã, buộc Vương Thông phải xin giảng hoà và rút quân về nước.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 28,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": true,\n      \"date\": \"1428\",\n      \"title\": \"Bình Ngô đại cáo\",\n      \"description\": \"Sau khi quân Minh rút hết, Nguyễn Trãi thay Lê Lợi soạn bài cáo bố cáo với thiên hạ về nền độc lập. Bài văn mở đầu bằng tư tưởng nhân nghĩa cốt ở yên dân, khẳng định nước Đại Việt ta từ trước vốn xưng nền văn hiến đã lâu, có núi sông bờ cõi đã chia, phong tục Bắc Nam cũng khác, mỗi bên xưng đế một phương, hào kiệt đời nào cũng có.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 29,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Lam Sơn & Lê sơ\",\n      \"spine\": false,\n      \"date\": \"1460–1497\",\n      \"title\": \"Lê Thánh Tông thịnh trị và Bộ luật Hồng Đức\",\n      \"description\": \"Lê Thánh Tông trị vì gần bốn mươi năm, đưa Đại Việt tới thời thịnh trị bậc nhất. Ông chia lại nước thành mười ba đạo thừa tuyên, lập bản đồ Hồng Đức, chấn chỉnh quan chế và đẩy mạnh khoa cử, cho dựng bia tiến sĩ ở Văn Miếu. Bộ Quốc triều hình luật, quen gọi là luật Hồng Đức, gồm hơn bảy trăm điều, trong đó nhiều điều bảo vệ quyền lợi phụ nữ và người yếu thế.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 30,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1527\",\n      \"title\": \"Mạc Đăng Dung lập nhà Mạc, thời Nam Bắc triều\",\n      \"description\": \"Mạc Đăng Dung, một võ quan xuất thân từ nghề chài lưới, dần thâu tóm quyền lực rồi phế vua Lê, lập nhà Mạc, dựng Dương Kinh ở quê hương Cổ Trai. Các cựu thần nhà Lê không phục, tôn lập vua Lê ở Thanh Hoá, tạo thế Nam triều đối đầu Bắc triều kéo dài hơn sáu mươi năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 31,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1600–1672\",\n      \"title\": \"Phân tranh Trịnh – Nguyễn\",\n      \"description\": \"Sau khi nhà Mạc bị đánh bật lên Cao Bằng, quyền hành thực tế ở Đàng Ngoài thuộc về chúa Trịnh, vua Lê chỉ còn giữ danh nghĩa. Ở phía nam, Nguyễn Hoàng và con cháu xây dựng cơ nghiệp riêng tại Thuận Quảng. Hai bên giao tranh bảy lần lớn rồi lấy sông Gianh làm ranh giới.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 32,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1771\",\n      \"title\": \"Khởi nghĩa Tây Sơn\",\n      \"description\": \"Ba anh em Nguyễn Nhạc, Nguyễn Huệ, Nguyễn Lữ dựng cờ khởi nghĩa ở ấp Tây Sơn, nêu khẩu hiệu lấy của nhà giàu chia cho dân nghèo. Phong trào nhanh chóng lan rộng nhờ được nông dân và thương nhân ủng hộ. Nghĩa quân lần lượt lật đổ chính quyền chúa Nguyễn ở Đàng Trong, rồi tiến ra bắc diệt họ Trịnh, xoá bỏ tình trạng cát cứ kéo dài hai trăm năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 33,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1785\",\n      \"title\": \"Đại thắng quân Xiêm ở Rạch Gầm – Xoài Mút\",\n      \"description\": \"Nguyễn Ánh cầu viện vua Xiêm; quân Xiêm kéo sang với danh nghĩa giúp đỡ nhưng cướp phá dân chúng. Nguyễn Huệ chọn khúc sông Tiền giữa hai rạch Rạch Gầm và Xoài Mút, giấu quân hai bên bờ và trên các cù lao, dùng thuyền nhẹ nhử thuyền địch vào trận địa rồi đánh úp. Gần như toàn bộ đạo quân xâm lược bị tiêu diệt chỉ trong một đêm và một buổi sáng.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 34,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": true,\n      \"date\": \"1789\",\n      \"title\": \"Quang Trung đại phá 29 vạn quân Thanh ở Ngọc Hồi, Đống Đa\",\n      \"description\": \"Lê Chiêu Thống cầu viện nhà Thanh; Tôn Sĩ Nghị đem đại quân chiếm Thăng Long. Nguyễn Huệ lên ngôi hoàng đế, lấy hiệu Quang Trung, rồi thần tốc hành quân ra bắc, hẹn với ba quân ăn Tết khai hạ ở kinh thành vào mùng bảy. Các trận Ngọc Hồi và Đống Đa diễn ra chớp nhoáng; Sầm Nghi Đống thắt cổ tự tử, Tôn Sĩ Nghị bỏ cả ấn tín chạy về nước.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 35,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1802\",\n      \"title\": \"Nguyễn Ánh lập nhà Nguyễn; quốc hiệu Việt Nam (1804)\",\n      \"description\": \"Sau khi Quang Trung mất sớm, triều Tây Sơn suy yếu vì mâu thuẫn nội bộ. Nguyễn Ánh phản công từ Gia Định ra bắc, thống nhất lãnh thổ từ ải Nam Quan tới mũi Cà Mau, lên ngôi lấy niên hiệu Gia Long và đóng đô ở Phú Xuân. Năm 1804, nhà Thanh chấp thuận quốc hiệu Việt Nam.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 36,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Trịnh–Nguyễn–Tây Sơn–Nguyễn\",\n      \"spine\": false,\n      \"date\": \"1/9/1858\",\n      \"title\": \"Pháp nổ súng tấn công Đà Nẵng\",\n      \"description\": \"Liên quân Pháp và Tây Ban Nha nổ súng vào cửa biển Đà Nẵng, lấy cớ bảo vệ giáo sĩ. Kế hoạch đánh nhanh thắng nhanh của Pháp bị chặn lại bởi phòng tuyến do Nguyễn Tri Phương tổ chức, cùng bệnh dịch và khí hậu khắc nghiệt. Sau nhiều tháng giằng co không đạt mục tiêu, quân Pháp buộc phải chuyển hướng vào Gia Định, mở đầu quá trình xâm lược kéo dài gần ba mươi năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 37,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1859–1867\",\n      \"title\": \"Kháng chiến chống Pháp ở Nam Kỳ\",\n      \"description\": \"Khi triều đình ký hoà ước nhượng ba tỉnh miền Đông Nam Kỳ năm 1862, nhân dân vẫn tiếp tục kháng chiến. Trương Định kháng lệnh bãi binh của triều đình, được nhân dân tôn làm Bình Tây Đại nguyên soái.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 38,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"6/6/1884\",\n      \"title\": \"Hòa ước Patenôtre (Giáp Thân)\",\n      \"description\": \"Sau khi Pháp đánh chiếm Bắc Kỳ lần thứ hai và uy hiếp kinh đô, triều Nguyễn ký hoà ước với đại diện Pháp là Patenôtre. Theo hoà ước, Việt Nam bị chia thành ba kỳ với ba chế độ khác nhau: Nam Kỳ là thuộc địa, Trung Kỳ và Bắc Kỳ là xứ bảo hộ. Chiếc ấn bạc do nhà Thanh phong bị nấu chảy, chấm dứt quan hệ triều cống với phương Bắc.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 39,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"13/7/1885\",\n      \"title\": \"Vua Hàm Nghi ban Chiếu Cần Vương\",\n      \"description\": \"Sau cuộc phản công thất bại ở kinh thành Huế, Tôn Thất Thuyết đưa vua Hàm Nghi ra vùng núi Quảng Trị và nhân danh nhà vua ban chiếu kêu gọi văn thân, sĩ phu và nhân dân cả nước đứng lên giúp vua cứu nước. Nhà vua khi đó mới mười ba tuổi. Ba năm sau ông bị bắt và bị đày sang Algérie, nhưng phong trào do chiếu phát động vẫn tiếp tục nhiều năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 40,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1885–1896\",\n      \"title\": \"Các cuộc khởi nghĩa Cần Vương\",\n      \"description\": \"Hưởng ứng chiếu Cần Vương, hàng loạt cuộc khởi nghĩa nổ ra khắp Trung Kỳ và Bắc Kỳ. Phạm Bành và Đinh Công Tráng giữ căn cứ Ba Đình ở Thanh Hoá; Nguyễn Thiện Thuật lập căn cứ Bãi Sậy giữa vùng đầm lầy Hưng Yên; Phan Đình Phùng cùng Cao Thắng duy trì khởi nghĩa Hương Khê hơn mười năm và tự chế được súng trường theo mẫu của Pháp.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 41,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1884–1913\",\n      \"title\": \"Khởi nghĩa Yên Thế (Hoàng Hoa Thám)\",\n      \"description\": \"Hoàng Hoa Thám, quen gọi là Đề Thám, lãnh đạo nông dân vùng Yên Thế chống Pháp gần ba mươi năm, lâu nhất trong các phong trào vũ trang cùng thời. Nghĩa quân dựa vào địa hình rừng núi trung du, đánh du kích và nhiều lần buộc Pháp phải giảng hoà.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 42,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1904–1908\",\n      \"title\": \"Phan Bội Châu lập Duy Tân hội và phong trào Đông Du\",\n      \"description\": \"Phan Bội Châu lập Duy Tân hội, chủ trương dùng bạo động giành độc lập và tranh thủ sự giúp đỡ từ bên ngoài. Ông tổ chức đưa thanh niên sang Nhật Bản du học để đào tạo lớp người có tri thức và kỹ thuật quân sự, gọi là phong trào Đông Du.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 43,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"1906–1908\",\n      \"title\": \"Phan Châu Trinh với phong trào Duy Tân và Đông Kinh Nghĩa Thục\",\n      \"description\": \"Khác với Phan Bội Châu, Phan Châu Trinh phản đối bạo động và cầu ngoại viện, chủ trương khai dân trí, chấn dân khí, hậu dân sinh, tức nâng cao hiểu biết, ý chí và đời sống của dân trước hết. Trường Đông Kinh Nghĩa Thục ở Hà Nội dạy chữ Quốc ngữ, khoa học thường thức và lịch sử nước nhà cho mọi người, không thu học phí, hoạt động chưa đầy một năm thì bị chính quyền thực dân đóng cửa.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 44,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": true,\n      \"date\": \"5/6/1911\",\n      \"title\": \"Bác Hồ ra đi tìm đường cứu nước\",\n      \"description\": \"Nguyễn Tất Thành, khi ấy hai mươi mốt tuổi, xuống tàu buôn Amiral Latouche Tréville tại bến cảng Nhà Rồng với tên gọi Văn Ba, nhận việc phụ bếp để có phương tiện đi. Khác các bậc tiền bối hướng sang Nhật Bản hoặc Trung Quốc, Người chọn sang phương Tây để tìm hiểu tận gốc điều ẩn sau khẩu hiệu tự do, bình đẳng, bác ái, rồi trở về giúp đồng bào.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 45,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Pháp thuộc & phong trào yêu nước\",\n      \"spine\": false,\n      \"date\": \"2/1930\",\n      \"title\": \"Khởi nghĩa Yên Bái (Nguyễn Thái Học)\",\n      \"description\": \"Việt Nam Quốc dân Đảng do Nguyễn Thái Học lãnh đạo phát động khởi nghĩa khi tổ chức đã bị lộ, với tinh thần không thành công cũng thành nhân. Cuộc nổi dậy ở Yên Bái và một số tỉnh bị dập tắt nhanh chóng. Mười ba lãnh tụ bị đưa lên máy chém tại Yên Bái, trong đó có Nguyễn Thái Học, người khi ấy mới hai mươi sáu tuổi.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 46,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"3/2/1930\",\n      \"title\": \"Đảng Cộng sản Việt Nam ra đời\",\n      \"description\": \"Nguyễn Ái Quốc chủ trì hội nghị tại Cửu Long, Hương Cảng, hợp nhất ba tổ chức cộng sản đang hoạt động riêng rẽ thành một chính đảng duy nhất, lấy tên Đảng Cộng sản Việt Nam. Hội nghị thông qua Chánh cương vắn tắt, Sách lược vắn tắt và Điều lệ vắn tắt do Người soạn thảo. Ngày 3 tháng 2 về sau được lấy làm ngày kỷ niệm thành lập Đảng theo quyết định của Đại hội III.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 47,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1930–1931\",\n      \"title\": \"Cao trào Xô Viết Nghệ Tĩnh\",\n      \"description\": \"Trong bối cảnh khủng hoảng kinh tế thế giới và sưu thuế nặng nề, công nhân Vinh Bến Thuỷ cùng nông dân hai tỉnh Nghệ An, Hà Tĩnh liên tiếp biểu tình, bãi công. Chính quyền thực dân và phong kiến ở nhiều làng xã tan rã; các ban chấp hành nông hội đứng ra quản lý, chia lại ruộng công, bãi bỏ thuế thân và tổ chức đời sống theo hình thức chính quyền Xô viết.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 48,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1936–1939\",\n      \"title\": \"Phong trào dân chủ\",\n      \"description\": \"Khi Mặt trận Bình dân lên cầm quyền ở Pháp, một số quyền tự do dân chủ được nới lỏng. Phong trào chuyển sang đấu tranh công khai và hợp pháp: lập các Uỷ ban hành động, vận động Đông Dương Đại hội, ra báo chí bằng tiếng Việt và tiếng Pháp, tham gia tranh cử vào các viện dân biểu.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 49,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"11/1940\",\n      \"title\": \"Khởi nghĩa Nam Kỳ\",\n      \"description\": \"Nhân lúc Pháp thua Nhật ở Lạng Sơn và bắt lính người Việt sang đánh Xiêm, nhân dân Nam Kỳ nổi dậy ở nhiều tỉnh. Do kế hoạch bị lộ, cuộc khởi nghĩa bị đàn áp đẫm máu, nhiều cán bộ lãnh đạo bị bắt và hy sinh, trong đó có Nguyễn Thị Minh Khai và Hà Huy Tập. Chính trong dịp này, lá cờ đỏ với ngôi sao vàng năm cánh lần đầu xuất hiện.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 50,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"5/1941\",\n      \"title\": \"Bác Hồ về nước; thành lập Mặt trận Việt Minh\",\n      \"description\": \"Sau ba mươi năm bôn ba, Nguyễn Ái Quốc trở về nước qua cột mốc 108 trên biên giới Cao Bằng và sống, làm việc tại hang Pác Bó. Người chủ trì Hội nghị Trung ương lần thứ tám, quyết định đặt nhiệm vụ giải phóng dân tộc lên trên hết và thành lập Việt Nam Độc lập Đồng minh, gọi tắt là Việt Minh, nhằm tập hợp mọi giai tầng yêu nước vào một mặt trận thống nhất.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 51,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"22/12/1944\",\n      \"title\": \"Thành lập Đội Việt Nam Tuyên truyền Giải phóng quân\",\n      \"description\": \"Theo chỉ thị của lãnh tụ Hồ Chí Minh, Võ Nguyên Giáp thành lập đội vũ trang tập trung đầu tiên tại khu rừng Trần Hưng Đạo, Cao Bằng, gồm ba mươi tư chiến sĩ với vũ khí thô sơ. Chỉ thị nêu rõ chính trị trọng hơn quân sự, tuyên truyền trọng hơn tác chiến. Chỉ vài ngày sau, đội đã đánh thắng hai trận Phai Khắt và Nà Ngần, mở đầu truyền thống đánh thắng trận đầu.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 52,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"9/3/1945\",\n      \"title\": \"Nhật đảo chính Pháp; cao trào kháng Nhật\",\n      \"description\": \"Nhật đảo chính lật đổ chính quyền thực dân Pháp trên toàn Đông Dương chỉ trong một đêm. Ban Thường vụ Trung ương Đảng ra chỉ thị Nhật, Pháp bắn nhau và hành động của chúng ta, xác định kẻ thù chính là phát xít Nhật và phát động cao trào kháng Nhật cứu nước. Phong trào phá kho thóc cứu đói lan rộng giữa lúc nạn đói khủng khiếp cướp đi sinh mạng của hàng triệu đồng bào.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 53,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"8/1945\",\n      \"title\": \"Cách mạng Tháng Tám thành công\",\n      \"description\": \"Sau khi Nhật Bản đầu hàng Đồng minh, thời cơ chín muồi, Uỷ ban khởi nghĩa toàn quốc phát lệnh Tổng khởi nghĩa. Hà Nội giành chính quyền ngày 19 tháng 8, Huế ngày 23 và Sài Gòn ngày 25. Vua Bảo Đại thoái vị, trao ấn kiếm cho đại diện Chính phủ lâm thời, chấm dứt chế độ quân chủ tồn tại hàng nghìn năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 54,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"2/9/1945\",\n      \"title\": \"Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa\",\n      \"description\": \"Tại Quảng trường Ba Đình, trước hàng chục vạn đồng bào, Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập. Bản Tuyên ngôn mở đầu bằng lời trích Tuyên ngôn Độc lập của Hoa Kỳ và Tuyên ngôn Nhân quyền và Dân quyền của Pháp, rồi khẳng định nước Việt Nam có quyền hưởng tự do và độc lập, và sự thật đã thành một nước tự do, độc lập.\",\n      \"source\": \"Tuyen Ngon Doc Lap.pdf [cơ quan ban hành và năm không nêu trong tài liệu gốc].\"\n    },\n    {\n      \"id\": 55,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"6/1/1946\",\n      \"title\": \"Tổng tuyển cử bầu Quốc hội khóa I\",\n      \"description\": \"Chỉ hơn bốn tháng sau ngày độc lập, giữa lúc giặc đói, giặc dốt và giặc ngoại xâm cùng đe doạ, cuộc tổng tuyển cử đầu tiên được tổ chức trên cả nước theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín. Hơn tám mươi chín phần trăm cử tri đi bầu, chọn ra Quốc hội khoá I gồm đại biểu thuộc nhiều thành phần xã hội, tôn giáo và đảng phái.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 56,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"19/12/1946\",\n      \"title\": \"Toàn quốc kháng chiến bùng nổ\",\n      \"description\": \"Sau khi mọi nỗ lực đàm phán và nhân nhượng không giữ được hoà bình, Chủ tịch Hồ Chí Minh ra Lời kêu gọi toàn quốc kháng chiến, khẳng định thà hy sinh tất cả chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ. Tại Hà Nội, Trung đoàn Thủ đô chiến đấu giam chân địch sáu mươi ngày đêm để các cơ quan đầu não rút an toàn lên chiến khu Việt Bắc.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 57,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1950\",\n      \"title\": \"Chiến dịch Biên Giới\",\n      \"description\": \"Đây là chiến dịch tiến công lớn đầu tiên do ta chủ động mở, nhằm khai thông biên giới phía bắc để nối liền với hậu phương quốc tế và mở rộng căn cứ địa Việt Bắc. Ta chọn đánh cụm cứ điểm Đông Khê trước để cô lập Cao Bằng, buộc địch phải ứng cứu rồi tiêu diệt trên đường hành quân. Chủ tịch Hồ Chí Minh trực tiếp ra mặt trận theo dõi chiến dịch.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 58,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"7/5/1954\",\n      \"title\": \"Chiến thắng Điện Biên Phủ\",\n      \"description\": \"Pháp xây Điện Biên Phủ thành tập đoàn cứ điểm mạnh nhất Đông Dương, tin rằng đối phương không thể đưa pháo lên. Đại tướng Võ Nguyên Giáp thay đổi phương châm từ đánh nhanh thắng nhanh sang đánh chắc tiến chắc, cho kéo pháo vào rồi kéo ra, đào hàng trăm cây số hào siết dần vòng vây. Sau năm mươi sáu ngày đêm, toàn bộ tập đoàn cứ điểm bị tiêu diệt, tướng De Castries bị bắt sống.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 59,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"21/7/1954\",\n      \"title\": \"Hiệp định Genève\",\n      \"description\": \"Hội nghị Genève bàn về chấm dứt chiến tranh, lập lại hoà bình ở Đông Dương, kết thúc một ngày sau chiến thắng Điện Biên Phủ. Các bên tham gia công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam. Vĩ tuyến 17 được lấy làm giới tuyến quân sự tạm thời, không phải ranh giới chính trị hay lãnh thổ; hai miền dự kiến hiệp thương tổng tuyển cử thống nhất sau hai năm.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 60,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1959–1960\",\n      \"title\": \"Phong trào Đồng Khởi\",\n      \"description\": \"Trước chính sách tố cộng, diệt cộng và Luật 10-59 đặt những người yêu nước ra ngoài vòng pháp luật, Hội nghị Trung ương lần thứ mười lăm xác định con đường dùng bạo lực cách mạng. Phong trào bùng nổ mạnh nhất ở Bến Tre với ba mũi giáp công gồm chính trị, quân sự và binh vận, rồi lan nhanh khắp miền Nam. Cuối năm 1960, Mặt trận Dân tộc Giải phóng miền Nam Việt Nam ra đời.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 61,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"1968\",\n      \"title\": \"Tổng tiến công và nổi dậy Tết Mậu Thân\",\n      \"description\": \"Đêm giao thừa Tết Mậu Thân, quân giải phóng đồng loạt tiến công vào hầu hết các đô thị miền Nam, trong đó có Toà đại sứ Hoa Kỳ ở Sài Gòn, và làm chủ thành phố Huế trong hai mươi lăm ngày.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 62,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"12/1972\",\n      \"title\": \"Chiến thắng Điện Biên Phủ trên không\",\n      \"description\": \"Nhằm ép ta nhượng bộ tại Hội nghị Paris, Hoa Kỳ mở chiến dịch Linebacker II, dùng máy bay chiến lược B-52 ném bom rải thảm Hà Nội, Hải Phòng và nhiều địa phương suốt mười hai ngày đêm cuối tháng Chạp. Bộ đội tên lửa, không quân, pháo cao xạ cùng lực lượng phòng không nhân dân đã bắn rơi ba mươi tư máy bay B-52, đập tan cuộc tập kích đường không chiến lược.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 63,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": false,\n      \"date\": \"27/1/1973\",\n      \"title\": \"Hiệp định Paris\",\n      \"description\": \"Hiệp định về chấm dứt chiến tranh, lập lại hoà bình ở Việt Nam được ký kết sau gần năm năm đàm phán, cuộc thương lượng dài nhất trong lịch sử ngoại giao thế kỷ XX. Hoa Kỳ cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam, rút hết quân trong vòng sáu mươi ngày và không tiếp tục dính líu quân sự vào công việc nội bộ của miền Nam.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 64,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Cách mạng & kháng chiến (1930–1975)\",\n      \"spine\": true,\n      \"date\": \"30/4/1975\",\n      \"title\": \"Giải phóng miền Nam, thống nhất đất nước\",\n      \"description\": \"Sau chiến thắng Tây Nguyên và Huế, Đà Nẵng, Bộ Chính trị quyết định mở chiến dịch giải phóng Sài Gòn mang tên Chiến dịch Hồ Chí Minh, với phương châm thần tốc, táo bạo, bất ngờ, chắc thắng. Năm cánh quân đồng loạt tiến vào thành phố; xe tăng quân giải phóng húc đổ cổng Dinh Độc Lập lúc gần trưa ngày 30 tháng 4, Tổng thống chính quyền Sài Gòn tuyên bố đầu hàng không điều kiện.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 65,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Thống nhất & bảo vệ biên cương\",\n      \"spine\": true,\n      \"date\": \"2/7/1976\",\n      \"title\": \"Đổi tên nước thành Cộng hòa Xã hội chủ nghĩa Việt Nam\",\n      \"description\": \"Kỳ họp thứ nhất Quốc hội khoá VI, Quốc hội chung của cả nước sau tổng tuyển cử thống nhất, đã quyết định những yếu tố căn bản của quốc gia. Tên nước là Cộng hòa Xã hội chủ nghĩa Việt Nam, thủ đô là Hà Nội, Quốc kỳ là cờ đỏ sao vàng, Quốc ca là bài Tiến quân ca, cùng Quốc huy. Thành phố Sài Gòn, Gia Định được đổi tên thành Thành phố Hồ Chí Minh.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 66,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Thống nhất & bảo vệ biên cương\",\n      \"spine\": true,\n      \"date\": \"12/1978\",\n      \"title\": \"Chiến tranh bảo vệ biên giới Tây Nam\",\n      \"description\": \"Từ sau năm 1975, tập đoàn Khmer Đỏ liên tiếp đánh phá các đảo và tuyến biên giới Tây Nam, gây nhiều vụ thảm sát dân thường, nặng nề nhất là ở Ba Chúc, An Giang. Cuối tháng 12 năm 1978, quân và dân ta mở cuộc phản công tự vệ, đẩy lùi lực lượng xâm lấn ra khỏi lãnh thổ. Sau đó, theo yêu cầu của lực lượng cách mạng Campuchia, quân tình nguyện Việt Nam giúp nước bạn thoát khỏi hoạ diệt chủng.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 67,\n      \"phase\": \"giu_nuoc\",\n      \"era\": \"Thống nhất & bảo vệ biên cương\",\n      \"spine\": true,\n      \"date\": \"2/1979\",\n      \"title\": \"Chiến tranh bảo vệ biên giới phía Bắc\",\n      \"description\": \"Rạng sáng ngày 17 tháng 2 năm 1979, quân Trung Quốc mở cuộc tiến công quy mô lớn trên toàn tuyến biên giới phía Bắc, đánh vào sáu tỉnh từ Quảng Ninh đến Lai Châu. Quân dân biên giới cùng lực lượng vũ trang tại chỗ đã chặn đánh quyết liệt ở Lạng Sơn, Cao Bằng, Lào Cai. Xung đột còn kéo dài nhiều năm sau đó tại một số điểm cao, trong đó có mặt trận Vị Xuyên, Hà Giang.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 68,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": true,\n      \"date\": \"12/1986\",\n      \"title\": \"Đại hội VI khởi xướng công cuộc Đổi mới\",\n      \"description\": \"Trước tình trạng lạm phát phi mã, thiếu lương thực và mô hình kế hoạch hoá tập trung quan liêu, bao cấp bộc lộ bế tắc, Đại hội đại biểu toàn quốc lần thứ VI của Đảng chủ trương nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật. Đại hội xác định đổi mới tư duy, trước hết là tư duy kinh tế, thừa nhận nền kinh tế nhiều thành phần và từng bước xoá bỏ cơ chế bao cấp.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 69,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"14/3/1988\",\n      \"title\": \"Sự kiện Gạc Ma, bảo vệ chủ quyền biển đảo\",\n      \"description\": \"Trong khi cán bộ, chiến sĩ Hải quân nhân dân Việt Nam đang làm nhiệm vụ xây dựng và bảo vệ các bãi đá Gạc Ma, Cô Lin, Len Đao thuộc quần đảo Trường Sa, tàu chiến nước ngoài đã dùng hoả lực bắn vào lực lượng ta. Ta giữ được Cô Lin và Len Đao.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 70,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"1992\",\n      \"title\": \"Ban hành Hiến pháp 1992\",\n      \"description\": \"Hiến pháp năm 1992 thay thế Hiến pháp năm 1980, thể chế hoá đường lối Đổi mới do Đại hội VI khởi xướng. Văn bản thừa nhận nền kinh tế hàng hoá nhiều thành phần vận hành theo cơ chế thị trường có sự quản lý của Nhà nước, theo định hướng xã hội chủ nghĩa; bảo hộ quyền sở hữu hợp pháp và quyền thừa kế; đồng thời tạo cơ sở pháp lý cho việc thu hút đầu tư nước ngoài.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 71,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"28/7/1995\",\n      \"title\": \"Gia nhập ASEAN (thành viên thứ 7)\",\n      \"description\": \"Việt Nam chính thức trở thành thành viên thứ bảy của Hiệp hội các quốc gia Đông Nam Á tại Bandar Seri Begawan, Brunei. Từ chỗ đứng ở hai phía đối lập trong thời kỳ chiến tranh lạnh, Việt Nam cùng các nước láng giềng xây dựng quan hệ hợp tác khu vực.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 72,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"13/7/2000\",\n      \"title\": \"Ký Hiệp định Thương mại song phương Việt Nam – Hoa Kỳ (BTA)\",\n      \"description\": \"Hiệp định được ký tại Washington ngày 13 tháng 7 năm 2000 và có hiệu lực từ tháng 12 năm 2001. Hoa Kỳ dành cho Việt Nam quy chế quan hệ thương mại bình thường, đưa thuế nhập khẩu đánh vào hàng hoá Việt Nam từ mức khoảng bốn mươi phần trăm xuống còn vài phần trăm. Để thực thi cam kết, Việt Nam sửa đổi hàng loạt quy định về thương mại, đầu tư và sở hữu trí tuệ.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 73,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": true,\n      \"date\": \"11/1/2007\",\n      \"title\": \"Gia nhập Tổ chức Thương mại Thế giới (WTO)\",\n      \"description\": \"Sau mười một năm đàm phán, Việt Nam trở thành thành viên thứ một trăm năm mươi của Tổ chức Thương mại Thế giới. Việc gia nhập đòi hỏi sửa đổi, bổ sung hàng loạt luật lệ cho phù hợp chuẩn mực quốc tế và mở cửa thị trường hàng hoá, dịch vụ theo lộ trình cam kết.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 74,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2008–2009\",\n      \"title\": \"Lần đầu là Ủy viên không thường trực HĐBA LHQ\",\n      \"description\": \"Việt Nam lần đầu được bầu làm Uỷ viên không thường trực Hội đồng Bảo an Liên hợp quốc, cơ quan có thẩm quyền cao nhất về duy trì hoà bình và an ninh quốc tế. Trong nhiệm kỳ, Việt Nam hai lần đảm nhiệm vai trò Chủ tịch luân phiên, tham gia xử lý nhiều hồ sơ quốc tế phức tạp và thúc đẩy đối thoại, giải quyết tranh chấp bằng biện pháp hoà bình.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 75,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2015\",\n      \"title\": \"Cộng đồng ASEAN hình thành; ký các FTA thế hệ mới\",\n      \"description\": \"Cộng đồng ASEAN chính thức hình thành trên ba trụ cột chính trị an ninh, kinh tế và văn hoá xã hội, hướng tới một thị trường và cơ sở sản xuất thống nhất trong khu vực. Cùng giai đoạn này, Việt Nam kết thúc đàm phán hoặc ký nhiều hiệp định thương mại tự do thế hệ mới, với cam kết sâu hơn về lao động, môi trường, mua sắm công và sở hữu trí tuệ.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 76,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2019\",\n      \"title\": \"Trúng cử Ủy viên không thường trực HĐBA LHQ 2020–2021\",\n      \"description\": \"Việt Nam được bầu làm Uỷ viên không thường trực Hội đồng Bảo an Liên hợp quốc nhiệm kỳ 2020 và 2021 với một trăm chín mươi hai trên một trăm chín mươi ba phiếu ủng hộ, mức cao gần như tuyệt đối và là kỷ lục trong lịch sử bầu cử vào cơ quan này.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 77,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"2020\",\n      \"title\": \"Chủ tịch ASEAN; ký EVFTA, RCEP\",\n      \"description\": \"Việt Nam đảm nhiệm vai trò Chủ tịch ASEAN đúng năm đại dịch bùng phát, đã chuyển toàn bộ hội nghị sang hình thức trực tuyến và giữ được nhịp hợp tác khu vực. Trong năm này, Hiệp định Thương mại tự do Việt Nam và Liên minh châu Âu chính thức có hiệu lực, còn Hiệp định Đối tác Kinh tế Toàn diện Khu vực được ký kết tại Hà Nội, tạo khu vực thương mại tự do lớn nhất thế giới.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 78,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Đổi mới & hội nhập\",\n      \"spine\": false,\n      \"date\": \"9/2023\",\n      \"title\": \"Nâng cấp Đối tác chiến lược toàn diện với Hoa Kỳ\",\n      \"description\": \"Trong chuyến thăm cấp Nhà nước của Tổng thống Hoa Kỳ tới Hà Nội, hai nước nâng quan hệ vượt hai bậc, từ Đối tác toàn diện lên Đối tác Chiến lược Toàn diện, mức cao nhất trong thang bậc quan hệ đối ngoại của Việt Nam. Hợp tác được mở rộng sang các lĩnh vực khoa học công nghệ, công nghiệp bán dẫn, đào tạo nhân lực chất lượng cao và ứng phó với biến đổi khí hậu.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 79,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Kỷ nguyên vươn mình\",\n      \"spine\": false,\n      \"date\": \"30/4/2025\",\n      \"title\": \"Kỷ niệm 50 năm thống nhất đất nước\",\n      \"description\": \"Nửa thế kỷ sau ngày thống nhất, đất nước tổ chức trọng thể lễ kỷ niệm với chương trình diễu binh, diễu hành tại Thành phố Hồ Chí Minh.\",\n      \"source\": \"Diễn văn của Tổng Bí thư [cơ quan ban hành và năm không nêu trong tài liệu gốc].\"\n    },\n    {\n      \"id\": 80,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Kỷ nguyên vươn mình\",\n      \"spine\": false,\n      \"date\": \"1/7/2025\",\n      \"title\": \"Sắp xếp lại đơn vị hành chính cấp tỉnh\",\n      \"description\": \"Kỳ họp thứ chín Quốc hội khoá XV thông qua nghị quyết sắp xếp lại đơn vị hành chính cấp tỉnh, hợp nhất nhiều tỉnh, thành phố để cả nước còn ba mươi tư đơn vị, gồm hai mươi tám tỉnh và sáu thành phố trực thuộc trung ương.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    },\n    {\n      \"id\": 81,\n      \"phase\": \"phat_trien\",\n      \"era\": \"Kỷ nguyên vươn mình\",\n      \"spine\": true,\n      \"date\": \"2/9/2026\",\n      \"title\": \"Kỷ niệm 81 năm Quốc khánh\",\n      \"description\": \"Ngày 2 tháng 9 năm 2026 là kỷ niệm 81 năm Quốc khánh.\",\n      \"source\": \"[Chưa có nguồn trích dẫn trong tài liệu gốc]\"\n    }\n  ]\n};\n\n  // ---- historical palette (single source of truth) ----\n  HISTORICAL_COLORS = {\n    bronze:           [139,  98,  62],  // #8B623E  Đồng Đông Sơn\n    jade:             [113, 138, 118],  // #718A76  Xanh ngọc cổ\n    indigo:           [ 41,  75,  99],  // #294B63  Lam chàm\n    vermilionDark:    [120,  53,  48],  // #783530  Đỏ son trầm\n    revolutionaryRed: [200,  16,  46],  // #C8102E  Đỏ cách mạng\n    flagRed:          [218,  37,  29],  // #DA251D  Đỏ Quốc kỳ\n    flagGold:         [212, 163,  23],  // vàng Quốc kỳ hạ độ chói cho nền sáng\n    antiqueGold:      [196, 154,  82]   // #C49A52\n  };\n\n  // Anchors are interpolated by year — never switched on a threshold.\n  ANCHORS = [\n    [-700, 'bronze'], [-179, 'bronze'],\n    [ 938, 'jade'],\n    [1400, 'indigo'], [1600, 'indigo'],\n    [1858, 'vermilionDark'],\n    [1930, 'revolutionaryRed'],\n    [1945, 'flagRed'], [2060, 'flagRed']\n  ];\n\n  // 9 mốc \"ĐỘC LẬP – TỰ DO – CHỦ QUYỀN – THỐNG NHẤT\" (khớp theo năm/sự kiện).\n  CORE = {\n    4:  { m: 'Biểu tượng sớm của ý chí giành lại độc lập, chống ách đô hộ.' },\n    12: { m: 'Khôi phục nền độc lập, mở đầu thời kỳ tự chủ lâu dài của dân tộc.', pin: 'GIÀNH LẠI ĐỘC LẬP' },\n    18: { m: 'Khẳng định chủ quyền quốc gia và lãnh thổ.' },\n    23: { m: 'Bảo vệ nền độc lập và quyền tự quyết của Đại Việt.' },\n    28: { m: 'Tuyên cáo nền độc lập, khẳng định Đại Việt là một quốc gia có chủ quyền.', pin: 'TUYÊN CÁO NỀN ĐỘC LẬP' },\n    46: { m: 'Bước ngoặt về đường lối cứu nước, mở đường giành lại độc lập dân tộc và thống nhất đất nước.' },\n    54: { m: 'Chính thức tuyên bố nền độc lập của Việt Nam và quyền tự do của dân tộc.', pin: 'TUYÊN BỐ ĐỘC LẬP HIỆN ĐẠI' },\n    58: { m: 'Thắng lợi quyết định trong cuộc đấu tranh chống chủ nghĩa thực dân, bảo vệ quyền độc lập dân tộc.' },\n    64: { m: 'Hoàn thành quá trình đấu tranh giành độc lập và mở đường thống nhất quốc gia.', pin: 'HOÀN THÀNH THỐNG NHẤT ĐẤT NƯỚC' }\n  };\n\n  // 2026 — đi 1055 năm Nhà nước Đại Cồ Việt và khai mạc Lễ hội Hoa Lư.',\n    15: 'Di tích lăng vua Lê Đại Hành tại thôn Yên Thượng, xã Trường Yên, huyện Hoa Lư, tỉnh Ninh Bình.',\n    16: 'Chiếu dời đô: “Trên vâng mệnh trời, dưới theo lòng dân”.',\n    19: 'Đền thờ các vị vua thời Trần tại Đông Triều, Quảng Ninh.',\n    20: 'Lược đồ kháng chiến chống Mông Cổ lần thứ nhất, trận Đông Bộ Đầu.',\n    21: 'Phù điêu Hội nghị Diên Hồng.',\n    22: 'Diễn biến và kết quả cuộc kháng chiến chống quân Nguyên lần thứ hai. Nguồn: SGK Lịch sử lớp 7.',\n    24: 'Di sản Thành nhà Hồ, dấu ấn văn hoá gắn với tên tuổi Hồ Quý Ly.',\n    30: 'Khu tưởng niệm các vua nhà Mạc tại huyện Kiến Thụy, dựng trên nền điện Tường Quang thuộc cố đô Dương Kinh xưa.',\n    33: 'Cổng vào Di tích lịch sử Rạch Gầm – Xoài Mút, huyện Châu Thành, tỉnh Tiền Giang.',\n    34: 'Hành quân thần tốc, vua Quang Trung đại phá 29 vạn quân Thanh chỉ trong năm ngày.',\n    37: 'Cuộc kháng chiến của nhân dân Nam Kỳ sau Hoà ước Nhâm Tuất năm 1862.',\n    38: 'Lễ trình Hoà ước và Thương ước tại kinh thành Huế năm 1875, chín năm trước Hoà ước Patenôtre.',\n    44: 'Bến Nhà Rồng, nay là Bảo tàng Hồ Chí Minh.',\n    65: 'Quốc hội quyết nghị lấy tên nước là Cộng hòa Xã hội chủ nghĩa Việt Nam.'\n  };\n\n\n  state = { openId: null, extra: {}, vid: {} };\n\n  yearOf(d) {\n    if (/TK\\s*VII/i.test(d)) return -650;\n    const nums = (d.match(/\\d+/g) || []).map(Number);\n    let y = 0;\n    for (const n of nums) if (n > y) y = n;\n    return /TCN/.test(d) ? -y : y;\n  }\n\n  // Continuous interpolation between anchors — no hard boundary anywhere.\n  toneAt(year) {\n    const A = this.ANCHORS, C = this.HISTORICAL_COLORS;\n    if (year <= A[0][0]) return C[A[0][1]].slice();\n    const last = A[A.length - 1];\n    if (year >= last[0]) return C[last[1]].slice();\n    for (let i = 0; i < A.length - 1; i++) {\n      const [y0, k0] = A[i], [y1, k1] = A[i + 1];\n      if (year >= y0 && year <= y1) {\n        const t = y1 === y0 ? 0 : (year - y0) / (y1 - y0);\n        const a = C[k0], b = C[k1];\n        return [0, 1, 2].map(j => Math.round(a[j] + (b[j] - a[j]) * t));\n      }\n    }\n    return C.flagRed.slice();\n  }\n\n  hex(c) { return '#' + c.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join(''); }\n  rgb(c) { return c.join(','); }\n\n  relLum(c) {\n    const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };\n    return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);\n  }\n\n  contrast(a, b) {\n    const l1 = this.relLum(a), l2 = this.relLum(b);\n    const hi = Math.max(l1, l2), lo = Math.min(l1, l2);\n    return (hi + 0.05) / (lo + 0.05);\n  }\n\n  // Era colours are chosen for the rail and borders; as TEXT they must still\n  // clear 4.5:1 on the cream surface, so darken until they do.\n  ink(c) {\n    let x = c.slice();\n    for (let i = 0; i < 30 && this.contrast(x, this.SURFACE) < 4.8; i++) {\n      x = x.map(v => Math.round(v * 0.88));\n    }\n    return this.hex(x);\n  }\n\n  code(d) {\n    const bc = /TCN/.test(d);\n    const nums = d.match(/\\d+/g) || [];\n    let y = null;\n    for (const n of nums) if (!y || n.length > y.length) y = n;\n    const core = y ? y.padStart(4, '0') : 'TKVII';\n    return 'VN-' + core + (bc ? '·TCN' : '');\n  }\n\n  chapter(phase) {\n    const always = this.props.showMeaningAlways === true;\n    const all = this.DATA.events.filter(e => e.phase === phase.id);\n    const names = [...new Set(all.map(e => e.era))].reverse();\n    const eras = names.map(name => {\n      const rows = all.filter(e => e.era === name).reverse();\n      return {\n        name: name.toUpperCase(),\n        rows: rows.map(e => {\n          const core = this.CORE[e.id];\n          const isClimax = Object.prototype.hasOwnProperty.call(this.CLIMAX, e.id);\n          const ribbon = (core && core.pin) || this.CLIMAX[e.id] || '';\n          const isPin = !!(core && core.pin) || isClimax;\n          const media = this.MEDIA[e.id];\n          const year = this.yearOf(e.date);\n          const tone = this.toneAt(year);\n          // §5 — 1945 is where antique gold becomes flag gold.\n          const halo = year >= 1945 ? this.HISTORICAL_COLORS.flagGold : this.HISTORICAL_COLORS.antiqueGold;\n          const isOpen = always || this.state.openId === e.id;\n          const card = !!core || isClimax;\n          return {\n            id: e.id, date: e.date, title: e.title,\n            description: e.description, source: e.source,\n            code: this.code(e.date),\n            img: this.IMAGES[e.id] || '', hasImg: !!this.IMAGES[e.id], noImg: !this.IMAGES[e.id],\n            caption: this.CAPTIONS[e.id] || '', hasCaption: !!(this.CAPTIONS[e.id] && this.IMAGES[e.id]),\n            hasMedia: !!media,\n            hasDoc: !!(media && media.doc), docHref: (media && media.doc) || '',\n            docLabel: (media && media.docLabel) || 'Đọc toàn văn',\n            hasVideo: !!(media && media.video),\n            showVid: !!(media && media.video) && !!this.state.vid[e.id],\n            embedSrc: media ? 'https://www.youtube-nocookie.com/embed/' + media.video : '',\n            vidOpen: !!this.state.vid[e.id],\n            vidCls: this.state.vid[e.id] ? 'is-open' : '',\n            vidSign: this.state.vid[e.id] ? '−' : '+',\n            toggleVid: () => this.setState(s => ({ vid: { ...s.vid, [e.id]: !s.vid[e.id] } })),\n            slot: 'ck-' + e.id,\n            photo: 'Ảnh tư liệu: ' + e.title,\n            glyph: phase.id === 'dung_nuoc' ? '❋' : (phase.id === 'giu_nuoc' ? '★' : '❯'),\n            tone: this.hex(tone), toneRgb: this.rgb(tone), toneInk: this.ink(tone),\n            toneNext: this.hex(tone),\n            halo: this.hex(halo), haloRgb: this.rgb(halo), haloInk: this.ink(halo),\n            card, brief: !card,\n            isCore: !!core, isPin,\n            sheenCls: isClimax ? 'ribbon--sheen' : '',\n            cardCls: isPin ? 'card--pin' : (core ? 'card--core' : ''),\n            nodeCls: isPin ? 'rail-node--pin' : (core ? 'rail-node--core' : ''),\n            isOpen,\n            openCls: isOpen ? 'is-open' : '',\n            toggle: () => this.setState(s => ({ openId: s.openId === e.id ? null : e.id }))\n          };\n        })\n      };\n    }).filter(x => x.rows.length > 0);\n    return { eras };\n  }\n\n  renderVals() {\n    const chapters = this.PHASES.map(p => ({\n      ...p,\n      eras: this.chapter(p).eras,\n      isOrigin: p.id === 'dung_nuoc',\n      quote: (this.QUOTES[p.id] || {}).quote || '',\n      source: (this.QUOTES[p.id] || {}).source || '',\n      hasQuote: !!((this.QUOTES[p.id] || {}).quote),\n      bareCls: ((this.QUOTES[p.id] || {}).quote) ? '' : 'chap-hd--bare',\n      originImg: this.ORIGIN_IMG, hasOriginImg: !!this.ORIGIN_IMG, noOriginImg: !this.ORIGIN_IMG,\n      isFuture: p.id === 'phat_trien'\n    }));\n\n    // Second pass: each connector fades into the NEXT milestone shown below it,\n    // so era and chapter boundaries never produce a visible colour seam.\n    const flat = [];\n    chapters.forEach(ch => ch.eras.forEach(er => er.rows.forEach(r => flat.push(r))));\n    flat.forEach((r, i) => { r.toneNext = (flat[i + 1] || r).tone; });\n\n    // Chapter rule takes the colour of its own first milestone.\n    chapters.forEach(ch => {\n      const first = ch.eras.find(e => e.rows.length);\n      ch.tone = first ? first.rows[0].tone : this.hex(this.HISTORICAL_COLORS.bronze);\n      ch.toneInk = first ? first.rows[0].toneInk : this.ink(this.HISTORICAL_COLORS.bronze);\n      ch.toneRgb = first ? first.rows[0].toneRgb : this.rgb(this.HISTORICAL_COLORS.bronze);\n    });\n\n    return {\n      chapters,\n      originImg: this.ORIGIN_IMG,\n      hasOriginImg: !!this.ORIGIN_IMG,\n      noOriginImg: !this.ORIGIN_IMG,\n      ctaHref: this.props.ctaHref || '#'\n    };\n  }\n}\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>\n"
  </script>
